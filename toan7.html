hand('ags',[
{h:'Mở đầu',s:'Tình huống: so sánh góc và cạnh',B:{n:'Ta đã biết trong tam giác cân, hai cạnh bằng nhau thì hai góc đối diện bằng nhau. Vậy nếu hai cạnh không bằng nhau thì hai góc đối diện với chúng có so sánh được không?',a:[{t:'sort',q:'Một chiếc ê ke có các góc 30°, 60° và 90°. Sắp xếp ba cạnh theo thứ tự từ bé đến lớn. Em bấm lần lượt từng cạnh.',i:['Cạnh đối diện góc 30°','Cạnh đối diện góc 60°','Cạnh đối diện góc 90°'],h:'Góc càng lớn thì cạnh đối diện càng dài.'}]}},
{h:'1. Góc đối diện với cạnh lớn hơn trong một tam giác',s:'Góc đối diện với cạnh lớn hơn',B:{n:'Trong một tam giác, góc đối diện với cạnh lớn hơn là góc lớn hơn.',a:[{t:'mc',q:'Tam giác ABC có AB < AC. Góc nào lớn hơn?',o:['Góc B lớn hơn góc C','Góc C lớn hơn góc B','Hai góc bằng nhau'],a:0,h:'Góc đối diện với cạnh AC là góc B, góc đối diện với cạnh AB là góc C. Cạnh AC lớn hơn nên góc B lớn hơn.'}]}},
{h:'2. Cạnh đối diện với góc lớn hơn trong một tam giác',s:'Cạnh đối diện với góc lớn hơn',B:{n:'Trong một tam giác, cạnh đối diện với góc lớn hơn là cạnh lớn hơn. Trong tam giác vuông, cạnh huyền là cạnh lớn nhất. Trong tam giác tù, cạnh đối diện với góc tù là cạnh lớn nhất.',a:[{t:'num',q:'Tam giác ABC có góc A bằng 105° và góc B bằng 35°. Góc C bằng bao nhiêu độ?',u:'°',a:40,h:'180° − 105° − 35° = 40°.'},{t:'mc',q:'Cũng tam giác đó (góc A bằng 105°, góc B bằng 35°). Cạnh nào lớn nhất?',o:['BC','AB','AC'],a:0,h:'Góc A là góc lớn nhất (góc tù), nên cạnh đối diện với góc A là BC lớn nhất.'},{t:'tf',q:'Đúng hay sai? “Trong tam giác vuông, cạnh huyền là cạnh lớn nhất”.',a:true,h:'Góc vuông là góc lớn nhất nên cạnh đối diện với nó là cạnh lớn nhất.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: so sánh góc và cạnh',B:{n:'Muốn so sánh các cạnh của tam giác, em so sánh các góc đối diện. Muốn so sánh các góc, em so sánh các cạnh đối diện.',a:[{t:'mc',q:'Tam giác ABC có góc A = 50°, góc B = 60°, góc C = 70°. Cạnh nào ngắn nhất?',o:['BC','AC','AB'],a:0,h:'Góc A nhỏ nhất (50°), nên cạnh đối diện với góc A là BC ngắn nhất.'}]}}]);
hand('prp',[
{h:'Mở đầu',s:'Tình huống: đường bơi trong bể',B:{n:'Nam tập bơi ở một bể bơi hình chữ nhật có ba đường bơi OA, OB và OC. Biết OA vuông góc với bờ. Nếu xuất phát từ O và bơi cùng tốc độ, Nam muốn sang bờ bên kia nhanh nhất thì chọn đường nào?',a:[{t:'mc',q:'Đường bơi nào ngắn nhất?',o:['Đường vuông góc với bờ (OA)','Đường xiên OB','Đường xiên OC'],a:0,h:'Đường vuông góc là đường ngắn nhất. Em sẽ chứng minh điều này trong bài.'}]}},
{h:'1. Khái niệm đường vuông góc và đường xiên',s:'Đường vuông góc, đường xiên và khoảng cách từ một điểm đến một đường thẳng',B:{n:'Từ điểm A không nằm trên đường thẳng d, đoạn AH vuông góc với d là đường vuông góc, đoạn AM không vuông góc với d là đường xiên. Độ dài AH gọi là khoảng cách từ điểm A đến đường thẳng d.',a:[{t:'mc',q:'Khoảng cách từ điểm A đến đường thẳng d là gì?',o:['Độ dài đoạn vuông góc kẻ từ A đến d','Độ dài một đường xiên bất kì kẻ từ A đến d','Độ dài đường thẳng d'],a:0,h:'Khoảng cách từ A đến d là độ dài đường vuông góc AH.'}]}},
{h:'2. Quan hệ giữa đường vuông góc và đường xiên',s:'So sánh đường vuông góc và đường xiên',B:{n:'Trong các đường xiên và đường vuông góc kẻ từ một điểm nằm ngoài một đường thẳng đến đường thẳng đó, đường vuông góc là đường ngắn nhất.',a:[{t:'tf',q:'Đúng hay sai? “Từ một điểm ngoài đường thẳng d, đường xiên ngắn hơn đường vuông góc”.',a:false,h:'Đường vuông góc là đường ngắn nhất, nên ngắn hơn đường xiên.'},{t:'mc',q:'Chiều cao của tam giác ứng với một cạnh có phải là khoảng cách từ đỉnh đối diện đến đường thẳng chứa cạnh đó không?',o:['Có','Không'],a:0,h:'Chiều cao là đoạn vuông góc kẻ từ đỉnh đến đường thẳng chứa cạnh đối diện, nên độ dài của nó chính là khoảng cách đó.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: đường ngắn nhất',B:{n:'Muốn đi từ một điểm đến một đường thẳng theo đường ngắn nhất, em đi theo đường vuông góc.',a:[{t:'mc',q:'Cho tam giác cân ABC, AB = AC. M nằm giữa B và C. AM ngắn nhất khi M ở vị trí nào?',o:['M là chân đường vuông góc kẻ từ A xuống BC (trung điểm của BC)','M trùng với B','M trùng với C'],a:0,h:'AM ngắn nhất khi AM vuông góc với BC. Trong tam giác cân, đó cũng là trung điểm của BC.'}]}}]);
hand('tg3',[
{h:'Mở đầu',s:'Tình huống: đặt cột điện ở bên sông',B:{n:'Một trạm biến áp và một khu dân cư nằm ở hai bên bờ sông. Ta cần chọn địa điểm đặt cột điện sao cho tổng độ dài dây điện là ngắn nhất. Bài này giúp ta so sánh độ dài ba cạnh của một tam giác.',a:[{t:'mc',q:'Từ nhà đến trường, đi theo đoạn thẳng hay đi vòng qua một điểm khác thì ngắn hơn?',o:['Đi theo đoạn thẳng','Đi vòng'],a:0,h:'Đoạn thẳng là đường ngắn nhất nối hai điểm.'}]}},
{h:'Bất đẳng thức tam giác',s:'Bất đẳng thức tam giác',B:{n:'Trong một tam giác, tổng độ dài hai cạnh bất kì luôn lớn hơn độ dài cạnh còn lại. Đó là bất đẳng thức tam giác. Nếu ba độ dài không thoả mãn một bất đẳng thức tam giác thì chúng không phải là độ dài ba cạnh của một tam giác.',a:[{t:'mc',q:'Bộ ba độ dài nào có thể là ba cạnh của một tam giác?',o:['3 cm, 4 cm, 6 cm','2 cm, 3 cm, 5 cm','2 cm, 4 cm, 7 cm'],a:0,h:'3 + 4 = 7 lớn hơn 6, các bất đẳng thức khác cũng đúng. Ở hai bộ còn lại, tổng hai cạnh ngắn không lớn hơn cạnh dài nhất.'},{t:'tf',q:'Đúng hay sai? “Có tam giác với độ dài ba cạnh là 2,5 cm; 3,4 cm và 6 cm”.',a:false,h:'2,5 + 3,4 = 5,9 mà 5,9 < 6, không thoả mãn bất đẳng thức tam giác.'}]}},
{h:'Bất đẳng thức tam giác',s:'Độ dài một cạnh lớn hơn hiệu hai cạnh còn lại',B:{n:'Trong một tam giác, độ dài một cạnh bất kì luôn lớn hơn hiệu độ dài hai cạnh còn lại. Vậy nếu a, b, c là độ dài ba cạnh thì |b − c| < a < b + c.',a:[{t:'mc',q:'Độ dài hai cạnh của một tam giác là 7 cm và 2 cm. Cạnh còn lại là một số tự nhiên lẻ. Cạnh còn lại dài bao nhiêu xentimét?',o:['7','5','9','3'],a:0,h:'Cạnh còn lại lớn hơn 7 − 2 = 5 và bé hơn 7 + 2 = 9, nên là 6, 7 hoặc 8. Trong đó số lẻ là 7.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chu vi tam giác cân',B:{n:'Muốn biết ba độ dài có làm thành tam giác không, em kiểm tra tổng hai độ dài bé có lớn hơn độ dài lớn nhất không.',a:[{t:'num',q:'Một tam giác cân có hai cạnh dài 2 cm và 5 cm. Chu vi của tam giác bằng bao nhiêu xentimét?',u:'cm',a:12,h:'Nếu cạnh bên là 2 cm thì 2 + 2 = 4 < 5, không lập được tam giác. Vậy cạnh bên là 5 cm. Chu vi: 5 + 5 + 2 = 12 (cm).'}]}}]);
hand('mdn',[
{h:'Mở đầu',s:'Tình huống: miếng bìa tam giác thăng bằng',B:{n:'Một miếng bìa hình tam giác đặt thăng bằng trên giá nhọn tại điểm G. Điểm G được xác định như thế nào và có đặc điểm gì? Bài này sẽ trả lời câu hỏi đó.',a:[{t:'mc',q:'Đường trung tuyến của tam giác là đoạn thẳng nối đỉnh với điểm nào của cạnh đối diện?',o:['Trung điểm','Một điểm bất kì','Chân đường vuông góc'],a:0,h:'Đoạn thẳng nối đỉnh với trung điểm của cạnh đối diện là đường trung tuyến.'}]}},
{h:'1. Sự đồng quy của ba đường trung tuyến trong một tam giác',s:'Sự đồng quy của ba đường trung tuyến',B:{n:'Ba đường trung tuyến của một tam giác cùng đi qua một điểm (đồng quy). Điểm đó cách mỗi đỉnh một khoảng bằng {2/3} độ dài đường trung tuyến đi qua đỉnh ấy. Giao điểm của ba đường trung tuyến gọi là trọng tâm của tam giác.',a:[{t:'mc',q:'Giao điểm của ba đường trung tuyến của tam giác gọi là gì?',o:['Trọng tâm','Trực tâm','Tâm hình tròn'],a:0,h:'Giao điểm của ba đường trung tuyến là trọng tâm.'},{t:'num',q:'G là trọng tâm của tam giác ABC và AM là đường trung tuyến dài 9 cm. Độ dài AG bằng bao nhiêu xentimét?',u:'cm',a:6,h:'AG = {2/3} · AM = {2/3} · 9 = 6 (cm).'}]}},
{h:'2. Sự đồng quy của ba đường phân giác trong một tam giác',s:'Sự đồng quy của ba đường phân giác',B:{n:'Ba đường phân giác của một tam giác đồng quy tại một điểm. Điểm này cách đều ba cạnh của tam giác đó.',a:[{t:'tf',q:'Đúng hay sai? “Giao điểm của ba đường phân giác của tam giác cách đều ba cạnh của tam giác”.',a:true,h:'Đây là tính chất của ba đường phân giác.'},{t:'mc',q:'Trong tam giác cân tại A, giao điểm của ba đường phân giác nằm trên đường nào?',o:['Đường trung tuyến xuất phát từ đỉnh A','Cạnh BC','Cạnh AB'],a:0,h:'Trong tam giác cân tại A, đường phân giác xuất phát từ A cũng là đường trung tuyến.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: trọng tâm và đường phân giác',B:{n:'Em nhớ: trọng tâm cách đỉnh {2/3} đường trung tuyến, tâm đường phân giác cách đều ba cạnh.',a:[{t:'num',q:'G là trọng tâm của tam giác ABC. Đường trung tuyến BN dài 12 cm. Độ dài BG bằng bao nhiêu xentimét?',u:'cm',a:8,h:'BG = {2/3} · BN = {2/3} · 12 = 8 (cm).'}]}}]);
hand('cen',[
{h:'Mở đầu',s:'Tình huống: giếng chung của ba anh em',B:{n:'Ba ngôi nhà của ba anh em có thể coi là ba đỉnh của một tam giác. Họ muốn khoan một giếng chung cách đều ba ngôi nhà. Em hãy giúp họ chọn vị trí giếng.',a:[{t:'mc',q:'Điểm cách đều ba đỉnh của tam giác là giao điểm của ba đường nào?',o:['Ba đường trung trực','Ba đường trung tuyến','Ba đường cao'],a:0,h:'Đây là tính chất của ba đường trung trực, em sẽ học trong bài.'}]}},
{h:'1. Sự đồng quy của ba đường trung trực trong một tam giác',s:'Sự đồng quy của ba đường trung trực',B:{n:'Ba đường trung trực của một tam giác cùng đi qua một điểm. Điểm đó cách đều ba đỉnh của tam giác.',a:[{t:'mc',q:'Ba anh em muốn khoan giếng cách đều ba ngôi nhà. Nên khoan ở đâu?',o:['Giao điểm ba đường trung trực của tam giác tạo bởi ba ngôi nhà','Trung điểm của một cạnh','Ở ngôi nhà lớn nhất'],a:0,h:'Giao điểm ba đường trung trực cách đều ba đỉnh, tức là cách đều ba ngôi nhà.'},{t:'match',q:'Nối mỗi đường với đặc điểm của nó.',p:[['Đường trung trực','Vuông góc với cạnh tại trung điểm'],['Đường trung tuyến','Nối đỉnh với trung điểm cạnh đối diện'],['Đường cao','Vuông góc với cạnh đối diện, kẻ từ đỉnh']],h:'Mỗi đường có một đặc điểm riêng.'}]}},
{h:'2. Sự đồng quy của ba đường cao trong một tam giác',s:'Sự đồng quy của ba đường cao',B:{n:'Ba đường cao của một tam giác đồng quy tại một điểm. Điểm đó gọi là trực tâm của tam giác. Tam giác nhọn có trực tâm nằm bên trong tam giác. Tam giác vuông có trực tâm trùng với đỉnh góc vuông. Tam giác tù có trực tâm nằm bên ngoài tam giác.',a:[{t:'mc',q:'Giao điểm của ba đường cao của tam giác gọi là gì?',o:['Trực tâm','Trọng tâm'],a:0,h:'Giao điểm ba đường cao là trực tâm.'},{t:'mc',q:'Tam giác ABC vuông tại A. Trực tâm H của tam giác nằm ở đâu?',o:['Trùng với đỉnh A','Nằm trong tam giác','Nằm ngoài tam giác'],a:0,h:'Trong tam giác vuông, trực tâm trùng với đỉnh góc vuông.'},{t:'mc',q:'Tam giác tù có trực tâm nằm ở đâu?',o:['Bên ngoài tam giác','Bên trong tam giác','Trùng với một đỉnh'],a:0,h:'Với tam giác tù, ba đường cao gặp nhau ở bên ngoài tam giác.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: tam giác cân',B:{n:'Trong tam giác cân tại A, đường cao xuất phát từ đỉnh A cũng là đường trung trực, đường phân giác và đường trung tuyến.',a:[{t:'tf',q:'Đúng hay sai? “Trong tam giác cân tại A, đường cao kẻ từ A cũng là đường trung tuyến”.',a:true,h:'Đường cao từ đỉnh A xuống đáy BC cắt BC tại trung điểm, nên cũng là đường trung tuyến.'}]}}]);

{h:'1. Hình hộp chữ nhật, hình lập phương',s:'Một số yếu tố cơ bản của hình hộp chữ nhật, hình lập phương',B:{n:'Hình hộp chữ nhật có 8 đỉnh, 12 cạnh, 6 mặt và 4 đường chéo. Hình lập phương là hình hộp chữ nhật có sáu mặt đều là hình vuông.',a:[{t:'match',q:'Nối mỗi số với yếu tố của hình hộp chữ nhật.',p:[['8','đỉnh'],['12','cạnh'],['6','mặt'],['4','đường chéo']],h:'Hình hộp chữ nhật có 8 đỉnh, 12 cạnh, 6 mặt và 4 đường chéo.'},{t:'mc',q:'Hình hộp chữ nhật có mấy cạnh?',o:['12','8','6','4'],a:0,h:'Có 4 cạnh ở mặt trên, 4 cạnh ở mặt dưới và 4 cạnh đứng: 4 + 4 + 4 = 12.'}]}},
{h:'2. Diện tích xung quanh và thể tích của hình hộp chữ nhật, hình lập phương',s:'Diện tích xung quanh',B:{n:'Hình hộp chữ nhật có đáy là hình chữ nhật với các cạnh a, b và chiều cao c. Diện tích xung quanh: S<sub>xq</sub> = 2(a + b) · c. Hình lập phương cạnh a: S<sub>xq</sub> = 4a<sup>2</sup>. Khi tính, các kích thước phải cùng đơn vị đo.',a:[{t:'num',q:'Hình hộp chữ nhật có chiều dài 5 cm, chiều rộng 3 cm, chiều cao 4 cm. Diện tích xung quanh là bao nhiêu xentimét vuông?',u:'cm²',a:64,h:'S = 2(5 + 3) · 4 = 2 · 8 · 4 = 64 (cm<sup>2</sup>).'},{t:'num',q:'Hình lập phương có cạnh 3 cm. Diện tích xung quanh là bao nhiêu xentimét vuông?',u:'cm²',a:36,h:'S = 4 · 3<sup>2</sup> = 4 · 9 = 36 (cm<sup>2</sup>).'}]}},
{h:'2. Diện tích xung quanh và thể tích của hình hộp chữ nhật, hình lập phương',s:'Thể tích',B:{n:'Thể tích hình hộp chữ nhật: V = a · b · c. Thể tích hình lập phương cạnh a: V = a<sup>3</sup>. Ví dụ: xếp các hình lập phương nhỏ cạnh 1 dm vào hộp carton thành 4 lớp, mỗi lớp 2 · 5 hình, thể tích hộp là 2 · 5 · 4 = 40 dm<sup>3</sup>.',a:[{t:'num',q:'Một hộp xếp được 4 lớp hình lập phương nhỏ cạnh 1 dm, mỗi lớp có 2 · 5 hình. Thể tích của hộp là bao nhiêu đềximét khối?',u:'dm³',a:40,h:'2 · 5 · 4 = 40 (dm<sup>3</sup>).'},{t:'num',q:'Thùng giữ nhiệt có lòng trong dài 50 cm, rộng 30 cm, cao 30 cm. Dung tích của thùng là bao nhiêu xentimét khối?',u:'cm³',a:45000,h:'50 · 30 · 30 = 45 000 (cm<sup>3</sup>).'},{t:'num',q:'Lòng thùng xe đông lạnh dài 5,6 m, rộng 2 m, cao 2 m. Thể tích là bao nhiêu mét khối?',u:'m³',a:22.4,h:'5,6 · 2 · 2 = 22,4 (m<sup>3</sup>).'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: khay làm đá và hộp bìa',B:{n:'Muốn tính thể tích, em nhân ba kích thước (cùng đơn vị đo).',a:[{t:'num',q:'Khay làm đá có 18 ngăn nhỏ hình lập phương, mỗi ngăn có cạnh 2 cm. Tổng thể tích các viên đá khi đầy khay là bao nhiêu xentimét khối?',u:'cm³',a:144,h:'Mỗi viên: 2<sup>3</sup> = 8 (cm<sup>3</sup>). Cả khay: 18 · 8 = 144 (cm<sup>3</sup>).'},{t:'num',q:'Hộp bìa hình hộp chữ nhật dài 20 cm, rộng 14 cm, cao 15 cm. Thể tích của hộp là bao nhiêu xentimét khối?',u:'cm³',a:4200,h:'20 · 14 · 15 = 4 200 (cm<sup>3</sup>).'}]}}]);

{h:'1. Hình lăng trụ đứng tam giác, hình lăng trụ đứng tứ giác',s:'Một số yếu tố của hình lăng trụ đứng',B:{n:'Trong hình lăng trụ đứng tam giác (tứ giác): hai mặt đáy song song với nhau; các mặt bên là những hình chữ nhật; các cạnh bên song song và bằng nhau. Hình hộp chữ nhật và hình lập phương cũng là các hình lăng trụ đứng tứ giác.',a:[{t:'tf',q:'Đúng hay sai? “Các mặt bên của hình lăng trụ đứng là những hình chữ nhật”.',a:true,h:'Đây là nhận xét trong sách.'},{t:'mc',q:'Hình lăng trụ đứng tam giác ABC.MNP có mấy mặt bên?',o:['3','2','5','6'],a:0,h:'Có ba mặt bên là hình chữ nhật ABNM, BCPN và ACPM.'},{t:'tf',q:'Đúng hay sai? “Hình hộp chữ nhật không phải là hình lăng trụ đứng tứ giác”.',a:false,h:'Hình hộp chữ nhật cũng là một hình lăng trụ đứng tứ giác.'}]}},
{h:'2. Diện tích xung quanh và thể tích của hình lăng trụ đứng tam giác, hình lăng trụ đứng tứ giác',s:'Diện tích xung quanh',B:{n:'Diện tích xung quanh của hình lăng trụ đứng bằng chu vi đáy nhân với chiều cao: S<sub>xq</sub> = C<sub>đáy</sub> · h.',a:[{t:'num',q:'Hình lăng trụ đứng có đáy là tam giác với ba cạnh 3 cm, 4 cm, 5 cm và chiều cao 10 cm. Diện tích xung quanh là bao nhiêu xentimét vuông?',u:'cm²',a:120,h:'Chu vi đáy: 3 + 4 + 5 = 12 (cm). S = 12 · 10 = 120 (cm<sup>2</sup>).'}]}},
{h:'2. Diện tích xung quanh và thể tích của hình lăng trụ đứng tam giác, hình lăng trụ đứng tứ giác',s:'Thể tích',B:{n:'Thể tích của hình lăng trụ đứng bằng diện tích đáy nhân với chiều cao: V = S<sub>đáy</sub> · h.',a:[{t:'num',q:'Một lăng kính thuỷ tinh có đáy là tam giác diện tích 43,5 cm² và chiều cao 20 cm. Thể tích thuỷ tinh dùng làm lăng kính là bao nhiêu xentimét khối?',u:'cm³',a:870,h:'V = 43,5 · 20 = 870 (cm<sup>3</sup>).'},{t:'num',q:'Hình lăng trụ đứng có đáy là tam giác vuông với hai cạnh góc vuông 6 cm và 8 cm, chiều cao 10 cm. Thể tích là bao nhiêu xentimét khối?',u:'cm³',a:240,h:'Diện tích đáy: 6 · 8 : 2 = 24 (cm<sup>2</sup>). V = 24 · 10 = 240 (cm<sup>3</sup>).'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chiếc bánh hình lăng trụ',B:{n:'Muốn tính thể tích hình lăng trụ đứng, em cần biết diện tích đáy và chiều cao.',a:[{t:'mc',q:'Muốn tính thể tích hình lăng trụ đứng, em cần biết những gì?',o:['Diện tích đáy và chiều cao','Chỉ chu vi đáy','Chỉ số cạnh bên'],a:0,h:'V = diện tích đáy · chiều cao.'},{t:'num',q:'Một cái bánh ngọt có dạng hình lăng trụ đứng tam giác, đáy có diện tích 12 cm² và chiều cao 10 cm. Thể tích cái bánh là bao nhiêu xentimét khối?',u:'cm³',a:120,h:'V = 12 · 10 = 120 (cm<sup>3</sup>).'}]}}]);

<script>
/* ===== Chế độ đọc to Tiếng Việt ===== */
(()=>{
const SS=window.speechSynthesis,K='toan7_tts',$=s=>document.querySelector(s);
let cfg={auto:1,rate:.85};try{Object.assign(cfg,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(cfg))}catch(e){}};
let voice=null,gid=0,bar;

/* 1. Chỉ chọn giọng Tiếng Việt (vi-VN, vi_VN, "Vietnamese", "HoaiMy", "NamMinh"...) */
const isVi=v=>/^vi([-_]|$)/i.test(v.lang)||/vietnam|ti[eế]ng vi[eệ]t|hoaimy|namminh/i.test(v.name);
const sc=v=>(/natural|online/i.test(v.name)?4:0)+(/google/i.test(v.name)?3:0)+(/microsoft/i.test(v.name)?2:0);
function pick(){if(!SS)return;voice=SS.getVoices().filter(isVi).sort((a,b)=>sc(b)-sc(a))[0]||null;ui()}
if(SS){SS.onvoiceschanged=pick;pick();let n=0;const t=setInterval(()=>{if(voice||++n>10)clearInterval(t);else pick()},500)}

/* 2. Chuyển nội dung (HTML + ký hiệu toán) thành câu chữ Tiếng Việt để đọc đúng */
function norm(el,skip){
 const c=el.cloneNode(true);
 c.querySelectorAll('svg,script,style,.stk,.dots'+(skip?','+skip:'')).forEach(e=>e.remove());
 c.querySelectorAll('.f').forEach(f=>f.replaceWith(' '+f.querySelector('b').textContent+' phần '+f.querySelector('i').textContent+' '));
 c.querySelectorAll('.bl').forEach(b=>{if(!b.textContent.trim())b.replaceWith(' chỗ trống ')});
 c.querySelectorAll('li,div,p,button,h1,h2,h3,tr').forEach(e=>e.append(' . '));
 const U={mm:'mi-li-mét',cm:'xen-ti-mét',dm:'đề-xi-mét',km:'ki-lô-mét',m:'mét',kg:'ki-lô-gam',g:'gam'};
 return c.textContent
  .replace(/\p{Extended_Pictographic}|[\uFE0F\u200D✓⬅➡]/gu,' ')
  .replace(/(\d)\s*(mm|cm|dm|km|kg|m|g)\s*([²³])?(?![\p{L}\d])/gu,(m,n,u,p)=>n+' '+U[u]+(p=='²'?' vuông':p=='³'?' khối':'')+' ')
  .replace(/(\d),(\d)/g,'$1 phẩy $2')
  .replace(/(\d)\.(?=\d{3}(?!\d))/g,'$1')
  .replace(/(^|[\s(=,;:])−(?=\d)/g,'$1âm ')
  .replace(/(\d+)\s*\/\s*(\d+)/g,'$1 phần $2')
  .replace(/(^|[\s(])x(?=\s*[=+−×÷)])/g,'$1ích').replace(/([=+−×÷]\s*)x(?![\p{L}\d])/gu,'$1ích')
  .replace(/°\s*C/g,' độ xê ').replace(/°/g,' độ ')
  .replace(/√/g,' căn bậc hai của ').replace(/²/g,' bình phương ').replace(/³/g,' lập phương ')
  .replace(/≤/g,' nhỏ hơn hoặc bằng ').replace(/≥/g,' lớn hơn hoặc bằng ').replace(/≠/g,' khác ')
  .replace(/</g,' nhỏ hơn ').replace(/>/g,' lớn hơn ')
  .replace(/[−–]/g,' trừ ').replace(/\+/g,' cộng ').replace(/[×·]/g,' nhân ').replace(/÷/g,' chia ')
  .replace(/=/g,' bằng ').replace(/%/g,' phần trăm ').replace(/π/g,' pi ')
  .replace(/\s+/g,' ').replace(/([?!:;,])\s*\./g,'$1').replace(/(\s*\.\s*){2,}/g,'. ').replace(/\s+([.,!?;:])/g,'$1').trim();
}
/* Cắt câu ngắn: tránh lỗi trình duyệt tự dừng khi đọc câu dài */
const chunks=t=>{const o=[];(t.match(/[^.!?;:]+[.!?;:]*/g)||[t]).forEach(p=>{p=p.trim();while(p.length>170){let i=p.lastIndexOf(' ',170);if(i<50)i=170;o.push(p.slice(0,i));p=p.slice(i).trim()}if(/[\p{L}\d]/u.test(p))o.push(p)});return o};

/* 3. Đọc: luôn gán giọng + lang vi-VN; không có giọng Việt thì KHÔNG đọc bằng giọng khác */
let au=null;function stop(){gid++;if(au){au.pause();au=null}if(SS)SS.cancel()}
/* Dự phòng: đọc qua mạng khi máy không có giọng Tiếng Việt (cần internet) */
function net(t){stop();const id=gid,q=chunks(t);
 (function nx(i){if(id!==gid||i>=q.length)return;const a=au=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(q[i]));a.playbackRate=cfg.rate;a.onended=()=>nx(i+1);
  a.onerror=()=>{if(id===gid&&bar){const m=bar.querySelector('small');m.className='w';m.textContent='Không đọc được qua mạng. Hãy kiểm tra internet hoặc cài giọng Tiếng Việt cho máy.'}};a.play().catch(()=>{})})(0)}
{const m=document.createElement('meta');m.name='referrer';m.content='no-referrer';document.head.appendChild(m)}
function speak(t){
 if(!t)return;if(!SS)return net(t);if(!voice)pick();
 const all=SS.getVoices();
 if(!voice&&all.length)return net(t);               /* có giọng nhưng không có tiếng Việt -> báo lỗi, không đọc sai */
 stop();const id=gid;
 setTimeout(()=>{if(id!==gid)return;chunks(t).forEach(s=>{const u=new SpeechSynthesisUtterance(s);
  if(voice){u.voice=voice;u.lang=/^vi/i.test(voice.lang)?voice.lang.replace('_','-'):'vi-VN'}else u.lang='vi-VN';
  u.rate=cfg.rate;SS.speak(u)})},80);
}

/* 4. Đọc đề + các lựa chọn của câu đang làm (không đọc gợi ý) */
function readAct(){
 const ac=$('#ac');if(!ac||!ac.querySelector('.q'))return '';
 let t=norm(ac.querySelector('.q'));
 const o=[...ac.querySelectorAll('.opts button')].map(b=>norm(b)).filter(x=>x&&!/^(Đúng|Sai)\.?$/.test(x));
 if(o.length>1)t+=' Các lựa chọn là: '+o.join(' ');
  return t;
}

/* 5. Thanh điều khiển */
function build(){
 bar=document.createElement('div');bar.id='tts';bar.setAttribute('role','region');bar.setAttribute('aria-label','Đọc to');
 bar.innerHTML='<button id="tp">🔊 Đọc</button><button id="ts">⏹ Dừng</button><button id="ta"></button><button id="tr"></button><small aria-live="polite"></small>';
 document.body.appendChild(bar);const hh=()=>document.documentElement.style.setProperty('--tts-h',bar.offsetHeight+'px');hh();addEventListener('resize',hh);if(window.ResizeObserver)new ResizeObserver(hh).observe(bar);
 $('#tp').onclick=()=>{const s=String(getSelection()).trim();
  if(s){const d=document.createElement('span');d.textContent=s;return speak(norm(d))}
  speak(readAct()||norm($('#app')||document.body,'.top,.nav,#tts'))};
 $('#ts').onclick=stop;
 $('#ta').onclick=()=>{cfg.auto^=1;save();if(!cfg.auto)stop();ui()};
 $('#tr').onclick=()=>{cfg.rate=cfg.rate<.8?.85:cfg.rate<.95?1:.7;save();ui();speak('Em nghe tốc độ này nhé.')};
 ui();
}
function ui(){
 if(!bar)return;const s=bar.querySelector('small'),n=SS?SS.getVoices().length:0;
 if(!SS){s.className='';s.textContent='Đang đọc qua mạng (cần internet).'}
 else if(voice){s.className='';s.textContent='Giọng đọc: '+voice.name+' ('+voice.lang+')'}
 else if(!n){s.className='';s.textContent='Đang tải giọng đọc… (sẽ đọc theo ngôn ngữ vi-VN)'}
 else{s.className='';s.textContent='Máy chưa có giọng Tiếng Việt nên đang đọc qua mạng (cần internet). Muốn đọc không cần mạng: dùng Edge trên Windows hoặc cài giọng Tiếng Việt cho máy.'}
 $('#ta').textContent='🔁 Tự đọc '+(cfg.auto?'bật':'tắt');$('#ta').setAttribute('aria-pressed',!!cfg.auto);
 $('#tr').textContent=cfg.rate<.8?'🐢 Chậm':cfg.rate<.95?'🚶 Vừa':'🐇 Nhanh';
}

/* 6. Tự đọc khi có câu hỏi mới / phản hồi mới / gợi ý mới (không cần sửa code cũ) */
let lq=null,lf=null,nh=0,tm;
function auto(){
 if(!cfg.auto)return;
 const q=$('#ac .q'),f=$('#fb');
 if(!q){if(lq){lq=null;stop()}return}
 if(q!==lq){lq=q;lf=f&&f.firstChild;nh=document.querySelectorAll('#hn .hint').length;speak(readAct());return}
 if(f&&f.firstChild!==lf){lf=f.firstChild;speak(norm(f));return}
 const h=document.querySelectorAll('#hn .hint');
 if(h.length>nh){nh=h.length;speak('Gợi ý: '+norm(h[h.length-1]))}
}
new MutationObserver(()=>{clearTimeout(tm);tm=setTimeout(auto,300)}).observe(document.body,{childList:true,subtree:true});

/* Chạm vào khung chữ (đề, cần nhớ, gợi ý, phản hồi) để nghe lại đúng khung đó */
document.addEventListener('click',e=>{
 const el=e.target.closest('.q,.memo,.card,.hint,.msg,.ex');
 if(el&&!e.target.closest('button,input,a,#tts'))speak(norm(el));
});
build();
})();
</script>
<style>
/* ===== Mức 1 mới: dễ đọc hơn ===== */
.pg p,.sc p,.lt2 p{text-align:left!important}
.card{line-height:1.75}.card .ch{font-size:1em}
details summary{min-height:48px;display:flex;align-items:center}

<script>
/* ===== MỨC 1 MỚI: 5 bước nhỏ, bài cốt lõi, giáo viên chỉnh được ===== */
let EZ=0,LIFE=0;
const CF=()=>Object.assign({n:5,o:4,m:3,x:1,s:0},ST.cfg||{});
const cfgSet=(k,v)=>{ST.cfg=Object.assign(CF(),{[k]:v});sv0();teach()};
/* 1 = cốt lõi, 2 = chọn lọc, 3 = mở rộng (ẩn mặc định). Giáo viên nên duyệt lại bảng này. */
const TIER={frac:1,add:1,setn:1,ord:1,angle:1,par:1,tri:1,cls:1,pie:1,lin:1,rto:1,prop:1,event:1,xs:1,box:1,alg:1,pow:2,rec:2,sqrt:2,iso:2,shr:2,inv:2,pol:2,adp:2,mup:2,dvp:2,lt:2,ags:2,alt:3,thm:3,cg:3,cs:3,rtt:3,prp:3,tg3:3,mdn:3,cen:3};
const tierOf=id=>id.startsWith('mix')?2:(TIER[id]||2);
const TL=['','⭐ Cốt lõi','Chọn lọc','Mở rộng'];

/* câu hỏi đời sống dùng được cả ở Mức 1 */
Object.keys(GL).forEach(id=>{G[id]=function(lv){return(isA()||LIFE)?GL[id](lv):G0[id](lv)}});
/* số lựa chọn và độ khó theo cài đặt của giáo viên */
const _gen=gen;gen=function(id,lv,n,tt){if(isA())return _gen(id,lv,n,tt);const c=CF();return _gen(id,EZ?1:Math.min(lv,c.m),c.o,tt)};
/* số câu mỗi lượt theo cài đặt */
const _pr=prac;prac=function(id,pt,vd){_pr(id,pt,vd);if(!isA()){const c=CF();if(g.acts.length>c.n){g.acts.length=c.n;act()}}};
const pracEZ=id=>{EZ=1;prac(id,1);EZ=0};
const life=id=>{LIFE=1;prac(id,1);LIFE=0;PG()[id+'.life']=1;sv0()};

function core(id){V=()=>core(id);const q=G[id](1);
A_.innerHTML=tb(`lessonB('${id}')`)+hero(id,'1. Ý chính')+`<div class="card" style="--c:#f59e0b"><div class="ch">💡 Em nhớ</div>${MA[id]||''}</div><div class="card" style="--c:#16a34a"><div class="ch">👀 Ví dụ</div><div class="vis">${q.vis}</div><div class="q">${q.q}</div><ol class="stp">${q.h.map(z=>`<li>${z}</li>`).join('')}</ol><div class="ans">✅ Đáp án: <b>${q.a}</b></div></div>${MB[id]?`<details><summary>📚 Xem như trong sách</summary><div>${MB[id]}</div></details>`:''}<div class="opts"><button class="pri" onclick="pracEZ('${id}')">Làm cùng ➡</button><button onclick="core('${id}')">🔁 Ví dụ khác</button></div>`;
PG()[id+'.s1']=1;sv0()}

function vfb(e,id){e.outerHTML=navigator.onLine===false?'<div style="color:#fff;padding:16px;text-align:center">📶 Chưa có mạng và chưa có file video của bài này.</div>':`<iframe src="https://www.youtube-nocookie.com/embed/${VID[id]}?rel=0&modestbranding=1" title="Video bài học" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="accelerometer;encrypted-media;gyroscope;picture-in-picture;fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`}
/* Ưu tiên file videos/<mã bài>.mp4 cạnh file này (phát ngay, không cần mạng); không có file thì dùng YouTube */
const vemb=id=>`<div style="position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin:10px 0"><video controls playsinline preload="metadata" src="videos/${id}.mp4" style="position:absolute;inset:0;width:100%;height:100%" onerror="vfb(this,'${id}')"></video></div>`;
lessonB=function(id){V=()=>lessonB(id);const p=PG(),h=p[id+'.h']||[],mx=id.startsWith('mix'),c=CF(),b=L[id],
d2=h.some(x=>x[1]=='prac'&&x[4]),d3=h.some(x=>x[1]=='prac'&&!x[4]),t=p[id+'.t'],col=COL[LS[id].c];
const stp=(n,ic,tt,sub,f,ok)=>`<button class="les" style="border-left-color:${col}" onclick="${f}"><span class="ic" style="background:#eef2ff">${ic}</span><span><b>${n?n+'. ':''}${tt}</b><small>${sub}</small></span><span class="st">${ok?'✅':''}</span></button>`;
const secs=b?b.s.map((s,i)=>`<button class="les" onclick="sec('${id}',${i})"><span><b>${s.s}</b><small>${s.h}</small></span><span class="st">${p[id+'.'+i]?'✅':''}</span></button>`).join(''):'';
const book=secs?`<h2>📚 Học theo từng đề mục trong sách</h2>`+secs:'',vd=VID[id]?vemb(id):'';
if(c.s){A_.innerHTML=tb('home()')+hero(id,null,'Em làm từng bước nhỏ nhé')+vd
+(mx?'':stp(1,'📖','Ý chính','Đọc ngắn, có ví dụ',`core('${id}')`,p[id+'.s1']))
+stp(2,'🤝','Làm cùng','Câu dễ, có gợi ý',`pracEZ('${id}')`,d2)
+stp(3,'✏️','Tự làm',c.n+' câu, em tự làm',`prac('${id}')`,d3)
+(GL[id]?stp(4,'🏠','Trong đời sống','Câu chuyện quen thuộc',`life('${id}')`,p[id+'.life']):'')
+stp(5,'📝','Tự kiểm tra',t?'Lần gần nhất: '+t[0]+'/'+t[1]+' – '+lbl(t[0],t[1]):'Không có gợi ý',`qz('${id}')`,t)
+(secs?`<details><summary>📚 Xem đầy đủ theo sách (tuỳ chọn)</summary>${secs}</details>`:'')}
else{A_.innerHTML=tb('home()')+hero(id,null,'Học cùng nội dung trên lớp')+vd+book
+'<h2>✏️ Luyện tập và kiểm tra</h2>'
+stp('','🎲','Luyện tập','Câu mới mỗi lần, độ khó tự tăng giảm',`prac('${id}')`,d3)
+stp('','📝','Kiểm tra cuối bài',t?'Lần gần nhất: '+t[0]+'/'+t[1]+' – '+lbl(t[0],t[1]):'Không có gợi ý',`qz('${id}')`,t)
+`<details><summary>🧩 Cần hỗ trợ thêm? (tuỳ chọn)</summary>${mx?'':stp('','📖','Ý chính nhanh','Đọc ngắn, có ví dụ',`core('${id}')`,p[id+'.s1'])}${stp('','🤝','Làm cùng','Câu dễ, có gợi ý',`pracEZ('${id}')`,d2)}${GL[id]?stp('','🏠','Trong đời sống','Câu chuyện quen thuộc',`life('${id}')`,p[id+'.life']):''}</details>`}};

/* danh sách bài: ẩn bài mở rộng, đánh dấu bài cốt lõi */
const _hm=home;home=function(){_hm();if(!isA()){const c=CF();
A_.querySelectorAll(':scope > .les').forEach(b=>{const m=(b.getAttribute('onclick')||'').match(/lesson\('([^']+)'\)/);if(!m)return;const t=tierOf(m[1]);
if(t==3&&!c.x){b.style.display='none';return}const e=b.querySelector('b');if(e)e.insertAdjacentHTML('beforeend',`<span class="tier">${TL[t]}</span>`)});
A_.querySelectorAll(':scope > h2').forEach(h=>{let n=h.nextElementSibling,any=0;while(n&&n.tagName!='H2'){if(n.style.display!='none')any=1;n=n.nextElementSibling}if(!any)h.style.display='none'});
const hd=A_.querySelector('.hd');if(hd)hd.insertAdjacentHTML('afterend',`<div class="memo" style="font-size:.85em">⭐ là bài cốt lõi. ${c.x?'Đang hiện cả bài mở rộng.':'Một số bài mở rộng đang ẩn.'}</div>`)}V=home};

/* cài đặt cho giáo viên */
const cfgPre=m=>{ST.cfg=m?{n:3,o:2,m:1,x:0,s:1}:{n:5,o:4,m:3,x:1,s:0};sv0();teach()};
const _t3=teach;teach=function(t){_t3(t);if(tv!='B')return;const c=CF(),row=(k,lab,o)=>`<div class="top"><b style="align-self:center;min-width:9em">${lab}</b>${o.map(x=>`<button class="${c[k]==x[0]?'on':''}" onclick="cfgSet('${k}',${x[0]})">${x[1]}</button>`).join('')}</div>`;
A_.insertAdjacentHTML('beforeend',`<div class="box"><b>⚙️ Cài đặt Mức 1 cho em này</b><div class="top"><button class="${c.s?'':'on'}" onclick="cfgPre(0)">Bám sát nội dung lớp</button><button class="${c.s?'on':''}" onclick="cfgPre(1)">Hỗ trợ thêm (dễ hơn)</button></div>${row('n','Số câu mỗi lượt',[[3,'3'],[4,'4'],[5,'5']])}${row('o','Số lựa chọn mỗi câu',[[2,'2'],[3,'3'],[4,'4']])}${row('m','Độ khó cao nhất',[[1,'Nhẹ'],[2,'Vừa'],[3,'Nặng']])}${row('x','Bài mở rộng',[[0,'Ẩn'],[1,'Hiện']])}<small style="color:var(--mu)">Mặc định bám sát nội dung lớp; em cần dễ hơn thì chọn “Hỗ trợ thêm”. Cài đặt này chỉ áp dụng cho Mức 1 trên thiết bị này.</small></div>`)};
const _t4=teach;teach=function(t){_t4(t);const h=A_.querySelector('h1');if(!h||!ST.profiles)return;
const nm=id=>{const p=ST.profiles.find(x=>x.id==id);return p?pEsc(p.name):''};
let ap='';
if(PF&&(PF.m=='add'||PF.m=='ren'))ap=`<div class="nr"><input id="pfn" maxlength="20" autocomplete="off" placeholder="Tên hoặc ký hiệu của em" aria-label="Tên của em" value="${PF.m=='ren'?nm(PF.id):''}" onkeydown="if(event.key=='Enter')profOk()"></div><div class="top"><button class="pri" onclick="profOk()">✔ Lưu</button><button onclick="profCancel()">Hủy</button></div>`;
else if(PF&&PF.m=='del')ap=`<div class="memo" style="font-size:.9em">Xoá hồ sơ <b>${nm(PF.id)}</b> và toàn bộ kết quả học của em này?</div><div class="top"><button class="pri" onclick="profOk()">🗑 Xoá</button><button onclick="profCancel()">Không xoá</button></div>`;
else if(PF&&PF.m=='last')ap=`<div class="memo" style="font-size:.9em">Cần giữ lại ít nhất một hồ sơ.</div><div class="top"><button onclick="profCancel()">Đóng</button></div>`;
h.insertAdjacentHTML('afterend',`<div class="box"><b>👥 Hồ sơ các em</b><div><small style="color:var(--mu)">Mỗi em có mức học, cài đặt và kết quả riêng. Đang xem: <b>${pEsc(pCur().name)}</b>.</small></div>${ST.profiles.map(p=>`<div class="top"><b style="align-self:center;flex:1;min-width:6em">${p.id==ST.cur?'✔ ':''}${pEsc(p.name)}</b>${p.id==ST.cur?'':`<button onclick="profUse(${p.id})">Chọn</button>`}<button onclick="profRen(${p.id})">✏️ Đổi tên</button><button onclick="profDel(${p.id})">🗑 Xoá</button></div>`).join('')}${ap}${PF&&PF.m=='add'?'':`<div class="top"><button class="pri" onclick="profAdd()">➕ Thêm em</button></div>`}</div>`);
const i=document.getElementById('pfn');if(i){i.focus();i.setSelectionRange&&i.setSelectionRange(i.value.length,i.value.length)}};
const _h4=home;home=function(){_h4();const hd=A_.querySelector('.hd');if(hd&&ST.profiles&&ST.profiles.length>1)hd.insertAdjacentHTML('beforeend','<div>👤 '+pEsc(pCur().name)+'</div>')};
</script>
<script>
/* ===== Học trực quan + Gợi ý bài học ===== */
const QL=s=>document.querySelector(s),gcdL=(a,b)=>b?gcdL(b,a%b):Math.abs(a),lcmL=(a,b)=>a/gcdL(a,b)*b;
const frL=(p,q)=>{const g=gcdL(p,q)||1;p/=g;q/=g;return q==1?(p<0?'−':'')+Math.abs(p):(p<0?'−':'')+Math.abs(p)+'/'+q};
const LABS={frac:{ic:'📏',t:'Trục số kéo thả',d:'Kéo điểm đến đúng vị trí của số hữu tỉ'},add:{ic:'🧩',t:'Cộng phân số bằng mô hình',d:'Xem vì sao phải quy đồng mẫu số'},par:{ic:'📐',t:'Đường thẳng song song và góc so le trong',d:'Xoay, nghiêng và quan sát các góc'}};
const LAB_OF={frac:'frac',setn:'frac',sqrt:'frac',add:'add',par:'par',alt:'par',angle:'par'};
function openLab(k){let o=QL('#lab');if(!o){o=document.createElement('div');o.id='lab';document.body.appendChild(o)}
 o.innerHTML=`<div class="lbh"><b>${LABS[k].ic} ${LABS[k].t}</b><span><button onclick="labSay()">🔊 Nghe</button> <button onclick="closeLab()">✖ Đóng</button></span></div><div class="lbb" id="lbb"></div>`;o.style.display='block';document.body.style.overflow='hidden';({frac:lab1,add:lab2,par:lab3})[k](QL('#lbb'))}
window.labSay=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(QL('.lbq').innerText.replace(/a\/b/,'a trên b').replace(/c\/d/,'c trên d'));u.lang='vi-VN';u.rate=.9;speechSynthesis.speak(u)};
const closeLab=()=>{QL('#lab').style.display='none';document.body.style.overflow=''};
function lab1(R){const T=[[-3,4],[5,4],[-1,2],[7,2],[-5,3],[1,3],[-7,4]];let n=1,x=0,tg=T[0],ok=0,ix=0;const X=v=>30+(v+3.5)*(300/7),A=isA();
 const draw=()=>{let s=`<line x1="14" y1="90" x2="346" y2="90" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>`;
  for(let i=-3*n;i<=3*n;i++){const v=i/n,big=i%n==0;s+=`<line x1="${X(v)}" y1="${90-(big?16:9)}" x2="${X(v)}" y2="${90+(big?16:9)}" stroke="${big?'#334155':'#f59e0b'}" stroke-width="${big?3:2.5}"/>`;if(big)s+=`<text x="${X(v)}" y="124" text-anchor="middle" font-size="15" font-weight="700" fill="currentColor">${v<0?'−'+-v:v}</text>`}
  s+=`<g id="pt" style="cursor:grab;touch-action:none"><circle cx="${X(x)}" cy="90" r="30" fill="#2563eb" opacity=".15"/><circle cx="${X(x)}" cy="90" r="18" fill="#2563eb" stroke="#fff" stroke-width="3"/><text x="${X(x)}" y="56" text-anchor="middle" font-size="17" font-weight="800" fill="#2563eb">${frL(Math.round(x*n),n)}</text></g>`;
  QL('#sv').innerHTML=s;const g=QL('#pt'),svg=QL('#sv'),mv=e=>{const r=svg.getBoundingClientRect(),v=((e.clientX-r.left)/r.width*360-30)/(300/7)-3.5;x=Math.max(-3,Math.min(3,Math.round(v*n)/n));draw()};
  g.onpointerdown=e=>{g.setPointerCapture(e.pointerId);svg.onpointermove=mv;svg.onpointerup=()=>{svg.onpointermove=null;chk()}};};
 const chk=()=>{const m=QL('#ms');if(Math.abs(x-tg[0]/tg[1])<1e-9){ok++;m.className='ok';m.innerHTML=`🎉 Chính xác! ${frL(tg[0],tg[1])} nằm ${tg[0]<0?'bên trái':'bên phải'} số 0. Đã đúng ${ok} lần.`}else{m.className='';m.innerHTML=`Điểm đang ở <b>${frL(Math.round(x*n),n)}</b>. ${Math.round(x*n)%n==0&&tg[1]>1?'Hãy chia mỗi đoạn đơn vị thành nhiều phần hơn bằng thanh trượt.':'Cố lên, em sắp tới rồi!'}`}};
 const nw=()=>{ix=(ix+1)%T.length;tg=T[ix];x=0;n=A?tg[1]:1;QL('#nn').value=n;QL('#tt').textContent=frL(tg[0],tg[1]);QL('#nv').textContent=n;QL('#ms').innerHTML='';draw()};
 R.innerHTML=`<p class="lbq">Hãy đặt điểm vào đúng vị trí số <b id="tt" class="chip">${frL(tg[0],tg[1])}</b></p><svg id="sv" viewBox="0 0 360 140" width="100%"></svg><label class="lbs">Chia mỗi đoạn đơn vị thành <b id="nv">1</b> phần<input id="nn" type="range" min="1" max="8" value="1"></label><div id="ms" role="status"></div><div class="lbr"><button onclick="lbHint()">💡 Gợi ý</button><button class="pri" onclick="lbNew()">Đề mới ➜</button></div><p class="lbn">Vì sao? Số ${frL(tg[0],tg[1])} có mẫu số là ${tg[1]}, nên ta chia mỗi đoạn đơn vị thành ${tg[1]} phần bằng nhau rồi đếm.</p>`;
 QL('#nn').oninput=e=>{n=+e.target.value;QL('#nv').textContent=n;x=Math.round(x*n)/n;draw()};window.lbNew=nw;window.lbHint=()=>{QL('#ms').innerHTML=`💡 Chia mỗi đoạn thành <b>${tg[1]}</b> phần, rồi đếm <b>${Math.abs(tg[0])}</b> vạch ${tg[0]<0?'sang trái':'sang phải'} từ số 0.`};if(A){n=tg[1];QL('#nn').value=n;QL('#nv').textContent=n}draw()}
function lab2(R){let a=1,b=2,c=1,d=3,q=0;const U=150,bar=(y,p,m,col,u=1)=>{let s='';for(let i=0;i<m*u;i++)s+=`<rect x="${10+i*U/m}" y="${y}" width="${U/m}" height="34" fill="${i<p?col:'#fff'}" stroke="#334155" stroke-width="2"/>`;return s};
 const draw=()=>{const m=lcmL(b,d),x=a*m/b,y=c*m/d,S=x+y;let s=`<text x="10" y="18" font-size="14" font-weight="700" fill="currentColor">${frL(a,b)}</text>`+bar(24,q?x:a,q?m:b,'#2dd4bf')+`<text x="10" y="86" font-size="14" font-weight="700" fill="currentColor">${frL(c,d)}</text>`+bar(92,q?y:c,q?m:d,'#fb923c')+(q?`<text x="10" y="154" font-size="14" font-weight="700" fill="#7c4dff">Tổng = ${frL(S,m)}</text>`+bar(160,S,m,'#7c4dff',2):'');
  QL('#sv').innerHTML=s;QL('#ex').innerHTML=q?`Quy đồng: BCNN(${b}, ${d}) = <b>${m}</b>. Vậy ${frL(a,b)} = ${x}/${m} và ${frL(c,d)} = ${y}/${m}. Cộng hai tử số: ${x} + ${y} = ${S}. Kết quả: <b>${S}/${m}${gcdL(S,m)>1?' = '+frL(S,m):''}</b>`:`${b==d?'Hai phân số cùng mẫu số, có thể cộng tử số ngay.':'Hai phân số <b>khác mẫu số</b> nên các phần chưa bằng nhau. Bấm “Quy đồng” để chia lại cho cùng cỡ.'}`;QL('#qb').textContent=q?'↩ Trở lại':'🧩 Quy đồng';QL('#sv').setAttribute('viewBox',`0 0 340 ${q?210:140}`)};
 R.innerHTML=`<p class="lbq">Cộng <b class="chip">a/b</b> + <b class="chip" style="background:#ffedd5;color:#c2410c">c/d</b> bằng mô hình băng giấy</p><svg id="sv" width="100%"></svg><div class="lbg"><label>a <input type="range" id="ra" min="0" max="${b}" value="${a}"></label><label>b <input type="range" id="rb" min="2" max="8" value="${b}"></label><label>c <input type="range" id="rc" min="0" max="${d}" value="${c}"></label><label>d <input type="range" id="rd" min="2" max="8" value="${d}"></label></div><div id="ex" class="ms2"></div><div class="lbr"><button class="pri" id="qb" onclick="lbQ()">🧩 Quy đồng</button></div>`;
 const sync=()=>{a=+QL('#ra').value;b=+QL('#rb').value;c=+QL('#rc').value;d=+QL('#rd').value;QL('#ra').max=b;QL('#rc').max=d;a=Math.min(a,b);c=Math.min(c,d);draw()};['ra','rb','rc','rd'].forEach(i=>QL('#'+i).oninput=sync);window.lbQ=()=>{q^=1;draw()};draw()}
function lab3(R){let dl=0,ph=65;const arc=(cx,cy,v1,v2,col,r=34)=>{const n1=Math.hypot(...v1),n2=Math.hypot(...v2),p1=[cx+v1[0]/n1*r,cy+v1[1]/n1*r],p2=[cx+v2[0]/n2*r,cy+v2[1]/n2*r],sw=v1[0]*v2[1]-v1[1]*v2[0]>0?1:0;return`<path d="M${cx} ${cy}L${p1[0]} ${p1[1]}A${r} ${r} 0 0 ${sw} ${p2[0]} ${p2[1]}Z" fill="${col}" fill-opacity=".55" stroke="${col}" stroke-width="2"/>`};
 const draw=()=>{const r=Math.PI/180,f=ph*r,e=dl*r,Ax=170,Ay=70,L=110,Bx=Ax+L*Math.cos(f),By=Ay+L*Math.sin(f),ex=[Math.cos(e),-Math.sin(e)],u=[Math.cos(f),Math.sin(f)];
  const ln=(x,y,v,c)=>`<line x1="${x-v[0]*400}" y1="${y-v[1]*400}" x2="${x+v[0]*400}" y2="${y+v[1]*400}" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`;
  const aA=ph,aB=Math.round(ph+dl),par=dl==0;
  QL('#sv').innerHTML=ln(Ax,Ay,[1,0],'#2563eb')+ln(Bx,By,ex,'#ea580c')+ln(Ax,Ay,u,'#64748b')+arc(Ax,Ay,[1,0],u,'#16a34a')+arc(Bx,By,[-ex[0],-ex[1]],[-u[0],-u[1]],par?'#16a34a':'#dc2626')+`<text x="12" y="${Ay-8}" font-size="15" font-weight="800" fill="#2563eb">a</text><text x="12" y="${By-8}" font-size="15" font-weight="800" fill="#ea580c">b</text><text x="${Ax+38}" y="${Ay+22}" font-size="14" font-weight="800" fill="#16a34a">${aA}°</text><text x="${Bx-62}" y="${By-12}" font-size="14" font-weight="800" fill="${par?'#16a34a':'#dc2626'}">${aB}°</text>`;
  QL('#ex').innerHTML=par?`✅ <b>a // b</b>. Hai góc so le trong bằng nhau: ${aA}° = ${aB}°. Đây chính là dấu hiệu nhận biết hai đường thẳng song song.`:`Hai góc so le trong là ${aA}° và ${aB}°: <b>không bằng nhau</b> nên a và b <b>chưa song song</b>. Hãy nghiêng đường b về vị trí 0°.`;};
 R.innerHTML=`<p class="lbq">Kéo thanh trượt để làm cho <b class="chip">a</b> và <b class="chip" style="background:#ffedd5;color:#c2410c">b</b> song song</p><svg id="sv" viewBox="0 0 340 250" width="100%"></svg><div class="lbg"><label>Nghiêng đường b: <b id="dv">0</b>° <input id="rdl" type="range" min="-35" max="35" value="12"></label><label>Xoay cát tuyến: <b id="pv">65</b>° <input id="rph" type="range" min="35" max="145" value="65"></label></div><div id="ex" class="ms2"></div>`;
 const sy=()=>{dl=+QL('#rdl').value;ph=+QL('#rph').value;QL('#dv').textContent=dl;QL('#pv').textContent=ph;if(ph+dl<5||ph+dl>175)dl=Math.max(5-ph,Math.min(175-ph,dl));draw()};QL('#rdl').oninput=QL('#rph').oninput=sy;sy()}
/* ---- Gợi ý bài học theo tiến độ ---- */
function suggest(){const ids=CH.flatMap(c=>c[1].map(l=>l[0])),P=PG(),done=id=>Object.keys(P).some(k=>k.indexOf(id+'.')==0&&k!=id+'.t'),sc=id=>P[id+'.t'],A=isA();
 const weak=A?null:ids.find(id=>sc(id)&&sc(id)[0]/sc(id)[1]<.7),nx=ids.find(id=>!done(id)&&!/^mix/.test(id))||ids.find(id=>!done(id)),L=id=>LS[id].t,out=[];
 if(nx)out.push(`<button class="sg main" onclick="lesson('${nx}')"><span>▶️</span><b>${done(ids[0])?'Học tiếp':'Bắt đầu học'}: ${L(nx)}<small>${done(ids[0])?'Bài tiếp theo trong lộ trình của em.':'Em bắt đầu từ đây nhé!'}</small></b></button>`);
 if(weak)out.push(`<button class="sg" onclick="lesson('${weak}')"><span>🔁</span><b>Ôn lại: ${L(weak)}<small>Lần kiểm tra gần nhất em đúng ${sc(weak)[0]}/${sc(weak)[1]} câu. Ôn một chút là tốt hơn ngay!</small></b></button>`);
 return`<section class="sgw"><h3>💡 Việc tiếp theo của em</h3>${out.join('')}</section>`}
function labCards(){return`<details class="sgw"><summary>🔬 Thực hành thêm bằng tay (không bắt buộc)</summary><div class="labg">${Object.keys(LABS).map(k=>`<button class="labc" onclick="openLab('${k}')"><span>${LABS[k].ic}</span><b>${LABS[k].t}</b><small>${LABS[k].d}</small></button>`).join('')}</div></details>`}
const _homeLab=home;home=function(){_homeLab();const a=QL('#app'),h=a.querySelector('.hd');if(h&&!a.querySelector('.sgw')){h.insertAdjacentHTML('afterend',suggest());a.insertAdjacentHTML('beforeend',labCards())}};
['lesson','lessonB'].forEach(n=>{const o=window[n];if(typeof o=='function')window[n]=function(id){o.apply(this,arguments);const lb=LAB_OF[id],a=QL('#app'),h=a.querySelector('.memo')||a.querySelector('.hero');if(lb&&h&&!a.querySelector('.labbtn'))h.insertAdjacentHTML('afterend',`<button class="labbtn" onclick="openLab('${lb}')"><span>${LABS[lb].ic}</span><b>Thử bằng tay: ${LABS[lb].t}<small>${LABS[lb].d}. Em làm thử rồi mới làm bài nhé.</small></b></button>`)}});
</script>
