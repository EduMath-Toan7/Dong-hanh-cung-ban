<style>

.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.chip{border:2px solid var(--bd);border-radius:12px;padding:4px 8px;font-size:1.6em;background:var(--cd)}.chip small{display:block;font-size:.5em}.big0{font-size:3em;text-align:center}
.tb{border-collapse:collapse;margin:auto}.tb th,.tb td{border:2px solid var(--bd);padding:6px 14px;font-size:1.2em}.tb th{background:var(--wb)}.rt{white-space:nowrap}.rt .ov{border-top:2px solid currentColor;padding:0 3px;margin-left:1px}.vis svg{background:#fff;color:#1d2433;border-radius:12px}.vis .f,.q .f{color:inherit}

:root{--bg:#f5f8ff}

.box{border-top:8px solid var(--pr)}.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}.sum div{background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:10px;text-align:center}.sum b{display:block;font-size:1.5em;color:var(--pr)}.sum small{color:var(--mu)}
.tg2.w{background:var(--wb)}details{background:var(--cd);border:2px solid var(--bd);border-radius:14px;padding:8px 12px;margin:8px 0}summary{cursor:pointer;font-weight:700}

frac:`<b>Số hữu tỉ</b> là số viết được dưới dạng ${fr('a','b')} với a, b ∈ ℤ, b ≠ 0. Tập hợp số hữu tỉ kí hiệu là ℚ. Số hữu tỉ âm nằm bên trái điểm 0 trên trục số. Hai số đối nhau: ${fr('a','b')} và ${fr('−a','b')}. So sánh: quy đồng về mẫu dương rồi so sánh các tử số.`,

ord:`Biểu thức không có ngoặc: lũy thừa → nhân, chia → cộng, trừ (làm từ trái sang phải). Biểu thức có ngoặc: làm trong ngoặc trước: ( ) rồi [ ] rồi { }.`,
rec:`Số thập phân vô hạn tuần hoàn có một nhóm chữ số lặp lại mãi, gọi là <b>chu kì</b>, viết trong dấu ngoặc. Ví dụ ${fr(1,3)} = 0,(3); ${fr(1,6)} = 0,1(6). Mỗi số hữu tỉ viết được thành số thập phân hữu hạn hoặc vô hạn tuần hoàn.`,
sqrt:`<b>Căn bậc hai số học</b> của số a ≥ 0 là số x ≥ 0 sao cho x² = a, kí hiệu ${rt('a')}. Ví dụ ${rt(49)} = 7. Số thập phân vô hạn không tuần hoàn gọi là <b>số vô tỉ</b>, ví dụ ${rt(2)}.`,
setn:`Số hữu tỉ và số vô tỉ hợp thành tập hợp <b>số thực</b> ℝ. Mỗi số thực ứng với một điểm trên trục số. Ta có ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Số đối của a là −a.`,
angle:`Góc nhọn: 0° &lt; số đo &lt; 90°. Góc vuông: 90°. Góc tù: 90° &lt; số đo &lt; 180°. Góc bẹt: 180°. Hai góc kề bù có tổng bằng 180°. Hai góc đối đỉnh thì bằng nhau.`,
par:`Hai đường thẳng phân biệt trong một mặt phẳng: hoặc cắt nhau, hoặc song song (không có điểm chung). Kí hiệu a // b. Dấu hiệu: hai đường thẳng bị cắt bởi đường thẳng thứ ba tạo một cặp góc so le trong bằng nhau thì chúng song song.`,
alt:`<b>Tiên đề Euclid</b>: qua một điểm nằm ngoài đường thẳng a, chỉ có một đường thẳng song song với a. Nếu a // b và đường thẳng c cắt chúng thì: các góc so le trong bằng nhau; các góc đồng vị bằng nhau.`,
thm:`<b>Định lí</b> là khẳng định được chứng minh. Định lí có dạng “Nếu … thì …”: phần sau “nếu” là <b>giả thiết</b> (điều cho trước), phần sau “thì” là <b>kết luận</b> (điều cần suy ra).`,
tri:`Tổng ba góc của một tam giác bằng 180°. Góc ngoài của tam giác bằng tổng hai góc trong không kề với nó. Trong tam giác vuông, hai góc nhọn có tổng bằng 90°.`,
cg:`Hai tam giác bằng nhau khi có các cạnh tương ứng bằng nhau và các góc tương ứng bằng nhau. Viết ΔABC = ΔDEF: các đỉnh viết theo đúng thứ tự tương ứng.`,
cs:`Hai tam giác bằng nhau theo: <b>c.c.c</b> (ba cạnh bằng nhau); <b>c.g.c</b> (hai cạnh và góc xen giữa bằng nhau); <b>g.c.g</b> (hai góc và cạnh xen giữa bằng nhau).`,
rtt:`Tam giác vuông có một góc vuông. Cạnh đối diện góc vuông là <b>cạnh huyền</b> (cạnh dài nhất), hai cạnh còn lại là <b>cạnh góc vuông</b>. Hai tam giác vuông bằng nhau nếu: hai cạnh góc vuông bằng nhau; hoặc cạnh góc vuông và góc nhọn kề bằng nhau; hoặc cạnh huyền và một góc nhọn bằng nhau; hoặc cạnh huyền và một cạnh góc vuông bằng nhau.`,
iso:`Tam giác cân có hai cạnh bằng nhau; hai góc ở đáy bằng nhau. Tam giác có hai góc bằng nhau là tam giác cân. Tam giác đều có ba cạnh bằng nhau và mỗi góc bằng 60°.`,
cls:`Dữ liệu có thể là <b>số</b> (đếm hoặc đo được) hoặc <b>không phải số</b> (tên, màu sắc…). Khi thu thập, cần ghi đủ, đúng và phân loại rõ ràng.`,
chart:`<b>Biểu đồ cột</b>: chiều cao mỗi cột cho biết số liệu của đối tượng ở dưới cột. Cột cao hơn thì số liệu lớn hơn.`,
pie:`<b>Biểu đồ hình quạt tròn</b>: cả hình tròn là 100% (tức 1). Mỗi hình quạt là một phần của tổng. Nửa hình tròn là 50% = ${fr(1,2)}; một phần tư là 25% = ${fr(1,4)}.`,
lin:`<b>Biểu đồ đoạn thẳng</b> biểu diễn sự thay đổi của số liệu theo thời gian. Đoạn đi lên: tăng. Đoạn đi xuống: giảm. Đoạn nằm ngang: không đổi.`,
rto:`<b>Tỉ lệ thức</b>: ${fr('a','b')} = ${fr('c','d')} (b, d ≠ 0). Tính chất: a · d = b · c. Từ đó tìm được số còn thiếu.`,
shr:`Dãy tỉ số bằng nhau: ${fr('a','b')} = ${fr('c','d')} = ${fr('a + c','b + d')} (b + d ≠ 0). Chia một số theo tỉ lệ m : n: mỗi phần bằng tổng ÷ (m + n).`,
prop:`Nếu y = k · x (k ≠ 0) thì y <b>tỉ lệ thuận</b> với x theo hệ số tỉ lệ k = y ÷ x. Khi x tăng gấp bao nhiêu lần thì y cũng tăng gấp bấy nhiêu lần.`,
inv:`Nếu x · y = a (a ≠ 0) thì y <b>tỉ lệ nghịch</b> với x. Khi x tăng gấp bao nhiêu lần thì y giảm đi bấy nhiêu lần.`,
alg:`<b>Biểu thức đại số</b> gồm số, chữ (biến) và các phép toán. Tính giá trị: thay chữ bằng số đã cho rồi thực hiện phép tính theo đúng thứ tự.`,
pol:`<b>Đa thức một biến</b> là tổng các đơn thức của cùng một biến, ví dụ 3x² + 2x − 5. <b>Bậc</b> của đa thức là số mũ lớn nhất của biến. Hệ số của x² là số đứng ngay trước x².`,
adp:`Cộng, trừ đa thức: bỏ ngoặc (chú ý dấu), rồi cộng, trừ các hạng tử đồng dạng (cùng phần biến). Ví dụ 3x + 2x = 5x.`,
mup:`Nhân đơn thức: nhân hệ số với hệ số, nhân các phần biến. Ví dụ 2x · 3 = 6x. Nhân đơn thức với đa thức: a(b + c) = ab + ac.`,
dvp:`Chia đơn thức cho số khác 0: chia hệ số cho số đó. Ví dụ 6x : 3 = 2x. Chia ${sup('x','m')} cho ${sup('x','n')}: ${sup('x','m − n')} (m ≥ n).`,
event:`Biến cố <b>chắc chắn</b>: luôn xảy ra. Biến cố <b>không thể</b>: không bao giờ xảy ra. Biến cố <b>ngẫu nhiên</b> (có thể): có thể xảy ra, cũng có thể không.`,
ags:`Trong một tam giác: góc lớn hơn thì đối diện với cạnh lớn hơn; cạnh lớn hơn thì đối diện với góc lớn hơn.`,
prp:`Từ điểm A nằm ngoài đường thẳng d, đoạn vuông góc kẻ đến d ngắn hơn mọi đường xiên. Độ dài đoạn vuông góc là <b>khoảng cách</b> từ A đến d.`,
tg3:`<b>Bất đẳng thức tam giác</b>: trong một tam giác, tổng hai cạnh bất kì lớn hơn cạnh còn lại. Ba đoạn thẳng tạo được tam giác khi tổng hai đoạn ngắn nhất lớn hơn đoạn dài nhất.`,
mdn:`Trung điểm M của BC: MB = MC. <b>Trung tuyến</b> nối đỉnh với trung điểm cạnh đối diện; ba đường trung tuyến đồng quy tại <b>trọng tâm</b>. Ba đường phân giác đồng quy tại một điểm cách đều ba cạnh.`,
cen:`Đường trung trực của đoạn thẳng vuông góc với đoạn thẳng tại trung điểm. Ba đường trung trực đồng quy tại điểm cách đều ba đỉnh. Ba đường cao đồng quy tại <b>trực tâm</b>.`,
box:`Hình hộp chữ nhật và hình lập phương đều có 6 mặt, 8 đỉnh, 12 cạnh. Hình hộp chữ nhật có các mặt là hình chữ nhật; hình lập phương có các mặt là hình vuông bằng nhau.`};

alg:`Chữ x là số chưa biết. Muốn tìm x: lấy kết quả trừ đi số đã biết. Tính giá trị: thay x bằng số rồi tính (nhân trước, cộng sau).`,
pol:`Số đứng ngay trước chữ x là hệ số. Số nhỏ ở trên x (như x²) là số mũ. Số mũ lớn nhất là bậc.`,

ags:`Góc lớn thì cạnh đối diện dài. Góc bé thì cạnh đối diện ngắn.`,
prp:`Từ một điểm đến đường thẳng, đoạn thẳng đứng (vuông góc) là ngắn nhất.`,

mdn:`Trung điểm ở chính giữa đoạn thẳng, chia đoạn thẳng thành hai phần bằng nhau.`,
cen:`Ba đường trung tuyến gặp nhau ở trọng tâm. Ba đường cao gặp nhau ở trực tâm.`,
box:`Hình hộp chữ nhật có 6 mặt, 8 đỉnh, 12 cạnh. Hình lập phương cũng vậy, các mặt đều là hình vuông.`};

{h:'Mở đầu',s:'Tình huống: chiếc cân thăng bằng',B:{n:'Gọi x (kg) là cân nặng quả bưởi. Cân ở trạng thái thăng bằng nên 5,1 + x = 7. Ta cần tìm x.',a:[{t:'num',q:'Quả bưởi nặng bao nhiêu kilôgam, biết 5,1 + x = 7?',u:'kg',a:1.9,h:'x = 7 − 5,1 = 1,9.'}]}},
{h:'1. Thứ tự thực hiện các phép tính',s:'Thứ tự thực hiện các phép tính',B:{n:'Biểu thức không có dấu ngoặc: luỹ thừa, rồi nhân và chia, rồi cộng và trừ. Biểu thức có dấu ngoặc: thực hiện trong ngoặc trước, ngoài ngoặc sau, theo thứ tự ( ), [ ], { }. Biểu thức chỉ có cộng, trừ hoặc chỉ có nhân, chia: làm từ trái sang phải.',a:[{t:'sort',q:'Sắp xếp thứ tự thực hiện các phép tính. Em bấm lần lượt từng mục.',i:['Trong ngoặc','Luỹ thừa','Nhân và chia','Cộng và trừ'],h:'Ngoặc trước, rồi luỹ thừa, rồi nhân chia, cuối cùng cộng trừ.'},{t:'num',q:'Tính giá trị: 1,2 − 3<sup>2</sup> + 7,5 : 3.',a:-5.3,h:'Luỹ thừa và chia trước: 3<sup>2</sup> = 9; 7,5 : 3 = 2,5. Rồi 1,2 − 9 + 2,5 = −5,3.'},{t:'mc',q:'Tính (6,8 − 2) : 3.',o:['1,6','4,8','2,27','1,2'],a:0,h:'Trong ngoặc trước: 6,8 − 2 = 4,8. Rồi 4,8 : 3 = 1,6.'}]}},
{h:'2. Quy tắc chuyển vế',s:'Đẳng thức',B:{n:'Đẳng thức A = B có vế trái là A và vế phải là B. Nếu a = b thì a + c = b + c. Nếu a + c = b + c thì a = b. Nếu a = b thì b = a.',a:[{t:'match',q:'Nối mỗi vế với biểu thức của đẳng thức 2 − (b + 1) = 2b + 2.',p:[['Vế trái','2 − (b + 1)'],['Vế phải','2b + 2']],h:'Vế trái đứng trước dấu “=”, vế phải đứng sau dấu “=”.'},{t:'tf',q:'Khẳng định sau đúng hay sai? “Nếu a = b thì a + 5 = b + 5”.',a:true,h:'Cộng cùng một số vào hai vế của một đẳng thức thì được đẳng thức mới.'}]}},
{h:'2. Quy tắc chuyển vế',s:'Quy tắc chuyển vế',B:{n:'Khi chuyển một số hạng từ vế này sang vế kia của một đẳng thức, ta phải đổi dấu số hạng đó: dấu “+” đổi thành dấu “−” và dấu “−” đổi thành dấu “+”. Nếu a + b = c thì a = c − b. Nếu a − b = c thì a = c + b.',a:[{t:'num',q:'Tìm x, biết x + 7,25 = 15,75.',a:8.5,h:'Chuyển 7,25 sang vế phải: x = 15,75 − 7,25 = 8,5.'},{t:'mc',q:'Tìm x, biết x − {1/2} = {3/4}.',o:['{5/4}','{1/4}','{−1/4}','{3/8}'],a:0,h:'Chuyển {1/2} sang vế phải và đổi dấu: x = {3/4} + {1/2} = {3/4} + {2/4} = {5/4}.'},{t:'fill',q:'Từ x + 3 = 10, chuyển 3 sang vế phải ta được x = 10 ___ 3.',c:['−'],b:['−','+','·'],h:'Dấu “+” đổi thành dấu “−”.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: khối lượng thịt trong bánh chưng',B:{n:'Khối lượng thịt bằng khối lượng cả cái bánh trừ đi khối lượng gạo, đậu xanh và lá dong.',a:[{t:'num',q:'Một cái bánh chưng nặng 0,8 kg gồm 0,5 kg gạo; 0,125 kg đậu xanh; 0,04 kg lá dong, còn lại là thịt. Khối lượng thịt là bao nhiêu kilôgam?',u:'kg',a:0.135,h:'0,8 − 0,5 − 0,125 − 0,04 = 0,135 (kg).'}]}}]);

hand('rec',[
{h:'Mở đầu',s:'Tình huống: hai bạn viết phân số thành số thập phân',B:{n:'Khi viết {4/5} dưới dạng số thập phân bằng phép chia, ta được 0,8 và phép chia dừng lại. Nhưng khi chia 5 cho 18, phép chia không bao giờ chấm dứt.',a:[{t:'num',q:'Viết {4/5} dưới dạng số thập phân.',a:0.8,h:'4 : 5 = 0,8.'}]}},
{h:'1. Số thập phân vô hạn tuần hoàn',s:'Số thập phân hữu hạn và số thập phân vô hạn tuần hoàn',B:{n:'Khi chia 5 cho 18, trong thương 0,2777… chữ số 7 được lặp lại mãi. Số 0,2777… là số thập phân vô hạn tuần hoàn, viết gọn là 0,2(7); số 7 là chu kì. Các số như 0,8; 1,25 là số thập phân hữu hạn. Mọi số hữu tỉ đều viết được dưới dạng số thập phân hữu hạn hoặc vô hạn tuần hoàn.',a:[{t:'match',q:'Nối mỗi số với cách viết gọn.',p:[['0,2777…','0,2(7)'],['1,545454…','1,(54)'],['0,31818…','0,3(18)']],h:'Nhóm chữ số lặp lại mãi được đặt trong dấu ngoặc tròn.'},{t:'mc',q:'Chu kì của số 0,3(18) là gì?',o:['18','3','81','318'],a:0,h:'Chu kì là nhóm chữ số lặp lại mãi. Ở đây là 18.'},{t:'mc',q:'Viết {1/9} dưới dạng số thập phân.',o:['0,(1)','0,1','0,9','1,9'],a:0,h:'1 : 9 = 0,111… Chữ số 1 lặp lại mãi nên viết là 0,(1).'},{t:'tf',q:'Khẳng định sau đúng hay sai? “0,8 là số thập phân vô hạn tuần hoàn”.',a:false,h:'0,8 chỉ có một chữ số thập phân nên là số thập phân hữu hạn.'}]}},
{h:'2. Làm tròn số thập phân căn cứ vào độ chính xác cho trước',s:'Làm tròn số thập phân căn cứ vào độ chính xác cho trước',B:{n:'Số thập phân vô hạn được làm tròn tương tự số thập phân hữu hạn. Độ chính xác 50 nghĩa là làm tròn đến hàng trăm. Độ chính xác 0,05 nghĩa là làm tròn đến hàng phần mười.',a:[{t:'mc',q:'Làm tròn số 12 591,27 với độ chính xác 50.',o:['12 600','12 591,3','12 590','13 000'],a:0,h:'Độ chính xác 50 nghĩa là làm tròn đến hàng trăm. Vậy 12 591,27 ≈ 12 600.'},{t:'num',q:'Làm tròn số 12591,27 với độ chính xác 0,05.',a:12591.3,h:'Độ chính xác 0,05 nghĩa là làm tròn đến hàng phần mười: 12 591,27 ≈ 12 591,3.'},{t:'mc',q:'Làm tròn số 3,14159 với độ chính xác 0,005.',o:['3,14','3,1','3,142','3,15'],a:0,h:'Độ chính xác 0,005 nghĩa là làm tròn đến hàng phần trăm: 3,14159 ≈ 3,14.'}]}},
{h:'Luyện tập – Vận dụng',s:'Luyện tập',B:{n:'Muốn viết phân số dưới dạng số thập phân, ta chia tử số cho mẫu số. Nếu phép chia không dừng, ta tìm chu kì rồi viết gọn.',a:[{t:'mc',q:'Số nào sau đây là số thập phân vô hạn tuần hoàn?',o:['−1,(23)','0,1','−6,725','2,5'],a:0,h:'Số −1,(23) có nhóm chữ số 23 lặp lại mãi.'},{t:'mc',q:'Dùng chu kì để viết gọn số 0,010101…',o:['0,(01)','0,0(1)','0,(1)','0,01'],a:0,h:'Nhóm chữ số 01 lặp lại mãi nên chu kì là 01: 0,(01).'}]}}]);
hand('sqrt',[
{h:'Mở đầu',s:'Tình huống: cạnh hình vuông có diện tích 2 dm²',B:{n:'Hình vuông ghép từ hai tam giác vuông có diện tích 2 dm<sup>2</sup>. Nếu cạnh của nó là x (dm), x &gt; 0, thì x<sup>2</sup> = 2. Không có số hữu tỉ nào mà bình phương bằng 2.',a:[{t:'mc',q:'Hình vuông có cạnh x (dm) và diện tích 2 dm<sup>2</sup>. Điều kiện nào đúng?',o:['x<sup>2</sup> = 2','x = 2','2x = 2','x + x = 2'],a:0,h:'Diện tích hình vuông bằng cạnh nhân cạnh: x · x = x<sup>2</sup>.'}]}},
{h:'1. Số vô tỉ',s:'Số vô tỉ',B:{n:'Số vô tỉ là số viết được dưới dạng số thập phân vô hạn không tuần hoàn. Tập hợp các số vô tỉ kí hiệu là I. Ví dụ: π = 3,14159265358…; √2 = 1,4142135623…',a:[{t:'match',q:'Nối mỗi số với loại số.',p:[['0,5','Số thập phân hữu hạn'],['0,(3)','Số thập phân vô hạn tuần hoàn'],['√2','Số vô tỉ']],h:'Số vô tỉ có phần thập phân vô hạn và không lặp lại theo chu kì.'},{t:'mc',q:'Số nào là số vô tỉ?',o:['π','0,25','0,(3)','−7'],a:0,h:'π = 3,14159… là số thập phân vô hạn không tuần hoàn.'},{t:'tf',q:'Khẳng định sau đúng hay sai? “Số 0,1010010001… (sau dấu phẩy viết liên tiếp 10; 100; 1 000;…) là số vô tỉ”.',a:true,h:'Các chữ số không lặp lại theo chu kì, nên đây là số thập phân vô hạn không tuần hoàn.'}]}},
{h:'2. Căn bậc hai số học',s:'Căn bậc hai số học',B:{n:'Căn bậc hai số học của một số a không âm, kí hiệu là √a, là số x không âm sao cho x<sup>2</sup> = a. Ví dụ: √100 = 10 vì 10<sup>2</sup> = 100 và 10 &gt; 0.',a:[{t:'match',q:'Nối mỗi căn bậc hai số học với giá trị của nó.',p:[['√9','3'],['√16','4'],['√81','9'],['√121','11']],h:'Tìm số không âm mà bình phương của nó bằng số trong dấu căn.'},{t:'mc',q:'Cạnh hình vuông có diện tích 81 dm<sup>2</sup> dài bao nhiêu đềximét?',o:['9','8,1','40,5','81'],a:0,h:'Cạnh x thoả mãn x<sup>2</sup> = 81 và x &gt; 0, nên x = √81 = 9.'},{t:'tf',q:'Khẳng định sau đúng hay sai? “Căn bậc hai số học của 49 là −7”.',a:false,h:'Căn bậc hai số học là số không âm, nên √49 = 7.'}]}},
{h:'2. Căn bậc hai số học',s:'Tính căn bậc hai số học bằng máy tính cầm tay',B:{n:'Ta dùng máy tính cầm tay để tính căn bậc hai số học. Màn hình chỉ hiển thị hữu hạn chữ số nên kết quả là số thập phân vô hạn được làm tròn. Căn bậc hai số học của một số tự nhiên không phải là số chính phương luôn là một số vô tỉ.',a:[{t:'mc',q:'Biết √2 ≈ 1,414213562. Làm tròn √2 đến chữ số thập phân thứ hai.',o:['1,41','1,42','1,4','1,414'],a:0,h:'Chữ số thập phân thứ ba là 4 (nhỏ hơn 5) nên giữ nguyên: 1,41.'},{t:'num',q:'Biết √91 ≈ 9,539392014. Làm tròn đến chữ số thập phân thứ tư.',a:9.5394,h:'Chữ số thập phân thứ năm là 9 (từ 5 trở lên) nên tăng chữ số thứ tư lên 1: 9,5393 → 9,5394.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: cạnh hình vuông và lát sân',B:{n:'Cạnh hình vuông có diện tích S là √S. Đổi cùng một đơn vị đo trước khi tính số viên gạch.',a:[{t:'mc',q:'Cạnh hình vuông có diện tích 3 600 m<sup>2</sup> dài bao nhiêu mét?',o:['60','600','36','1 800'],a:0,h:'√3 600 = 60 vì 60<sup>2</sup> = 3 600.'},{t:'num',q:'Lát một sân hình vuông có diện tích 100 m<sup>2</sup> bằng các viên gạch hình vuông cạnh 50 cm. Cần bao nhiêu viên gạch?',a:400,h:'Cạnh sân: √100 = 10 (m) = 1 000 cm. Mỗi cạnh lát 1 000 : 50 = 20 viên. Tổng cộng 20 · 20 = 400 viên.'}]}}]);
hand('setn',[
{h:'Mở đầu',s:'Tình huống: lại thêm số thực?',B:{n:'Số tự nhiên, số nguyên, số hữu tỉ, số vô tỉ đều là những số đã biết. Số hữu tỉ và số vô tỉ được gọi chung là số thực.',a:[{t:'mc',q:'Số hữu tỉ và số vô tỉ được gọi chung là gì?',o:['Số thực','Số nguyên','Số tự nhiên','Số thập phân hữu hạn'],a:0,h:'Số hữu tỉ và số vô tỉ hợp lại thành tập hợp các số thực, kí hiệu là ℝ.'}]}},
{h:'1. Khái niệm số thực và trục số thực',s:'Số thực là gì?',B:{n:'Số hữu tỉ và số vô tỉ được gọi chung là số thực. Tập hợp các số thực kí hiệu là ℝ. Mỗi số thực a đều có một số đối là −a. Trong ℝ có các phép toán với các tính chất như trong ℚ.',a:[{t:'tf',q:'Khẳng định sau đúng hay sai? “√2 ∈ ℝ”.',a:true,h:'√2 là số vô tỉ, mà mọi số vô tỉ đều là số thực.'},{t:'tf',q:'Khẳng định sau đúng hay sai? “π ∈ ℚ”.',a:false,h:'π là số vô tỉ, không viết được dưới dạng phân số, nên π không thuộc ℚ.'},{t:'mc',q:'Số đối của số 5,08(299) là số nào?',o:['−5,08(299)','5,08(299)','−5,(08)','0'],a:0,h:'Số đối của a là −a.'}]}},
{h:'1. Khái niệm số thực và trục số thực',s:'Trục số thực',B:{n:'Mỗi số thực đều được biểu diễn bởi một điểm trên trục số. Ngược lại, mỗi điểm trên trục số đều biểu diễn một số thực. Các số thực lấp đầy trục số nên trục số còn gọi là trục số thực. Hai số đối nhau có điểm biểu diễn nằm về hai phía của gốc O và cách đều O.',a:[{t:'mc',q:'Điểm biểu diễn số √2 nằm giữa hai số nguyên nào?',o:['1 và 2','2 và 3','0 và 1','−2 và −1'],a:0,h:'Vì 1<sup>2</sup> = 1 &lt; 2 &lt; 4 = 2<sup>2</sup> nên 1 &lt; √2 &lt; 2.'},{t:'tf',q:'Khẳng định sau đúng hay sai? “Mỗi điểm trên trục số đều biểu diễn một số thực”.',a:true,h:'Các số thực lấp đầy trục số.'}]}},
{h:'2. Thứ tự trong tập hợp các số thực',s:'Thứ tự trong tập hợp các số thực',B:{n:'Với hai số thực a và b bất kì, ta luôn có a = b hoặc a &lt; b hoặc a &gt; b. Nếu a &lt; b và b &lt; c thì a &lt; c. Trên trục số, nếu a &lt; b thì điểm a nằm trước điểm b. Nếu 0 &lt; a &lt; b thì √a &lt; √b.',a:[{t:'mc',q:'So sánh √2 và √5.',o:['√2 &lt; √5','√2 &gt; √5','√2 = √5'],a:0,h:'Vì 2 &lt; 5 nên √2 &lt; √5.'},{t:'sort',q:'Sắp xếp các số theo thứ tự từ bé đến lớn. Em bấm lần lượt từng số.',i:['−2','0','√2','2'],h:'Số âm bé nhất, rồi đến 0. Vì √2 ≈ 1,41 nên √2 bé hơn 2.'},{t:'mc',q:'So sánh 1,313233… và 1,(32).',o:['1,313233… &lt; 1,(32)','1,313233… &gt; 1,(32)','Hai số bằng nhau'],a:0,h:'Viết 1,(32) = 1,323232… Ở hàng phần trăm: 1 &lt; 2 nên số thứ nhất bé hơn.'}]}},
{h:'3. Giá trị tuyệt đối của một số thực',s:'Giá trị tuyệt đối của một số thực',B:{n:'Giá trị tuyệt đối của số thực a, kí hiệu |a|, là khoảng cách từ điểm a đến gốc O. |a| = a khi a ≥ 0; |a| = −a khi a &lt; 0. Hai số đối nhau có giá trị tuyệt đối bằng nhau.',a:[{t:'match',q:'Nối mỗi giá trị tuyệt đối với kết quả.',p:[['|−3,5|','3,5'],['|0|','0'],['|−4|','4'],['|2,5|','2,5']],h:'Giá trị tuyệt đối của số âm là số đối của nó.'},{t:'num',q:'Tính |−7|.',a:7,h:'−7 là số âm nên |−7| = −(−7) = 7.'},{t:'tf',q:'Khẳng định sau đúng hay sai? “Có hai số thực x thoả mãn |x| = 2,5”.',a:true,h:'Hai số đó là 2,5 và −2,5, cùng cách gốc O một khoảng 2,5.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: số thực, thứ tự và giá trị tuyệt đối',B:{n:'Em kết hợp những điều đã học: nhận biết số vô tỉ, so sánh các số thực và tính giá trị tuyệt đối.',a:[{t:'mc',q:'Trong các số 0,(5); −3; √7; 2,5, số nào là số vô tỉ?',o:['√7','0,(5)','−3','2,5'],a:0,h:'7 không là số chính phương nên √7 là số thập phân vô hạn không tuần hoàn.'},{t:'num',q:'Tìm số tự nhiên x thoả mãn |x| = 5.',a:5,h:'Hai số có giá trị tuyệt đối bằng 5 là 5 và −5. Số tự nhiên là 5.'}]}}]);

{h:'1. Góc ở vị trí đặc biệt',s:'Hai góc kề bù',B:{n:'Hai góc kề bù là hai góc có một cạnh chung, hai cạnh còn lại là hai tia đối nhau. Hai góc kề bù có tổng số đo bằng 180°.',a:[{t:'num',q:'Hai góc kề bù, một góc bằng 60°. Góc còn lại bằng bao nhiêu độ?',u:'°',a:120,h:'180° − 60° = 120°.'},{t:'mc',v:clock(6),q:'Lúc 6 giờ, hai kim đồng hồ nằm thẳng hàng. Góc giữa hai kim là góc bẹt. Góc bẹt bằng bao nhiêu độ?',o:['180°','90°','360°','60°'],a:0,h:'Hai góc kề bù có tổng bằng góc bẹt, tức là 180°.'},{t:'tf',q:'Đúng hay sai? “Hai góc kề bù có tổng số đo bằng 90°”.',a:false,h:'Tổng hai góc kề bù bằng 180°, không phải 90°.'}]}},

{h:'2. Tia phân giác của một góc',s:'Tia phân giác của một góc',B:{n:'Tia nằm giữa hai cạnh của một góc và tạo với hai cạnh ấy hai góc bằng nhau là tia phân giác của góc đó. Nếu Oz là tia phân giác của góc xOy thì mỗi góc xOz và zOy bằng một nửa góc xOy.',a:[{t:'mc',v:pizza(),q:'Đường màu đỏ chia góc của miếng bánh thành hai góc bằng nhau. Đường đó là gì?',o:['Tia phân giác','Tia đối','Đường vuông góc'],a:0,h:'Tia chia góc thành hai góc bằng nhau là tia phân giác.'},{t:'num',q:'Tia Ot là tia phân giác của góc mOn bằng 70°. Góc mOt bằng bao nhiêu độ?',u:'°',a:35,h:'Mỗi góc bằng một nửa góc mOn: 70° : 2 = 35°.'},{t:'num',q:'Tia Am là tia phân giác của góc xAy. Góc xAm bằng 65°. Góc xAy bằng bao nhiêu độ?',u:'°',a:130,h:'Góc xAy gấp đôi góc xAm: 65° + 65° = 130°.'}]}},

{h:'Luyện tập – Vận dụng',s:'Vận dụng: kiểm tra hai đường thẳng',B:{n:'Để biết hai đường thẳng có song song không, em tìm một đường thẳng cắt cả hai rồi so sánh các cặp góc.',a:[{t:'mc',q:'Hai góc MNQ và PQN cùng bằng 35° và ở vị trí so le trong. Hai đường thẳng MN và QP như thế nào?',o:['Song song','Cắt nhau','Vuông góc'],a:0,h:'Có một cặp góc so le trong bằng nhau nên MN song song với QP.'}]}}]);

hand('thm',[
{h:'Mở đầu',s:'Tình huống: đo đạc có chắc chắn không?',B:{n:'Đo đạc chỉ cho kết quả gần đúng và chỉ trong một trường hợp cụ thể. Vì vậy ta cần chứng minh để chắc chắn một tính chất đúng trong mọi trường hợp.',a:[{t:'tf',q:'Đúng hay sai? “Đo đạc cho kết quả chính xác trong mọi trường hợp”.',a:false,h:'Đo đạc chỉ cho kết quả gần đúng, trong một trường hợp cụ thể.'}]}},
{h:'1. Định lí. Giả thiết và kết luận của định lí',s:'Định lí, giả thiết và kết luận',B:{n:'Định lí là một khẳng định được suy ra từ những điều đúng đã biết. Trong định lí cần phân biệt giả thiết (điều đã cho) và kết luận (điều cần suy ra). Ta viết tắt là GT và KL.',a:[{t:'match',q:'Với định lí “Hai góc đối đỉnh thì bằng nhau”, nối mỗi phần với tên của nó.',p:[['Hai góc đối đỉnh','Giả thiết'],['Hai góc đó bằng nhau','Kết luận']],h:'Giả thiết là điều đã cho. Kết luận là điều cần suy ra.'},{t:'match',q:'Nối kí hiệu với tên gọi.',p:[['GT','Giả thiết'],['KL','Kết luận']],h:'GT là chữ viết tắt của giả thiết. KL là chữ viết tắt của kết luận.'}]}},
{h:'2. Chứng minh định lí',s:'Chứng minh định lí',B:{n:'Chứng minh một định lí là dùng lập luận để từ giả thiết và những điều đúng đã biết suy ra kết luận của định lí.',a:[{t:'sort',q:'Sắp xếp các bước chứng minh “hai góc đối đỉnh thì bằng nhau”. Em bấm lần lượt từng bước.',i:['Hai góc đối đỉnh cùng kề bù với một góc','Tổng mỗi cặp góc kề bù bằng 180°','Suy ra hai góc đối đỉnh bằng nhau'],h:'Đi từ điều đã biết đến điều cần chứng minh.'},{t:'tf',q:'Đúng hay sai? “Hai góc bằng nhau thì đối đỉnh”.',a:false,h:'Chưa chắc. Chỉ cần một ví dụ hai góc bằng nhau nhưng không đối đỉnh là đủ để thấy điều này sai.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: hai góc kề bù bằng nhau',B:{n:'Em nhớ lại: hai góc kề bù có tổng số đo bằng 180°.',a:[{t:'mc',q:'Hai góc kề bù bằng nhau. Mỗi góc bằng bao nhiêu độ?',o:['90°','180°','45°','60°'],a:0,h:'Hai góc có tổng 180° và bằng nhau nên mỗi góc là 180° : 2 = 90°.'},{t:'mc',q:'Trong định lí “Nếu hai đường thẳng song song bị cắt bởi một đường thẳng thì hai góc so le trong bằng nhau”, phần “hai góc so le trong bằng nhau” là gì?',o:['Kết luận','Giả thiết'],a:0,h:'Đó là điều cần suy ra, nên là kết luận.'}]}}]);

const fan=()=>{const p=a=>[110+90*Math.cos(a*Math.PI/180),125-90*Math.sin(a*Math.PI/180)],cl=['#f9a8d4','#fde047','#93c5fd'],an=[0,50,120,180];return sv(220,150,`<rect width="220" height="150" rx="16" fill="#f0f9ff"/>`+cl.map((c,i)=>{const a=p(an[i]),b=p(an[i+1]);return`<path d="M110 125L${a[0]} ${a[1]}A90 90 0 0 0 ${b[0]} ${b[1]}Z" fill="${c}" stroke="#1e293b" stroke-width="2"/>`}).join('')+`<line x1="14" y1="125" x2="206" y2="125" stroke="#1e293b" stroke-width="3"/>`)};
const twin=()=>sv(300,140,`<rect width="300" height="140" rx="16" fill="#fef9c3"/><polygon points="30,115 120,115 60,35" fill="#fb923c" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/><polygon points="170,115 260,115 200,35" fill="#fb923c" stroke="#9a3412" stroke-width="3" stroke-linejoin="round"/><text x="138" y="82" font-size="28" font-weight="700" fill="#1e293b">=</text>`);
const poles=()=>sv(300,150,`<rect width="300" height="150" rx="16" fill="#e0f2fe"/><text x="10" y="40" font-size="34">🌞</text><rect y="120" width="300" height="30" fill="#86efac"/><rect x="70" y="50" width="10" height="70" fill="#92400e"/><rect x="190" y="50" width="10" height="70" fill="#92400e"/><rect x="75" y="120" width="60" height="8" rx="4" fill="#475569"/><rect x="195" y="120" width="60" height="8" rx="4" fill="#475569"/>`);
const roof=()=>sv(260,160,`<rect width="260" height="160" rx="16" fill="#e0f2fe"/><rect x="60" y="85" width="140" height="60" fill="#fde68a" stroke="#92400e" stroke-width="3"/><polygon points="40,90 130,25 220,90" fill="#ef4444" stroke="#7f1d1d" stroke-width="3" stroke-linejoin="round"/><rect x="115" y="105" width="30" height="40" fill="#92400e"/>`);
const seg=()=>sv(300,140,`<rect width="300" height="140" rx="16" fill="#f5f3ff"/><line x1="40" y1="95" x2="260" y2="95" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/><line x1="150" y1="20" x2="150" y2="125" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 6"/><circle cx="40" cy="95" r="8" fill="#2563eb"/><circle cx="260" cy="95" r="8" fill="#2563eb"/><circle cx="150" cy="95" r="7" fill="#16a34a"/><text x="32" y="125" font-size="20" font-weight="700">A</text><text x="254" y="125" font-size="20" font-weight="700">B</text>`);
Object.assign(LA,{tri:[{v:fan(),q:'Ba góc của tam giác được ghép cạnh nhau như hình và tạo thành một đường thẳng. Đó là góc gì?',o:['Góc bẹt','Góc vuông'],a:0,h:'Ba góc ghép thành một đường thẳng. Đó là góc bẹt, bằng 180°.'}],
cg:[{v:twin(),q:'Hai miếng bìa hình tam giác chồng khít lên nhau. Hai tam giác ấy như thế nào?',o:['Bằng nhau','Khác nhau'],a:0,h:'Chồng khít lên nhau là bằng nhau.'}],
cs:[{v:twin(),q:'Hai tam giác có hai cạnh và góc ở giữa bằng nhau thì bằng nhau. Hai tam giác trong hình có bằng nhau không?',o:['Bằng nhau','Khác nhau'],a:0,h:'Hai hình giống hệt nhau nên bằng nhau.'}],
rtt:[{v:poles(),q:'Hai cột cao bằng nhau, nắng chiếu như nhau. Bóng của hai cột như thế nào?',o:['Dài bằng nhau','Dài khác nhau'],a:0,h:'Hai tam giác vuông tạo bởi cột và bóng bằng nhau, nên hai bóng dài bằng nhau.'}],
iso:[{v:roof(),q:'Hai mái nhà nghiêng như nhau. Hai cạnh bên của mái nhà như thế nào?',o:['Bằng nhau','Khác nhau'],a:0,h:'Tam giác có hai cạnh bằng nhau là tam giác cân.'},{v:seg(),q:'Nếp gấp đỏ đi qua điểm giữa của đoạn thẳng AB và vuông góc với AB. Nếp gấp đó gọi là gì?',o:['Đường trung trực','Đường song song'],a:0,h:'Đường vuông góc với đoạn thẳng tại trung điểm là đường trung trực.'}]});
hand('tri',[
{h:'Mở đầu',s:'Tình huống: lát nền bằng gạch hình tam giác',B:{n:'Người ta xếp những viên gạch hình tam giác giống hệt nhau để lát nền. Ba góc của tam giác ghép lại cạnh nhau sẽ tạo thành một góc đặc biệt.',a:[{t:'mc',q:'Ba góc của một tam giác ghép lại cạnh nhau thành góc gì?',o:['Góc bẹt','Góc vuông','Góc nhọn','Góc tù'],a:0,h:'Cắt ba góc rồi ghép lại, ta được một đường thẳng, tức là góc bẹt 180°.'}]}},
{h:'1. Tổng các góc trong một tam giác',s:'Tổng ba góc trong một tam giác',B:{n:'Tổng ba góc trong một tam giác bằng 180°. Nếu tam giác ABC có các góc A, B, C thì góc A + góc B + góc C = 180°.',a:[{t:'num',q:'Một tam giác có hai góc bằng 65° và 55°. Góc còn lại bằng bao nhiêu độ?',u:'°',a:60,h:'180° − 65° − 55° = 60°.'},{t:'num',q:'Một tam giác có hai góc bằng 40° và 60°. Góc còn lại bằng bao nhiêu độ?',u:'°',a:80,h:'180° − 40° − 60° = 80°.'},{t:'tf',q:'Đúng hay sai? “Một tam giác có thể có hai góc vuông”.',a:false,h:'Hai góc vuông đã có tổng 180°, không còn chỗ cho góc thứ ba.'}]}},
{h:'1. Tổng các góc trong một tam giác',s:'Tam giác nhọn, tam giác tù, tam giác vuông',B:{n:'Tam giác có ba góc nhọn là tam giác nhọn. Tam giác có một góc tù là tam giác tù. Tam giác có một góc vuông là tam giác vuông. Trong tam giác vuông, hai góc nhọn có tổng bằng 90° (hai góc phụ nhau).',a:[{t:'match',q:'Nối mỗi đặc điểm với loại tam giác.',p:[['Ba góc đều nhọn','Tam giác nhọn'],['Có một góc tù','Tam giác tù'],['Có một góc vuông','Tam giác vuông']],h:'Nhìn vào các góc của tam giác.'},{t:'num',q:'Tam giác ABC vuông tại A, góc B bằng 35°. Góc C bằng bao nhiêu độ?',u:'°',a:55,h:'Hai góc nhọn có tổng 90°. Vậy 90° − 35° = 55°.'}]}},
{h:'1. Tổng các góc trong một tam giác',s:'Góc ngoài của tam giác',B:{n:'Góc ngoài tại đỉnh C của tam giác ABC là góc kề bù với góc C của tam giác. Mỗi góc ngoài của tam giác bằng tổng hai góc trong không kề với nó.',a:[{t:'num',q:'Tam giác ABC có góc A bằng 50° và góc B bằng 60°. Góc ngoài tại đỉnh C bằng bao nhiêu độ?',u:'°',a:110,h:'Góc ngoài tại C bằng tổng hai góc không kề với nó: 50° + 60° = 110°.'},{t:'tf',q:'Đúng hay sai? “Góc ngoài tại một đỉnh của tam giác kề bù với góc trong tại đỉnh đó”.',a:true,h:'Đó chính là định nghĩa góc ngoài.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: tìm góc chưa biết',B:{n:'Em dùng tổng ba góc bằng 180° để tìm góc chưa biết.',a:[{t:'num',q:'Một tam giác có ba góc bằng nhau. Mỗi góc bằng bao nhiêu độ?',u:'°',a:60,h:'180° : 3 = 60°.'},{t:'mc',q:'Tam giác vuông có hai góc nhọn bằng nhau. Mỗi góc nhọn bằng bao nhiêu độ?',o:['45°','30°','60°','90°'],a:0,h:'Hai góc nhọn có tổng 90°. Vậy mỗi góc là 90° : 2 = 45°.'}]}}]);
hand('cg',[
{h:'Mở đầu',s:'Tình huống: thế nào là hai tam giác bằng nhau?',B:{n:'Hai đoạn thẳng bằng nhau nếu có cùng độ dài. Hai góc bằng nhau nếu có cùng số đo. Vậy hai tam giác thế nào thì gọi là bằng nhau?',a:[{t:'mc',q:'Hai tam giác chồng khít lên nhau thì hai tam giác đó như thế nào?',o:['Bằng nhau','Khác nhau','Không so sánh được'],a:0,h:'Hai tam giác chồng khít lên nhau là hai tam giác bằng nhau.'}]}},
{h:'1. Hai tam giác bằng nhau',s:'Hai tam giác bằng nhau',B:{n:'Hai tam giác bằng nhau nếu chúng có các cạnh tương ứng bằng nhau và các góc tương ứng bằng nhau. Khi đó ta viết tam giác ABC = tam giác A′B′C′.',a:[{t:'num',q:'Tam giác ABC bằng tam giác DEF. Biết BC = 4 cm. Cạnh EF dài bao nhiêu xentimét?',u:'cm',a:4,h:'BC và EF là hai cạnh tương ứng nên bằng nhau: EF = 4 cm.'},{t:'num',q:'Tam giác ABC bằng tam giác DEF, góc ABC bằng 40°, góc ACB bằng 60°. Góc EDF bằng bao nhiêu độ?',u:'°',a:80,h:'Góc A = 180° − 40° − 60° = 80°. Góc EDF tương ứng với góc A nên cũng bằng 80°.'}]}},
{h:'2. Trường hợp bằng nhau thứ nhất của tam giác: cạnh – cạnh – cạnh (c.c.c)',s:'Trường hợp cạnh – cạnh – cạnh',B:{n:'Nếu ba cạnh của tam giác này bằng ba cạnh của tam giác kia thì hai tam giác đó bằng nhau. Trường hợp này gọi là cạnh – cạnh – cạnh, viết tắt là c.c.c.',a:[{t:'mc',q:'Tam giác ABC và tam giác MNP có AB = MN, BC = NP, CA = PM. Hai tam giác đó như thế nào?',o:['Bằng nhau (c.c.c)','Không bằng nhau','Chưa kết luận được'],a:0,h:'Ba cặp cạnh tương ứng bằng nhau nên hai tam giác bằng nhau theo c.c.c.'},{t:'sort',q:'Sắp xếp các bước chứng minh tam giác ACB = tam giác BDA, biết AC = BD và AD = BC. Em bấm lần lượt từng bước.',i:['AC = BD (theo giả thiết)','BC = AD (theo giả thiết)','AB là cạnh chung','Vậy hai tam giác bằng nhau (c.c.c)'],h:'Tìm đủ ba cặp cạnh bằng nhau rồi mới kết luận.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chứng minh hai tam giác bằng nhau',B:{n:'Muốn chứng minh hai tam giác bằng nhau theo c.c.c, em tìm đủ ba cặp cạnh tương ứng bằng nhau. Cạnh chung cũng được tính là một cặp.',a:[{t:'mc',q:'Hai tam giác ABC và ABD có AC = AD, BC = BD và chung cạnh AB. Hai tam giác đó có bằng nhau không?',o:['Bằng nhau (c.c.c)','Không bằng nhau'],a:0,h:'Có AC = AD, BC = BD và AB là cạnh chung. Đủ ba cặp cạnh bằng nhau.'}]}}]);
hand('cs',[
{h:'Mở đầu',s:'Tình huống: không đo được hết các cạnh',B:{n:'Trong thực tế, nhiều khi ta không đo được hết các cạnh của hai tam giác. Khi đó ta có những cách khác để biết hai tam giác có bằng nhau hay không.',a:[{t:'tf',q:'Đúng hay sai? “Muốn biết hai tam giác bằng nhau, lúc nào cũng phải đo cả ba cạnh và ba góc”.',a:false,h:'Chỉ cần kiểm tra ba yếu tố thích hợp, như em sẽ học trong bài này.'}]}},
{h:'1. Trường hợp bằng nhau thứ hai của tam giác: cạnh – góc – cạnh (c.g.c)',s:'Trường hợp cạnh – góc – cạnh',B:{n:'Góc xen giữa hai cạnh là góc nằm giữa hai cạnh đó. Nếu hai cạnh và góc xen giữa của tam giác này bằng hai cạnh và góc xen giữa của tam giác kia thì hai tam giác đó bằng nhau. Trường hợp này viết tắt là c.g.c.',a:[{t:'mc',q:'Tam giác ABC và tam giác ADC có AB = AD, góc BAC = góc DAC và chung cạnh AC. Hai tam giác đó như thế nào?',o:['Bằng nhau (c.g.c)','Không bằng nhau','Chưa biết'],a:0,h:'Có hai cạnh AB = AD, AC chung và góc xen giữa bằng nhau.'},{t:'tf',q:'Đúng hay sai? “Hai tam giác có hai cặp cạnh bằng nhau thì bằng nhau”.',a:false,h:'Còn phải có góc xen giữa hai cạnh đó bằng nhau.'}]}},
{h:'2. Trường hợp bằng nhau thứ ba của tam giác: góc – cạnh – góc (g.c.g)',s:'Trường hợp góc – cạnh – góc',B:{n:'Cạnh kề của hai góc là cạnh nằm giữa hai góc đó. Nếu một cạnh và hai góc kề của tam giác này bằng một cạnh và hai góc kề của tam giác kia thì hai tam giác đó bằng nhau. Trường hợp này viết tắt là g.c.g.',a:[{t:'match',q:'Nối mỗi kí hiệu với cách đọc.',p:[['c.c.c','Cạnh – cạnh – cạnh'],['c.g.c','Cạnh – góc – cạnh'],['g.c.g','Góc – cạnh – góc']],h:'c là cạnh, g là góc.'},{t:'mc',q:'Hai tam giác có một cạnh và hai góc kề cạnh đó bằng nhau. Dùng trường hợp nào?',o:['g.c.g','c.g.c','c.c.c'],a:0,h:'Hai góc ở hai đầu của một cạnh: góc – cạnh – góc.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chọn đúng trường hợp bằng nhau',B:{n:'Em nhớ ba cách chứng minh hai tam giác bằng nhau: c.c.c, c.g.c, g.c.g.',a:[{t:'mc',q:'Hai tam giác có hai cạnh bằng nhau và góc xen giữa bằng nhau. Dùng trường hợp nào?',o:['c.g.c','c.c.c','g.c.g'],a:0,h:'Hai cạnh và góc ở giữa: cạnh – góc – cạnh.'},{t:'mc',q:'Hai tam giác có ba cặp cạnh tương ứng bằng nhau. Dùng trường hợp nào?',o:['c.c.c','c.g.c','g.c.g'],a:0,h:'Ba cạnh: cạnh – cạnh – cạnh.'}]}}]);
hand('rtt',[
{h:'Mở đầu',s:'Tình huống: hai chiếc cột và bóng nắng',B:{n:'Hai chiếc cột dựng thẳng đứng, cao bằng nhau. Tia nắng tạo với hai cột những góc bằng nhau. Mỗi cột và bóng của nó tạo thành một tam giác vuông.',a:[{t:'mc',q:'Hai cột cao bằng nhau, nắng chiếu như nhau. Bóng của hai cột như thế nào?',o:['Dài bằng nhau','Dài khác nhau'],a:0,h:'Hai tam giác vuông tạo bởi cột và bóng bằng nhau nên hai bóng dài bằng nhau.'}]}},
{h:'1. Ba trường hợp bằng nhau của tam giác vuông',s:'Ba trường hợp bằng nhau của tam giác vuông',B:{n:'Hai tam giác vuông bằng nhau nếu: hai cạnh góc vuông bằng nhau; hoặc một cạnh góc vuông và một góc nhọn kề cạnh ấy bằng nhau; hoặc cạnh huyền và một góc nhọn bằng nhau.',a:[{t:'mc',q:'Hai tam giác vuông có hai cạnh góc vuông tương ứng bằng nhau. Hai tam giác đó như thế nào?',o:['Bằng nhau','Không bằng nhau','Chưa biết'],a:0,h:'Hai cạnh góc vuông và góc vuông xen giữa bằng nhau, theo c.g.c.'},{t:'mc',q:'Hai tam giác vuông có cạnh huyền bằng nhau và một góc nhọn bằng nhau. Hai tam giác đó như thế nào?',o:['Bằng nhau','Không bằng nhau','Chưa biết'],a:0,h:'Đây là trường hợp cạnh huyền – góc nhọn.'},{t:'tf',q:'Đúng hay sai? “Hai tam giác vuông có một góc nhọn bằng nhau thì bằng nhau”.',a:false,h:'Chưa đủ. Phải có thêm một cạnh tương ứng bằng nhau.'}]}},
{h:'2. Trường hợp bằng nhau đặc biệt của tam giác vuông',s:'Trường hợp cạnh huyền – cạnh góc vuông',B:{n:'Nếu cạnh huyền và một cạnh góc vuông của tam giác vuông này bằng cạnh huyền và một cạnh góc vuông của tam giác vuông kia thì hai tam giác vuông đó bằng nhau.',a:[{t:'mc',q:'Hai tam giác vuông có cạnh huyền 5 cm bằng nhau và một cạnh góc vuông 3 cm bằng nhau. Hai tam giác đó như thế nào?',o:['Bằng nhau','Không bằng nhau'],a:0,h:'Cạnh huyền và một cạnh góc vuông bằng nhau nên hai tam giác vuông bằng nhau.'},{t:'tf',q:'Đúng hay sai? “Hai tam giác vuông có cạnh huyền bằng nhau và một cạnh góc vuông bằng nhau thì bằng nhau”.',a:true,h:'Đây là trường hợp cạnh huyền – cạnh góc vuông.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: hai chiếc thang',B:{n:'Dùng các trường hợp bằng nhau của tam giác vuông để giải thích hai đoạn thẳng hoặc hai góc bằng nhau.',a:[{t:'mc',q:'Hai chiếc thang dài bằng nhau dựa vào tường, chạm tường ở cùng độ cao. Hai tam giác vuông tạo bởi thang, tường và mặt đất như thế nào?',o:['Bằng nhau','Không bằng nhau'],a:0,h:'Cạnh huyền (thang) bằng nhau và một cạnh góc vuông (độ cao) bằng nhau.'}]}}]);
hand('iso',[
{h:'Mở đầu',s:'Tình huống: ngôi nhà hình tam giác',B:{n:'Kiến trúc sư vẽ ngôi nhà hình tam giác. Hai mái nhà nghiêng như nhau. Muốn tìm chính xác đỉnh nhà, ta dùng tam giác cân và đường trung trực.',a:[{t:'mc',q:'Hai mái nhà nghiêng như nhau. Hai cạnh bên của tam giác như thế nào?',o:['Bằng nhau','Khác nhau'],a:0,h:'Tam giác có hai cạnh bằng nhau là tam giác cân.'}]}},
{h:'1. Tam giác cân và tính chất',s:'Tam giác cân',B:{n:'Tam giác cân là tam giác có hai cạnh bằng nhau. Hai cạnh bằng nhau gọi là cạnh bên, cạnh còn lại gọi là cạnh đáy. Tam giác có ba cạnh bằng nhau gọi là tam giác đều.',a:[{t:'tf',q:'Đúng hay sai? “Tam giác cân có hai cạnh bằng nhau”.',a:true,h:'Đó là định nghĩa của tam giác cân.'},{t:'mc',q:'Tam giác đều có mấy cạnh bằng nhau?',o:['3','2','1','0'],a:0,h:'Tam giác đều có cả ba cạnh bằng nhau.'}]}},
{h:'1. Tam giác cân và tính chất',s:'Tính chất của tam giác cân',B:{n:'Trong một tam giác cân, hai góc ở đáy bằng nhau. Ngược lại, một tam giác có hai góc bằng nhau thì là tam giác cân.',a:[{t:'num',q:'Tam giác ABC cân tại A, góc B bằng 50°. Góc C bằng bao nhiêu độ?',u:'°',a:50,h:'Hai góc ở đáy bằng nhau: góc C = góc B = 50°.'},{t:'num',q:'Tam giác ABC cân tại A, góc A bằng 80°. Góc B bằng bao nhiêu độ?',u:'°',a:50,h:'Hai góc ở đáy bằng nhau. Mỗi góc là (180° − 80°) : 2 = 50°.'},{t:'mc',q:'Tam giác MNP có góc M bằng góc N. Tam giác đó cân tại đỉnh nào?',o:['P','M','N'],a:0,h:'Hai góc M và N bằng nhau nên hai cạnh đối diện PN và PM bằng nhau. Tam giác cân tại P.'}]}},
{h:'2. Đường trung trực của một đoạn thẳng',s:'Đường trung trực của một đoạn thẳng',B:{n:'Đường thẳng vuông góc với một đoạn thẳng tại trung điểm của nó là đường trung trực của đoạn thẳng đó. Điểm nằm trên đường trung trực của một đoạn thẳng thì cách đều hai đầu mút của đoạn thẳng.',a:[{t:'mc',q:'Gấp mảnh giấy sao cho hai điểm A và B trùng nhau. Nếp gấp là gì của đoạn thẳng AB?',o:['Đường trung trực','Tia phân giác','Đường song song'],a:0,h:'Nếp gấp vuông góc với AB tại trung điểm của AB nên là đường trung trực.'},{t:'tf',q:'Đúng hay sai? “Điểm nằm trên đường trung trực của đoạn AB thì cách đều A và B”.',a:true,h:'Đây là tính chất của đường trung trực.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: tam giác đều và tam giác cân',B:{n:'Em dùng tính chất của tam giác cân và tổng ba góc để tìm số đo góc.',a:[{t:'num',q:'Tam giác đều có mỗi góc bằng bao nhiêu độ?',u:'°',a:60,h:'Ba góc bằng nhau và có tổng 180°, nên mỗi góc là 180° : 3 = 60°.'},{t:'mc',q:'Tam giác ABC cân tại A, M là trung điểm của BC. AM có vuông góc với BC không?',o:['Có','Không'],a:0,h:'Tam giác ABM bằng tam giác ACM nên hai góc tại M bằng nhau và kề bù, mỗi góc là 90°.'}]}}]);

const pie=(v,c)=>{let a=0;const T=v.reduce((x,y)=>x+y,0),p=t=>[110+80*Math.sin(t),90-80*Math.cos(t)];return sv(220,180,v.map((x,i)=>{const b=a+2*Math.PI*x/T,s=p(a),e=p(b),L=b-a>Math.PI?1:0;a=b;return`<path d="M110 90L${s[0]} ${s[1]}A80 80 0 ${L} 1 ${e[0]} ${e[1]}Z" fill="${c[i]}" stroke="#fff" stroke-width="3"/>`}).join(''))};
const lc=(v,l)=>{const M=Math.max(...v),X=i=>40+i*(220/(v.length-1)),Y=x=>130-x/M*100;return sv(300,170,`<rect width="300" height="170" rx="16" fill="#f0fdf4"/><line x1="30" y1="130" x2="280" y2="130" stroke="#1e293b" stroke-width="3"/><line x1="30" y1="20" x2="30" y2="130" stroke="#1e293b" stroke-width="3"/><polyline points="${v.map((x,i)=>X(i)+','+Y(x)).join(' ')}" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round"/>`+v.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x)}" r="7" fill="#dc2626"/><text x="${X(i)}" y="152" text-anchor="middle" font-size="14" fill="#1e293b">${l[i]}</text>`).join(''))};
const fruit=()=>sv(300,150,`<rect width="300" height="150" rx="16" fill="#fff7ed"/><g font-size="26"><text x="14" y="40">🍎🍎🍎🍎</text><text x="14" y="80">🍌🍌</text><text x="14" y="120">🍇</text></g>`);

lin:[{v:lc([1,2,3,5],['Ngày 1','Ngày 2','Ngày 3','Ngày 4']),q:'Cây đậu cao lên mỗi ngày. Đường màu xanh đi lên hay đi xuống?',o:['Đi lên','Đi xuống'],a:0,h:'Đường đi lên nghĩa là cây cao dần.'},{v:lc([1,2,3,5],['Ngày 1','Ngày 2','Ngày 3','Ngày 4']),q:'Ngày nào cây đậu cao nhất?',o:['Ngày 4','Ngày 1'],a:0,h:'Chấm đỏ cao nhất nằm ở ngày 4.'}]});
hand('cls',[
{h:'Mở đầu',s:'Tình huống: đài truyền hình khảo sát',B:{n:'Đài truyền hình muốn biết sở thích xem ti vi của các bạn. Muốn vậy, ta phải thu thập dữ liệu, ví dụ bằng cách phỏng vấn.',a:[{t:'mc',q:'Muốn biết mỗi ngày các bạn trong tổ xem ti vi bao nhiêu giờ, em làm thế nào?',o:['Phỏng vấn các bạn rồi ghi lại','Đoán ngẫu nhiên','Hỏi một bạn rồi suy ra cho cả lớp'],a:0,h:'Em thu thập dữ liệu bằng cách phỏng vấn các bạn.'}]}},
{h:'1. Thu thập và phân loại dữ liệu',s:'Dữ liệu là số và dữ liệu không là số',B:{n:'Dữ liệu là số còn gọi là số liệu. Dữ liệu không là số, ví dụ ý kiến “Rất đồng ý, Đồng ý, Không đồng ý”, có thể sắp xếp theo mức độ. Có dữ liệu không là số và không sắp xếp được, ví dụ tên các chương trình ti vi.',a:[{t:'match',q:'Nối mỗi dữ liệu với loại dữ liệu.',p:[['Số giờ xem ti vi mỗi ngày','Số liệu'],['Rất đồng ý, Đồng ý, Không đồng ý','Không là số, sắp xếp được'],['Tên các chương trình ti vi','Không là số, không sắp xếp được']],h:'Xem dữ liệu có phải là số đo, số đếm không, rồi xem có sắp thứ tự được không.'},{t:'tf',q:'Đúng hay sai? “Số hiệu các tuyến xe buýt 01, 02, 12, 15 là dãy số liệu”.',a:false,h:'Đây là tên (mã) của các tuyến xe, không phải số đo hay số đếm, nên không phải dãy số liệu.'}]}},
{h:'2. Tính đại diện của dữ liệu',s:'Tính đại diện của dữ liệu',B:{n:'Để rút ra kết luận hợp lí, dữ liệu thu được phải đại diện cho toàn bộ đối tượng cần quan tâm. Muốn vậy, ta chọn các đối tượng khảo sát một cách ngẫu nhiên.',a:[{t:'mc',q:'Muốn biết ý kiến của toàn thể học sinh trong trường, cách nào hợp lí hơn?',o:['Chọn ngẫu nhiên học sinh ở nhiều lớp','Chỉ hỏi các bạn nam','Chỉ hỏi các bạn trong câu lạc bộ Toán'],a:0,h:'Chọn ngẫu nhiên thì dữ liệu mới đại diện cho toàn thể học sinh.'},{t:'tf',q:'Đúng hay sai? “Chỉ hỏi các bạn trong câu lạc bộ Toán thì dữ liệu đại diện cho toàn thể học sinh”.',a:false,h:'Các bạn trong câu lạc bộ Toán chỉ là một nhóm nhỏ, chưa đại diện cho cả trường.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: phân loại dữ liệu',B:{n:'Em phân loại dữ liệu theo hai bước: dữ liệu có phải là số không, và có sắp xếp được theo thứ tự không.',a:[{t:'mc',q:'Câu hỏi “Bạn thích vật nuôi nào nhất?” cho dữ liệu thuộc loại nào?',o:['Không là số, không sắp xếp thứ tự','Số liệu','Không là số, sắp xếp được'],a:0,h:'Tên vật nuôi không phải là số và không có thứ tự.'},{t:'mc',q:'Số giờ các bạn dành cho thể thao mỗi ngày là loại dữ liệu nào?',o:['Số liệu','Không là số'],a:0,h:'Số giờ là số đo nên là số liệu.'}]}}]);
hand('pie',[

{h:'1. Đọc và mô tả biểu đồ hình quạt tròn',s:'Đọc và mô tả biểu đồ hình quạt tròn',B:{n:'Cả hình tròn biểu diễn 100%. Mỗi hình quạt biểu diễn tỉ lệ của một phần. Hai hình quạt giống nhau biểu diễn cùng một tỉ lệ. Phần hình quạt bằng một nửa hình tròn biểu diễn 50%.',a:[{t:'mc',v:pie([50,25,25],PC),q:'Phần màu cam chiếm một nửa hình tròn. Phần đó biểu diễn bao nhiêu phần trăm?',o:['50%','25%','75%','100%'],a:0,h:'Một nửa hình tròn là 50%.'},{t:'mc',v:pie([50,25,25],PC),q:'Hai hình quạt màu xanh giống nhau. Hai tỉ lệ của chúng như thế nào?',o:['Bằng nhau','Khác nhau'],a:0,h:'Hai hình quạt giống nhau biểu diễn cùng một tỉ lệ.'}]}},
{h:'2. Biểu diễn dữ liệu vào biểu đồ hình quạt tròn',s:'Biểu diễn dữ liệu vào biểu đồ hình quạt tròn',B:{n:'Muốn tính tỉ lệ của mỗi loại, ta lấy số lượng của loại đó chia cho tổng số rồi đổi ra phần trăm.',a:[{t:'num',q:'Khảo sát 500 học sinh, có 250 em bơi thành thạo. Tỉ lệ em bơi thành thạo là bao nhiêu phần trăm?',u:'%',a:50,h:'250 : 500 = 0,5 = 50%.'},{t:'num',q:'Trong 500 học sinh đó, có 175 em biết bơi nhưng chưa thành thạo. Tỉ lệ này là bao nhiêu phần trăm?',u:'%',a:35,h:'175 : 500 = 0,35 = 35%.'},{t:'num',q:'Hình tròn được chia sẵn thành 10 hình quạt, mỗi hình quạt ứng với 10%. Sách giáo khoa chiếm 40%. Cần tô màu mấy hình quạt?',a:4,h:'40% : 10% = 4 hình quạt.'}]}},
{h:'3. Phân tích dữ liệu trong biểu đồ hình quạt tròn',s:'Phân tích dữ liệu trong biểu đồ hình quạt tròn',B:{n:'Từ biểu đồ hình quạt tròn, ta có thể lập bảng thống kê, so sánh các tỉ lệ và dự đoán số lượng bằng cách nhân tổng số với tỉ lệ phần trăm.',a:[{t:'num',q:'Biểu đồ cho biết 30% học sinh khối 7 thích chơi thể thao. Trường có 200 học sinh khối 7. Dự đoán có khoảng bao nhiêu bạn thích chơi thể thao?',u:'bạn',a:60,h:'200 · 30% = 200 · 0,3 = 60 (học sinh).'},{t:'num',q:'Lớp có 40 bạn, trong đó 25% thích đá cầu. Có bao nhiêu bạn thích đá cầu?',u:'bạn',a:10,h:'40 · 25% = 40 · 0,25 = 10 (bạn).'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: tổng các tỉ lệ',B:{n:'Cả hình tròn là 100%, nên tổng các tỉ lệ của tất cả hình quạt luôn bằng 100%.',a:[{t:'mc',q:'Tổng các tỉ lệ trong một biểu đồ hình quạt tròn bằng bao nhiêu?',o:['100%','50%','10%','1%'],a:0,h:'Các hình quạt ghép lại thành cả hình tròn, tức là 100%.'}]}}]);
hand('lin',[
{h:'Mở đầu',s:'Tình huống: dân số Việt Nam qua các năm',B:{n:'Dân số Việt Nam qua các lần tổng điều tra được biểu diễn bằng biểu đồ đoạn thẳng. Biểu đồ này cho thấy dân số thay đổi theo thời gian.',a:[{t:'mc',q:'Biểu đồ đoạn thẳng thường dùng để thể hiện điều gì?',o:['Sự thay đổi theo thời gian','Tỉ lệ các phần trong một tổng','Hình dạng của một vật'],a:0,h:'Các đoạn thẳng nối các điểm cho thấy số liệu tăng hay giảm theo thời gian.'}]}},
{h:'1. Giới thiệu biểu đồ đoạn thẳng',s:'Các thành phần của biểu đồ đoạn thẳng',B:{n:'Biểu đồ đoạn thẳng gồm: tiêu đề, trục ngang (thường là thời gian), trục đứng (số liệu và đơn vị), các điểm biểu diễn số liệu và các đoạn thẳng nối các điểm liên tiếp.',a:[{t:'match',q:'Nối mỗi thành phần với vai trò của nó.',p:[['Trục ngang','Biểu diễn thời gian'],['Trục đứng','Biểu diễn số liệu và đơn vị'],['Đoạn thẳng nối các điểm','Cho thấy xu hướng thay đổi']],h:'Trục ngang thường ghi năm hoặc ngày. Trục đứng ghi số liệu.'}]}},
{h:'2. Đọc và phân tích dữ liệu trong biểu đồ đoạn thẳng',s:'Đọc và phân tích dữ liệu trong biểu đồ đoạn thẳng',B:{n:'Đường đi lên cho thấy số liệu tăng. Đường đi xuống cho thấy số liệu giảm. Đoạn thẳng càng dốc thì số liệu thay đổi càng nhanh.',a:[{t:'mc',v:lc([1,2,3,5],['Ngày 1','Ngày 2','Ngày 3','Ngày 4']),q:'Chiều cao cây đậu qua bốn ngày có xu hướng tăng hay giảm?',o:['Tăng','Giảm'],a:0,h:'Đường đi lên từ trái sang phải nên chiều cao tăng.'},{t:'mc',q:'Đoạn thẳng nối hai điểm càng dốc thì số liệu thay đổi như thế nào?',o:['Thay đổi càng nhanh','Thay đổi càng chậm'],a:0,h:'Độ dốc cho biết tốc độ thay đổi của số liệu.'}]}},
{h:'3. Vẽ biểu đồ đoạn thẳng',s:'Vẽ biểu đồ đoạn thẳng',B:{n:'Cách vẽ: vẽ hai trục và chia khoảng; xác định các điểm theo số liệu; nối các điểm liên tiếp bằng đoạn thẳng; ghi chú thích và đặt tên biểu đồ.',a:[{t:'sort',q:'Sắp xếp các bước vẽ biểu đồ đoạn thẳng. Em bấm lần lượt từng bước.',i:['Vẽ hai trục và chia khoảng','Xác định các điểm theo số liệu','Nối các điểm liên tiếp bằng đoạn thẳng','Ghi chú thích và đặt tên biểu đồ'],h:'Đi từ trục, đến điểm, đến đoạn thẳng, cuối cùng là tên biểu đồ.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chọn loại biểu đồ',B:{n:'Em chọn biểu đồ phù hợp: đoạn thẳng cho sự thay đổi theo thời gian, hình quạt tròn cho tỉ lệ các phần.',a:[{t:'mc',q:'Em muốn xem nhiệt độ thay đổi trong một ngày. Nên chọn biểu đồ nào?',o:['Biểu đồ đoạn thẳng','Biểu đồ hình quạt tròn'],a:0,h:'Nhiệt độ thay đổi theo thời gian nên dùng biểu đồ đoạn thẳng.'},{t:'mc',q:'Số dân ba lần điều tra liên tiếp là 80, 85, 90 (triệu người). Biểu đồ đoạn thẳng có xu hướng nào?',o:['Tăng','Giảm','Không đổi'],a:0,h:'Số liệu tăng dần nên đường đi lên.'}]}}]);

const emo=(r,bg)=>sv(300,20+r.length*42,`<rect width="300" height="${20+r.length*42}" rx="16" fill="${bg}"/>`+r.map((t,i)=>`<text x="14" y="${40+i*42}" font-size="26">${t}</text>`).join(''));
Object.assign(LA,{rto:[{v:emo(['🍊 + 💧💧','🍊🍊 + 💧💧💧💧'],'#fff7ed'),q:'Pha nước cam: 1 quả cam cần 2 ly nước. Pha gấp đôi: 2 quả cam cần mấy ly nước?',o:['4 ly','3 ly'],a:0,h:'Cam gấp đôi thì nước cũng gấp đôi: 2 · 2 = 4 ly.'}],
shr:[{v:emo(['An: 🍬🍬🍬','Bình: 🍬🍬🍬🍬🍬🍬'],'#fdf2f8'),q:'Có 9 viên kẹo chia cho An và Bình. Bình nhận nhiều gấp đôi An. Bình nhận mấy viên?',o:['6 viên','3 viên'],a:0,h:'An 3 viên, Bình gấp đôi là 6 viên. 3 + 6 = 9.'}],
prop:[{v:emo(['🧁 🍓🍓','🧁 🍓🍓','🧁 🍓🍓'],'#fef2f2'),q:'Mỗi cái bánh có 2 quả dâu. Có 3 cái bánh. Có tất cả mấy quả dâu?',o:['6 quả','5 quả'],a:0,h:'2 + 2 + 2 = 6. Bánh nhiều lên thì dâu cũng nhiều lên.'}],
inv:[{v:emo(['🧒🧒 → 6 phút','🧒🧒🧒🧒 → ? phút'],'#eff6ff'),q:'Hai bạn lau bảng xong trong 6 phút. Bốn bạn cùng lau thì xong nhanh hơn hay chậm hơn?',o:['Nhanh hơn','Chậm hơn'],a:0,h:'Nhiều bạn cùng làm thì xong nhanh hơn.'},{v:emo(['🧒🧒 → 6 phút','🧒🧒🧒🧒 → ? phút'],'#eff6ff'),q:'Bốn bạn lau bảng xong trong mấy phút?',o:['3 phút','12 phút'],a:0,h:'Số bạn gấp đôi thì thời gian giảm một nửa: 6 : 2 = 3 phút.'}]});
hand('rto',[
{h:'Mở đầu',s:'Tình huống: vẽ mô phỏng sân cỏ',B:{n:'Sân cỏ thật dài 105 m và rộng 68 m. Nam vẽ sân cỏ dài 21 cm và rộng 13,6 cm. Vẽ như vậy có đúng tỉ lệ không? Ta cần so sánh hai tỉ số.',a:[{t:'num',q:'Chiều dài thật gấp 5 lần chiều dài vẽ (105 : 21 = 5). Chiều rộng thật là 68 m, chiều rộng vẽ là 13,6 cm. Tính 68 : 13,6.',a:5,h:'68 : 13,6 = 5. Cả chiều dài và chiều rộng đều gấp 5 lần nên Nam vẽ đúng tỉ lệ.'}]}},
{h:'1. Tỉ lệ thức',s:'Tỉ lệ thức',B:{n:'Đẳng thức của hai tỉ số {a/b} = {c/d} gọi là tỉ lệ thức. Ví dụ: {1/2} = {3/6}. Các số a, b, c, d gọi là các số hạng của tỉ lệ thức.',a:[{t:'mc',q:'Đẳng thức nào là một tỉ lệ thức?',o:['{2/3} = {4/6}','{2/3} = {3/4}','{1/2} = {1/3}'],a:0,h:'{4/6} rút gọn bằng {2/3} nên hai tỉ số bằng nhau.'},{t:'match',q:'Nối hai tỉ số bằng nhau.',p:[['{1/2}','{3/6}'],['{2/3}','{8/12}'],['{3/4}','{9/12}']],h:'Rút gọn phân số rồi so sánh.'}]}},
{h:'2. Tính chất của tỉ lệ thức',s:'Tính chất của tỉ lệ thức',B:{n:'Nếu {a/b} = {c/d} thì a · d = b · c, nghĩa là tích chéo bằng nhau. Ngược lại, từ đẳng thức a · d = b · c ta lập lại được các tỉ lệ thức.',a:[{t:'num',q:'Tìm x, biết {x/6} = {2/3}.',a:4,h:'Tích chéo bằng nhau: x · 3 = 6 · 2 = 12. Vậy x = 12 : 3 = 4.'},{t:'mc',q:'Từ đẳng thức 2 · 6 = 3 · 4 suy ra tỉ lệ thức nào?',o:['{2/3} = {4/6}','{2/3} = {6/4}','{2/6} = {4/3}'],a:0,h:'Với {2/3} = {4/6}, tích chéo là 2 · 6 và 3 · 4, đúng bằng nhau.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: gói bánh chưng',B:{n:'Em lập tỉ lệ thức rồi tìm số hạng chưa biết bằng tích chéo.',a:[{t:'num',q:'Để gói 10 chiếc bánh chưng cần 5 kg gạo nếp. Gói 45 chiếc bánh cùng loại cần bao nhiêu kilôgam gạo nếp?',u:'kg',a:22.5,h:'Gọi x (kg) là lượng gạo. Ta có {10/45} = {5/x}. Suy ra x = 45 · 5 : 10 = 22,5 (kg).'}]}}]);
hand('shr',[
{h:'Mở đầu',s:'Tình huống: ba nhà từ thiện góp tiền xây phòng học',B:{n:'Ba nhà từ thiện góp 450 triệu đồng để xây phòng học, theo tỉ lệ 3 : 5 : 7. Ta cần tính số tiền của mỗi nhà.',a:[{t:'num',q:'Tổng các phần là 3 + 5 + 7 = 15. Mỗi phần là bao nhiêu triệu đồng?',u:'triệu đồng',a:30,h:'450 : 15 = 30 (triệu đồng).'}]}},
{h:'Tính chất của dãy tỉ số bằng nhau',s:'Tính chất của dãy hai tỉ số bằng nhau',B:{n:'Nếu {a/b} = {c/d} thì {a/b} = {c/d} = {a+c/b+d} = {a−c/b−d} (các mẫu số khác 0).',a:[{t:'num',q:'Cho {x/3} = {y/2} và x + y = 15. Tìm x.',a:9,h:'{x/3} = {y/2} = {x+y/3+2} = {15/5} = 3. Vậy x = 3 · 3 = 9.'},{t:'num',q:'Với dữ kiện trên ({x/3} = {y/2} và x + y = 15), tìm y.',a:6,h:'Mỗi phần bằng 3, nên y = 3 · 2 = 6.'}]}},
{h:'Tính chất của dãy tỉ số bằng nhau',s:'Dãy nhiều tỉ số bằng nhau',B:{n:'Tính chất mở rộng cho dãy ba tỉ số: {x/3} = {y/5} = {z/7} = {x+y+z/3+5+7}.',a:[{t:'num',q:'Chia 450 triệu đồng cho ba nhà theo tỉ lệ 3 : 5 : 7. Nhà thứ ba nhận bao nhiêu triệu đồng?',u:'triệu đồng',a:210,h:'Mỗi phần là 450 : 15 = 30. Nhà thứ ba: 30 · 7 = 210 (triệu đồng).'},{t:'match',q:'Nối mỗi nhà với số tiền nhận được (triệu đồng).',p:[['Nhà 1 (3 phần)','90'],['Nhà 2 (5 phần)','150'],['Nhà 3 (7 phần)','210']],h:'Mỗi phần là 30 triệu đồng. Lấy 30 nhân với số phần.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chia theo tỉ lệ',B:{n:'Muốn chia một số theo tỉ lệ, em cộng các phần, chia để tìm một phần, rồi nhân với số phần của mỗi bên.',a:[{t:'num',q:'Ba cạnh của một tam giác tỉ lệ với 2; 3; 4 và chu vi là 18 cm. Cạnh ngắn nhất dài bao nhiêu xentimét?',u:'cm',a:4,h:'Tổng các phần là 2 + 3 + 4 = 9. Mỗi phần là 18 : 9 = 2 cm. Cạnh ngắn nhất: 2 · 2 = 4 (cm).'},{t:'mc',q:'Cho {x/2} = {y/3} và x + y = 10. Số x bằng bao nhiêu?',o:['4','6','2','10'],a:0,h:'{x/2} = {y/3} = {x+y/2+3} = {10/5} = 2. Vậy x = 2 · 2 = 4.'}]}}]);
hand('prop',[
{h:'Mở đầu',s:'Tình huống: làm bột sắn dây',B:{n:'Cứ 4,5 kg củ sắn dây tươi thì thu được khoảng 1 kg bột. Hỏi 3 tạ củ sắn dây tươi thu được khoảng bao nhiêu kilôgam bột?',a:[{t:'mc',q:'Nếu khối lượng củ tươi gấp đôi thì khối lượng bột như thế nào?',o:['Gấp đôi','Giảm một nửa','Không đổi'],a:0,h:'Đây là hai đại lượng tỉ lệ thuận: đại lượng này gấp lên bao nhiêu lần thì đại lượng kia cũng gấp lên bấy nhiêu lần.'}]}},
{h:'1. Đại lượng tỉ lệ thuận',s:'Nhận biết đại lượng tỉ lệ thuận',B:{n:'Nếu đại lượng y liên hệ với đại lượng x theo công thức y = a · x (a là hằng số khác 0) thì y tỉ lệ thuận với x theo hệ số tỉ lệ a.',a:[{t:'num',q:'y tỉ lệ thuận với x. Khi x = 2 thì y = −4. Tìm hệ số tỉ lệ a. (Em dùng nút ± để nhập số âm.)',a:-2,h:'a = y : x = (−4) : 2 = −2.'},{t:'num',q:'Cho y = −2x. Tìm y khi x = 3.',a:-6,h:'y = −2 · 3 = −6.'}]}},
{h:'1. Đại lượng tỉ lệ thuận',s:'Tính chất của đại lượng tỉ lệ thuận',B:{n:'Nếu y tỉ lệ thuận với x theo hệ số a thì {y₁/x₁} = {y₂/x₂} = a, hay {x₁/x₂} = {y₁/y₂}.',a:[{t:'tf',q:'Đúng hay sai? “y tỉ lệ thuận với x. Khi x tăng gấp 3 lần thì y cũng tăng gấp 3 lần”.',a:true,h:'Hai đại lượng tỉ lệ thuận thì cùng tăng hoặc cùng giảm theo cùng một số lần.'},{t:'num',q:'y tỉ lệ thuận với x theo hệ số tỉ lệ a = 5. Tìm y khi x = 4.',a:20,h:'y = 5 · 4 = 20.'}]}},
{h:'2. Một số bài toán về đại lượng tỉ lệ thuận',s:'Giải toán về đại lượng tỉ lệ thuận',B:{n:'Để giải toán, em nhận biết hai đại lượng tỉ lệ thuận, lập các tỉ số bằng nhau rồi dùng tính chất của dãy tỉ số bằng nhau.',a:[{t:'num',q:'Chia 635 quyển vở cho ba lớp theo tỉ lệ 40 : 42 : 45. Lớp thứ nhất nhận bao nhiêu quyển?',u:'quyển',a:200,h:'Tổng các phần: 40 + 42 + 45 = 127. Mỗi phần: 635 : 127 = 5. Lớp thứ nhất: 5 · 40 = 200 (quyển).'},{t:'num',q:'Chia 1 tấn gạo (1 000 kg) thành ba phần tỉ lệ thuận với 2; 3; 5. Phần lớn nhất nặng bao nhiêu kilôgam?',u:'kg',a:500,h:'Tổng các phần: 2 + 3 + 5 = 10. Mỗi phần: 1 000 : 10 = 100 kg. Phần lớn nhất: 100 · 5 = 500 (kg).'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: bột sắn dây',B:{n:'Khối lượng bột và khối lượng củ tươi là hai đại lượng tỉ lệ thuận.',a:[{t:'num',q:'Cứ 4,5 kg củ sắn dây tươi thu được 1 kg bột. Với 9 kg củ tươi thì thu được bao nhiêu kilôgam bột?',u:'kg',a:2,h:'9 : 4,5 = 2 (lần). Bột thu được: 1 · 2 = 2 (kg).'}]}}]);
hand('inv',[
{h:'Mở đầu',s:'Tình huống: bốn người thợ xây tường',B:{n:'Bốn người thợ xây xong một bức tường trong 9 ngày. Hỏi 6 người thợ cùng làm (năng suất như nhau) xây xong bức tường đó trong bao nhiêu ngày?',a:[{t:'mc',q:'Số thợ càng nhiều thì thời gian xây xong bức tường như thế nào?',o:['Càng ít','Càng nhiều','Không đổi'],a:0,h:'Đây là hai đại lượng tỉ lệ nghịch: đại lượng này tăng thì đại lượng kia giảm.'}]}},
{h:'1. Đại lượng tỉ lệ nghịch',s:'Nhận biết đại lượng tỉ lệ nghịch',B:{n:'Nếu đại lượng y liên hệ với đại lượng x theo công thức y = {a/x}, tức là x · y = a (a là hằng số khác 0), thì y tỉ lệ nghịch với x theo hệ số tỉ lệ a.',a:[{t:'num',q:'x và y tỉ lệ nghịch. Khi x = 2 thì y = −4. Tìm hệ số tỉ lệ a. (Em dùng nút ± để nhập số âm.)',a:-8,h:'a = x · y = 2 · (−4) = −8.'},{t:'num',q:'Cho y = {−8/x}. Tìm y khi x = 4.',a:-2,h:'y = (−8) : 4 = −2.'}]}},
{h:'1. Đại lượng tỉ lệ nghịch',s:'Tính chất của đại lượng tỉ lệ nghịch',B:{n:'Nếu y tỉ lệ nghịch với x theo hệ số a thì x₁ · y₁ = x₂ · y₂ = a, hay {x₁/x₂} = {y₂/y₁}.',a:[{t:'num',q:'y tỉ lệ nghịch với x theo hệ số tỉ lệ a = 12. Tìm y khi x = 4.',a:3,h:'y = 12 : 4 = 3.'},{t:'tf',q:'Đúng hay sai? “y tỉ lệ nghịch với x. Khi x tăng gấp đôi thì y cũng tăng gấp đôi”.',a:false,h:'Khi x tăng gấp đôi thì y giảm đi một nửa.'}]}},
{h:'2. Một số bài toán về đại lượng tỉ lệ nghịch',s:'Giải toán về đại lượng tỉ lệ nghịch',B:{n:'Để giải toán, em nhận biết hai đại lượng tỉ lệ nghịch rồi dùng tính chất: tích hai đại lượng tương ứng không đổi.',a:[{t:'num',q:'Bốn người thợ xây xong bức tường trong 9 ngày. Sáu người thợ (năng suất như nhau) xây xong trong bao nhiêu ngày?',u:'ngày',a:6,h:'Số thợ và số ngày tỉ lệ nghịch nên 4 · 9 = 6 · x. Vậy x = 36 : 6 = 6 (ngày).'},{t:'num',q:'Một ô tô đi từ A đến B với vận tốc 40 km/h thì hết 3 giờ. Nếu đi với vận tốc 60 km/h thì hết bao nhiêu giờ?',u:'giờ',a:2,h:'Vận tốc và thời gian tỉ lệ nghịch nên 40 · 3 = 60 · t. Vậy t = 120 : 60 = 2 (giờ).'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: nhiều người cùng làm',B:{n:'Cùng một khối lượng công việc, số người càng nhiều thì thời gian làm càng ít.',a:[{t:'mc',q:'Trên cùng một quãng đường, hai đại lượng nào tỉ lệ nghịch với nhau?',o:['Vận tốc và thời gian','Vận tốc và quãng đường','Tuổi và chiều cao'],a:0,h:'Vận tốc càng lớn thì thời gian đi càng ít.'},{t:'num',q:'12 người làm xong một việc trong 5 ngày. Muốn làm xong trong 4 ngày thì cần bao nhiêu người (năng suất như nhau)?',u:'người',a:15,h:'12 · 5 = 60 = x · 4, nên x = 60 : 4 = 15 (người).'}]}}]);

dvp:[{v:emo(['🍬🍬🍬🍬🍬🍬 → 🧒 🧒'],'#f0f9ff'),q:'Có 6 viên kẹo chia đều cho 2 bạn. Mỗi bạn được mấy viên?',o:['3 viên','4 viên'],a:0,h:'6 chia đều cho 2 bạn: 6 : 2 = 3.'}]});
hand('alg',[
{h:'Mở đầu',s:'Tình huống: dùng chữ đại diện cho số',B:{n:'Trong Đại số, người ta dùng chữ để đại diện cho các số. Nhờ vậy ta giải được nhiều bài toán giống nhau cùng một lúc.',a:[{t:'mc',q:'Chữ “đại” trong từ “đại số” có nghĩa là gì?',o:['Đại diện, thay thế cho','To lớn','Đầu tiên'],a:0,h:'Chữ cái được dùng để đại diện cho những số nào đó.'}]}},
{h:'1. Biểu thức đại số',s:'Biểu thức số và biểu thức đại số',B:{n:'Biểu thức không chứa chữ gọi là biểu thức số. Biểu thức chỉ chứa số, hoặc chỉ chứa chữ, hoặc chứa cả số và chữ gọi chung là biểu thức đại số. Các chữ đại diện cho số gọi là các biến.',a:[{t:'match',q:'Nối mỗi biểu thức với đặc điểm của nó.',p:[['23 + 8 − 9','Không chứa chữ'],['3x + 7','Có chứa chữ x'],['2 · (a + b)','Có chứa chữ a và b']],h:'Nhìn xem trong biểu thức có chữ hay không.'},{t:'mc',q:'Hình chữ nhật có chiều rộng x (cm), chiều dài hơn chiều rộng 3 cm. Biểu thức nào biểu thị chu vi của nó?',o:['2(x + x + 3)','x + 3','x · (x + 3)','2x + 3'],a:0,h:'Chiều dài là x + 3. Chu vi bằng 2 lần tổng chiều rộng và chiều dài: 2(x + x + 3).'}]}},
{h:'2. Giá trị của một biểu thức đại số',s:'Giá trị của biểu thức đại số',B:{n:'Muốn tính giá trị của một biểu thức đại số tại những giá trị cho trước của các biến, ta thay giá trị đã cho vào biểu thức rồi thực hiện các phép tính.',a:[{t:'num',q:'Bác Hoà mua một túi rau giá 15 nghìn đồng và x kg cam, mỗi kilôgam cam giá 40 nghìn đồng. Số tiền phải trả là 40x + 15 (nghìn đồng). Tính số tiền khi x = 2,5.',u:'nghìn đồng',a:115,h:'Thay x = 2,5: 40 · 2,5 + 15 = 100 + 15 = 115 (nghìn đồng).'},{t:'num',q:'Tính giá trị của biểu thức 3x + 2 tại x = 4.',a:14,h:'Thay x = 4: 3 · 4 + 2 = 12 + 2 = 14.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: quãng đường đi được',B:{n:'Quãng đường bằng vận tốc nhân với thời gian.',a:[{t:'mc',q:'Một ô tô đi với vận tốc 40 km/h trong x giờ. Biểu thức nào biểu thị quãng đường ô tô đi được?',o:['40x','40 + x','x : 40','40 − x'],a:0,h:'Quãng đường = vận tốc · thời gian = 40 · x.'},{t:'num',q:'Với x = 3, quãng đường đó bằng bao nhiêu kilômét?',u:'km',a:120,h:'40 · 3 = 120 (km).'}]}}]);
hand('pol',[
{h:'Mở đầu',s:'Tình huống: biểu thức chỉ có một biến',B:{n:'Nhiều đại lượng trong đời sống được tính bằng biểu thức chỉ chứa một biến, ví dụ độ cao của một vật được ném lên theo thời gian. Ta gọi chúng là đa thức một biến.',a:[{t:'mc',q:'Biểu thức nào chỉ chứa một biến?',o:['3x<sup>2</sup> + 2x − 1','xy + 1','a + b'],a:0,h:'Biểu thức 3x<sup>2</sup> + 2x − 1 chỉ có biến x.'}]}},
{h:'1. Đơn thức một biến',s:'Đơn thức một biến',B:{n:'Đơn thức một biến có dạng a · x<sup>n</sup>, trong đó a là số khác 0 (hệ số) và n là số tự nhiên (bậc). Ví dụ: 5x<sup>2</sup> có hệ số là 5 và bậc là 2.',a:[{t:'match',q:'Nối mỗi đơn thức với bậc của nó.',p:[['3x','1'],['−2x<sup>4</sup>','4'],['7x<sup>2</sup>','2']],h:'Bậc là số mũ của x. Với 3x thì số mũ là 1.'},{t:'mc',q:'Hệ số của đơn thức −2x<sup>4</sup> là số nào?',o:['−2','4','2','−4'],a:0,h:'Hệ số là số đứng trước x<sup>4</sup>, kể cả dấu: −2.'}]}},
{h:'2. Khái niệm đa thức một biến',s:'Khái niệm đa thức một biến',B:{n:'Đa thức một biến là tổng của những đơn thức của cùng một biến. Mỗi đơn thức trong tổng gọi là một hạng tử của đa thức.',a:[{t:'mc',q:'Đa thức 3x<sup>2</sup> − 2x + 1 có mấy hạng tử?',o:['3','2','1','4'],a:0,h:'Có ba hạng tử: 3x<sup>2</sup>, −2x và 1.'},{t:'tf',q:'Đúng hay sai? “x<sup>2</sup> + 5x − 7 là một đa thức một biến”.',a:true,h:'Đây là tổng của các đơn thức của cùng biến x.'}]}},
{h:'3. Đa thức một biến thu gọn',s:'Đa thức thu gọn',B:{n:'Đa thức không chứa hai đơn thức nào cùng bậc gọi là đa thức thu gọn. Nếu có các đơn thức cùng bậc, ta cộng (hay trừ) chúng để thu gọn.',a:[{t:'mc',q:'Thu gọn đa thức 6x<sup>3</sup> − 5x<sup>2</sup> − 4x<sup>3</sup> + 7.',o:['2x<sup>3</sup> − 5x<sup>2</sup> + 7','10x<sup>3</sup> − 5x<sup>2</sup> + 7','2x<sup>3</sup> + 5x<sup>2</sup> + 7','2x<sup>3</sup> − 5x<sup>2</sup>'],a:0,h:'6x<sup>3</sup> và −4x<sup>3</sup> cùng bậc: 6x<sup>3</sup> − 4x<sup>3</sup> = 2x<sup>3</sup>. Vậy đa thức là 2x<sup>3</sup> − 5x<sup>2</sup> + 7.'}]}},
{h:'4. Sắp xếp đa thức một biến',s:'Sắp xếp đa thức một biến',B:{n:'Ta thường sắp xếp các hạng tử của đa thức theo luỹ thừa giảm dần (hoặc tăng dần) của biến.',a:[{t:'sort',q:'Sắp xếp các hạng tử theo luỹ thừa giảm dần của x. Em bấm lần lượt từng hạng tử.',i:['5x<sup>3</sup>','−2x<sup>2</sup>','3x','1'],h:'Bắt đầu từ số mũ lớn nhất rồi giảm dần. Số hạng không có x là cuối cùng.'}]}},
{h:'5. Bậc và các hệ số của một đa thức',s:'Bậc và các hệ số của một đa thức',B:{n:'Bậc của đa thức thu gọn là bậc của hạng tử có bậc cao nhất. Hệ số của hạng tử có bậc cao nhất gọi là hệ số cao nhất. Hạng tử không chứa biến gọi là hệ số tự do.',a:[{t:'num',q:'Đa thức −3x<sup>4</sup> + 5x<sup>2</sup> − 2x + 1 có bậc bằng bao nhiêu?',a:4,h:'Hạng tử có bậc cao nhất là −3x<sup>4</sup>, bậc 4.'},{t:'num',q:'Hệ số cao nhất của đa thức đó là bao nhiêu? (Em dùng nút ± để nhập số âm.)',a:-3,h:'Hệ số của hạng tử bậc cao nhất −3x<sup>4</sup> là −3.'},{t:'num',q:'Hệ số tự do của đa thức đó là bao nhiêu?',a:1,h:'Hạng tử không chứa x là 1.'}]}},
{h:'6. Nghiệm của đa thức một biến',s:'Nghiệm của đa thức một biến',B:{n:'Giá trị của đa thức G(x) tại x = 3 kí hiệu là G(3). Nếu tại x = a, đa thức F(x) có giá trị bằng 0, tức là F(a) = 0, thì a gọi là một nghiệm của F(x).',a:[{t:'num',q:'Cho G(x) = x<sup>2</sup> − 4. Tính G(3).',a:5,h:'G(3) = 3<sup>2</sup> − 4 = 9 − 4 = 5.'},{t:'mc',q:'Số nào là nghiệm của đa thức G(x) = x<sup>2</sup> − 4?',o:['2','3','0','1'],a:0,h:'G(2) = 2<sup>2</sup> − 4 = 0 nên 2 là một nghiệm.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: số nghiệm của đa thức',B:{n:'Một đa thức có thể không có nghiệm hoặc có nhiều nghiệm.',a:[{t:'tf',q:'Đúng hay sai? “Một đa thức có thể có nhiều hơn một nghiệm”.',a:true,h:'Ví dụ x<sup>2</sup> − 4 có hai nghiệm là 2 và −2.'},{t:'num',q:'Tính giá trị của đa thức 2x + 1 tại x = 5.',a:11,h:'2 · 5 + 1 = 11.'}]}}]);
hand('adp',[
{h:'Mở đầu',s:'Tình huống: tổng và hiệu của hai đa thức',B:{n:'Tổng và hiệu của hai đa thức cũng là một đa thức. Ta thực hiện bằng cách nhóm các hạng tử cùng bậc.',a:[{t:'mc',q:'Muốn cộng hai đa thức, ta nhóm những hạng tử nào lại với nhau?',o:['Hạng tử cùng bậc','Hạng tử khác bậc','Hạng tử đầu tiên'],a:0,h:'Chỉ cộng được các hạng tử cùng bậc với nhau.'}]}},
{h:'1. Cộng hai đa thức một biến',s:'Cách cộng hai đa thức',B:{n:'Có hai cách cộng: nhóm các hạng tử cùng bậc rồi cộng; hoặc đặt tính cộng sao cho các hạng tử cùng bậc thẳng cột. Phép cộng đa thức có tính chất giao hoán, kết hợp và cộng với đa thức không.',a:[{t:'mc',q:'Tính (3x<sup>2</sup> + 2x) + (x<sup>2</sup> − 5x).',o:['4x<sup>2</sup> − 3x','4x<sup>2</sup> + 7x','2x<sup>2</sup> − 3x','4x<sup>2</sup> − 3'],a:0,h:'(3x<sup>2</sup> + x<sup>2</sup>) + (2x − 5x) = 4x<sup>2</sup> − 3x.'},{t:'num',q:'Cộng hai đa thức 2x + 3 và 5x − 1. Tổng là 7x + ?. Số cần điền là bao nhiêu?',a:2,h:'(2x + 5x) + (3 − 1) = 7x + 2.'},{t:'tf',q:'Đúng hay sai? “A + B = B + A với hai đa thức A, B bất kì”.',a:true,h:'Đây là tính chất giao hoán của phép cộng đa thức.'}]}},
{h:'2. Trừ hai đa thức một biến',s:'Cách trừ hai đa thức',B:{n:'Muốn trừ hai đa thức, ta bỏ ngoặc (đổi dấu mọi hạng tử trong ngoặc đứng sau dấu “−”) rồi thu gọn.',a:[{t:'mc',q:'Tính (5x + 3) − (2x + 1).',o:['3x + 2','3x + 4','7x + 4','3x − 2'],a:0,h:'Bỏ ngoặc: 5x + 3 − 2x − 1 = 3x + 2.'},{t:'mc',q:'Tính (4x<sup>2</sup> − x) − (x<sup>2</sup> + 2x).',o:['3x<sup>2</sup> − 3x','3x<sup>2</sup> + x','5x<sup>2</sup> − 3x','3x<sup>2</sup> − 3'],a:0,h:'4x<sup>2</sup> − x − x<sup>2</sup> − 2x = 3x<sup>2</sup> − 3x.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: ba bạn mua sách cũ',B:{n:'Cửa hàng bán sách cũ đồng giá, nghĩa là mỗi cuốn đều có cùng một giá x đồng.',a:[{t:'mc',q:'Lan mua 5 cuốn, Bình mua 3 cuốn, Dung mua 6 cuốn sách cũ, mỗi cuốn giá x đồng. Tổng số tiền ba bạn phải trả là biểu thức nào?',o:['14x','x + 14','5x · 3x','14 + x'],a:0,h:'5x + 3x + 6x = 14x (đồng).'},{t:'num',q:'Nếu mỗi cuốn sách giá 30000 đồng thì ba bạn trả tổng cộng bao nhiêu đồng?',u:'đồng',a:420000,h:'14 · 30 000 = 420 000 (đồng).'}]}}]);
hand('mup',[
{h:'Mở đầu',s:'Tình huống: bài toán đoán tuổi',B:{n:'Bài toán đoán tuổi: lấy tuổi cộng 1 rồi bình phương; lấy tuổi trừ 1 rồi bình phương; lấy kết quả thứ nhất trừ kết quả thứ hai. Sau bài này, em sẽ biết vì sao đoán được tuổi.',a:[{t:'num',q:'Một bạn 12 tuổi. Tính kết quả thứ nhất (12 + 1)<sup>2</sup>.',a:169,h:'13<sup>2</sup> = 169.'},{t:'num',q:'Tính kết quả thứ hai (12 − 1)<sup>2</sup>.',a:121,h:'11<sup>2</sup> = 121.'},{t:'num',q:'Lấy kết quả thứ nhất trừ kết quả thứ hai. Kết quả cuối cùng là bao nhiêu?',a:48,h:'169 − 121 = 48. Chia 48 cho 4 được 12, đúng tuổi của bạn!'}]}},
{h:'1. Nhân đơn thức với đa thức',s:'Nhân đơn thức với đa thức',B:{n:'Muốn nhân một đơn thức với một đa thức, ta nhân đơn thức đó với từng hạng tử của đa thức rồi cộng các tích với nhau.',a:[{t:'mc',q:'Tính 2x · (x + 3).',o:['2x<sup>2</sup> + 6x','2x<sup>2</sup> + 3','x<sup>2</sup> + 6x','2x + 6'],a:0,h:'2x · x = 2x<sup>2</sup> và 2x · 3 = 6x. Cộng lại: 2x<sup>2</sup> + 6x.'},{t:'mc',q:'Tính x · (x<sup>2</sup> − 2x).',o:['x<sup>3</sup> − 2x<sup>2</sup>','x<sup>3</sup> − 2x','x<sup>2</sup> − 2x','x<sup>3</sup> + 2x<sup>2</sup>'],a:0,h:'x · x<sup>2</sup> = x<sup>3</sup> và x · (−2x) = −2x<sup>2</sup>.'}]}},
{h:'2. Nhân đa thức với đa thức',s:'Nhân đa thức với đa thức',B:{n:'Muốn nhân một đa thức với một đa thức, ta nhân mỗi hạng tử của đa thức này với từng hạng tử của đa thức kia rồi cộng các tích và thu gọn. Phép nhân đa thức có tính chất giao hoán, kết hợp và phân phối đối với phép cộng.',a:[{t:'mc',q:'Tính (x + 1)(x + 2).',o:['x<sup>2</sup> + 3x + 2','x<sup>2</sup> + 2','x<sup>2</sup> + 3x + 3','2x + 3'],a:0,h:'x · x = x<sup>2</sup>; x · 2 = 2x; 1 · x = x; 1 · 2 = 2. Cộng lại: x<sup>2</sup> + 3x + 2.'},{t:'mc',q:'Tính (x − 1)(x + 1).',o:['x<sup>2</sup> − 1','x<sup>2</sup> + 1','x<sup>2</sup> − 2x − 1','2x'],a:0,h:'x<sup>2</sup> + x − x − 1 = x<sup>2</sup> − 1.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: thể tích hình hộp chữ nhật',B:{n:'Thể tích hình hộp chữ nhật bằng tích ba kích thước.',a:[{t:'mc',q:'Hình hộp chữ nhật có ba kích thước x, x + 1 và x + 2. Thể tích là đa thức bậc mấy?',o:['Bậc 3','Bậc 2','Bậc 1','Bậc 4'],a:0,h:'V = x(x + 1)(x + 2) = x<sup>3</sup> + 3x<sup>2</sup> + 2x, là đa thức bậc ba.'},{t:'num',q:'Với x = 1, thể tích V = x<sup>3</sup> + 3x<sup>2</sup> + 2x bằng bao nhiêu?',a:6,h:'1 + 3 + 2 = 6. Cũng bằng 1 · 2 · 3 = 6.'}]}}]);
hand('dvp',[
{h:'Mở đầu',s:'Tình huống: tìm đa thức P sao cho A = B · P',B:{n:'Có hai đa thức A và B. Ta cần tìm đa thức P sao cho A = B · P. Giống như với các số, ta thực hiện phép chia A cho B.',a:[{t:'mc',q:'Nếu A = B · P thì P bằng gì?',o:['A : B','A − B','A + B'],a:0,h:'Muốn tìm thừa số chưa biết, ta lấy tích chia cho thừa số đã biết.'}]}},
{h:'1. Chia đơn thức cho đơn thức',s:'Chia đơn thức cho đơn thức',B:{n:'Muốn chia đơn thức ax<sup>m</sup> cho đơn thức bx<sup>n</sup> (m ≥ n), ta chia hệ số cho hệ số, chia luỹ thừa của biến cho luỹ thừa của biến rồi nhân hai kết quả.',a:[{t:'mc',q:'Tính 6x<sup>5</sup> : (−2x<sup>3</sup>).',o:['−3x<sup>2</sup>','−3x<sup>8</sup>','3x<sup>2</sup>','−4x<sup>2</sup>'],a:0,h:'Chia hệ số: 6 : (−2) = −3. Chia luỹ thừa: x<sup>5</sup> : x<sup>3</sup> = x<sup>2</sup>. Kết quả: −3x<sup>2</sup>.'},{t:'num',q:'Tính 12x<sup>3</sup> : 4x. Hệ số của thương là bao nhiêu?',a:3,h:'12 : 4 = 3 và x<sup>3</sup> : x = x<sup>2</sup>. Thương là 3x<sup>2</sup>.'}]}},
{h:'2. Chia đa thức cho đa thức, trường hợp chia hết',s:'Chia đa thức cho đa thức, trường hợp chia hết',B:{n:'Chia hạng tử bậc cao nhất của số bị chia cho hạng tử bậc cao nhất của số chia để được một hạng tử của thương. Nhân hạng tử đó với số chia rồi lấy số bị chia trừ đi tích để được dư. Lặp lại cho đến khi dư bằng 0 thì phép chia hết.',a:[{t:'sort',q:'Sắp xếp các bước chia đa thức. Em bấm lần lượt từng bước.',i:['Chia hạng tử bậc cao nhất của số bị chia cho hạng tử bậc cao nhất của số chia','Nhân kết quả vừa tìm với số chia','Lấy số bị chia trừ đi tích để được dư','Lặp lại cho đến khi dư bằng 0'],h:'Chia, nhân, trừ, rồi lặp lại.'},{t:'mc',q:'Tính (x<sup>2</sup> + 3x + 2) : (x + 1).',o:['x + 2','x + 1','x + 3','x<sup>2</sup> + 2'],a:0,h:'x<sup>2</sup> : x = x; x · (x + 1) = x<sup>2</sup> + x; dư 2x + 2. Rồi 2x : x = 2; 2 · (x + 1) = 2x + 2; dư 0. Thương là x + 2.'}]}},
{h:'3. Chia đa thức cho đa thức, trường hợp chia có dư',s:'Chia đa thức cho đa thức, trường hợp chia có dư',B:{n:'Nếu dư có bậc nhỏ hơn bậc của số chia thì không chia tiếp được nữa và phép chia có dư. Khi đó: số bị chia = số chia · thương + dư.',a:[{t:'mc',q:'Phép chia hai đa thức dừng lại khi nào?',o:['Dư bằng 0 hoặc bậc của dư nhỏ hơn bậc của số chia','Dư lớn hơn số chia','Thương bằng 0'],a:0,h:'Lúc đó không thể chia tiếp được nữa.'},{t:'mc',q:'Chia x<sup>2</sup> + 1 cho x. Thương và dư là gì?',o:['Thương x, dư 1','Thương x + 1, dư 0','Thương 1, dư x'],a:0,h:'x<sup>2</sup> : x = x. Lấy x<sup>2</sup> + 1 − x · x = 1. Dư 1 có bậc 0, nhỏ hơn bậc của x.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: chia đa thức',B:{n:'Em kiểm tra kết quả bằng cách nhân thương với số chia.',a:[{t:'mc',q:'Tính (x<sup>2</sup> − 4) : (x − 2).',o:['x + 2','x − 2','x<sup>2</sup> + 2','x + 4'],a:0,h:'Vì (x − 2)(x + 2) = x<sup>2</sup> − 4 nên thương là x + 2.'},{t:'mc',q:'Chia 6x<sup>2</sup> + 3x cho 3x.',o:['2x + 1','2x + 3','6x + 1','2x'],a:0,h:'6x<sup>2</sup> : 3x = 2x và 3x : 3x = 1. Kết quả: 2x + 1.'}]}}]);

Object.assign(LA,{event:[{v:emo(['🌞 mọc ở phía tây?'],'#fef9c3'),q:'Ngày mai Mặt Trời mọc ở phía tây. Chuyện này có xảy ra được không?',o:['Không thể','Chắc chắn'],a:0,h:'Mặt Trời không bao giờ mọc ở phía tây. Đó là chuyện không thể.'},{v:emo(['🟡 tung đồng xu 🟡'],'#f0f9ff'),q:'Em tung một đồng xu. Có thể ra mặt ngửa, có thể ra mặt sấp. Em có biết trước không?',o:['Không biết trước','Biết trước'],a:0,h:'Tung đồng xu thì không biết trước ra mặt nào.'}],
xs:[{v:emo(['👜 🔴🔵'],'#fdf2f8'),q:'Trong túi có 1 quả bóng đỏ và 1 quả bóng xanh. Em lấy một quả mà không nhìn. Quả nào dễ lấy hơn?',o:['Như nhau','Quả bóng đỏ'],a:0,h:'Mỗi loại có 1 quả nên dễ lấy như nhau.'},{v:emo(['👜 🔴🔴🔴🔵'],'#fdf2f8'),q:'Trong túi có 3 quả bóng đỏ và 1 quả bóng xanh. Em lấy một quả mà không nhìn. Dễ lấy được quả nào hơn?',o:['Bóng đỏ','Bóng xanh'],a:0,h:'Có nhiều bóng đỏ hơn nên dễ lấy được bóng đỏ hơn.'}]});
hand('event',[
{h:'Mở đầu',s:'Tình huống: những sự kiện không thể biết trước',B:{n:'Trong cuộc sống, có những sự kiện ta không thể nói trước là có xảy ra hay không, ví dụ sạt lở đất sau mưa lớn. Cũng có những sự kiện ta biết trước chắc chắn có xảy ra hay không xảy ra.',a:[{t:'mc',q:'Sự kiện nào sau đây ta không thể biết trước chắc chắn có xảy ra hay không?',o:['Mức nước lũ trên sông Hồng trong tháng Bảy sang năm vượt mức báo động 3','Ngày mai, Mặt Trời mọc ở phía tây','Gieo một con xúc xắc, số chấm xuất hiện bé hơn 7'],a:0,h:'Hai sự kiện còn lại ta biết trước: sự kiện thứ hai không bao giờ xảy ra, sự kiện thứ ba luôn xảy ra.'}]}},
{h:'1. Biến cố',s:'Biến cố chắc chắn, biến cố không thể, biến cố ngẫu nhiên',B:{n:'Các hiện tượng, sự kiện trong tự nhiên và cuộc sống gọi chung là biến cố. Biến cố chắc chắn là biến cố biết trước luôn xảy ra. Biến cố không thể là biến cố biết trước không bao giờ xảy ra. Biến cố ngẫu nhiên là biến cố không thể biết trước có xảy ra hay không.',a:[{t:'match',q:'Nối mỗi biến cố với loại biến cố.',p:[['Ngày mai, Mặt Trời mọc ở phía tây','Biến cố không thể'],['Gieo một con xúc xắc, số chấm bé hơn 7','Biến cố chắc chắn'],['Có sáu cơn bão đổ bộ vào nước ta trong năm tới','Biến cố ngẫu nhiên']],h:'Hỏi: biến cố này luôn xảy ra, không bao giờ xảy ra, hay không biết trước?'},{t:'mc',q:'Trong hộp có 4 thẻ ghi số 1; 2; 3; 6. Rút ngẫu nhiên một thẻ. “Rút được thẻ ghi số nhỏ hơn 7” là biến cố gì?',o:['Chắc chắn','Không thể','Ngẫu nhiên'],a:0,h:'Cả bốn số đều nhỏ hơn 7 nên biến cố này luôn xảy ra.'},{t:'mc',q:'Cũng hộp thẻ đó, “Rút được thẻ ghi số lớn hơn 10” là biến cố gì?',o:['Không thể','Chắc chắn','Ngẫu nhiên'],a:0,h:'Không có thẻ nào ghi số lớn hơn 10 nên biến cố này không bao giờ xảy ra.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: lấy bi từ túi',B:{n:'Em xác định loại biến cố bằng cách xem biến cố đó luôn xảy ra, không bao giờ xảy ra, hay có thể xảy ra hoặc không.',a:[{t:'mc',q:'Minh lấy ngẫu nhiên một viên bi từ túi có 5 viên bi trắng và 5 viên bi đen. “Minh lấy được viên bi màu đỏ” là biến cố gì?',o:['Không thể','Chắc chắn','Ngẫu nhiên'],a:0,h:'Trong túi không có viên bi đỏ nào.'},{t:'mc',q:'Cũng túi bi đó, “Minh lấy được viên bi màu trắng hoặc màu đen” là biến cố gì?',o:['Chắc chắn','Không thể','Ngẫu nhiên'],a:0,h:'Túi chỉ có bi trắng và bi đen nên luôn lấy được một trong hai màu.'},{t:'mc',q:'Cũng túi bi đó, “Minh lấy được viên bi màu trắng” là biến cố gì?',o:['Ngẫu nhiên','Chắc chắn','Không thể'],a:0,h:'Có thể lấy được bi trắng, cũng có thể lấy được bi đen, không biết trước.'}]}}]);
hand('xs',[
{h:'Mở đầu',s:'Tình huống: đo khả năng xảy ra bằng con số',B:{n:'Trong đời sống, ta thường nghe những câu như “nhiều khả năng ngày mai có mưa” hay “khả năng có mưa là 80%”. Bài này giúp ta đo khả năng xảy ra của một biến cố bằng con số.',a:[{t:'mc',q:'Bản tin dự báo: khả năng có mưa là 80%. Khả năng có mưa như thế nào?',o:['Nhiều khả năng','Ít khả năng','Không thể'],a:0,h:'80% là gần 100% nên có mưa là nhiều khả năng.'}]}},
{h:'1. Xác suất của biến cố',s:'Xác suất là gì?',B:{n:'Xác suất của một biến cố là con số đo khả năng xảy ra của biến cố đó. Xác suất càng gần 1 thì biến cố càng có nhiều khả năng xảy ra. Xác suất càng gần 0 thì biến cố càng ít khả năng xảy ra. Xác suất có thể viết dưới dạng phân số, số thập phân hoặc phần trăm.',a:[{t:'mc',q:'Biến cố A có xác suất 0,95; biến cố B có xác suất 0,05. Biến cố nào nhiều khả năng xảy ra hơn?',o:['Biến cố A','Biến cố B','Như nhau'],a:0,h:'0,95 gần 1 hơn 0,05 nên biến cố A nhiều khả năng xảy ra hơn.'},{t:'tf',q:'Đúng hay sai? “Xác suất xuất hiện mặt sấp khi gieo một đồng xu cân đối là 50%”.',a:true,h:'Mặt sấp và mặt ngửa có khả năng như nhau nên mỗi mặt có xác suất {1/2} = 50%.'}]}},
{h:'2. Xác suất của một số biến cố đơn giản',s:'Xác suất của biến cố chắc chắn, biến cố không thể',B:{n:'Biến cố chắc chắn có xác suất bằng 1. Biến cố không thể có xác suất bằng 0.',a:[{t:'num',q:'Xác suất của biến cố “Ngày mai, Mặt Trời mọc ở phía tây” bằng bao nhiêu?',a:0,h:'Đây là biến cố không thể nên xác suất bằng 0.'},{t:'num',q:'Xác suất của biến cố “Tháng Ba có ít hơn 32 ngày” bằng bao nhiêu?',a:1,h:'Tháng Ba luôn có 31 ngày, đây là biến cố chắc chắn nên xác suất bằng 1.'}]}},
{h:'2. Xác suất của một số biến cố đơn giản',s:'Xác suất của các biến cố đồng khả năng',B:{n:'Các biến cố có khả năng xảy ra như nhau gọi là các biến cố đồng khả năng. Nếu có n biến cố đồng khả năng và mỗi lần luôn xảy ra đúng một trong số đó thì xác suất của mỗi biến cố bằng {1/n}.',a:[{t:'mc',q:'Gieo một đồng xu cân đối. Xác suất xuất hiện mặt ngửa là bao nhiêu?',o:['{1/2}','{1/3}','1','0'],a:0,h:'Mặt ngửa và mặt sấp đồng khả năng nên mỗi mặt có xác suất {1/2}.'},{t:'mc',q:'Hộp có 10 lá phiếu giống nhau ghi các số từ 1 đến 10. Mai rút ngẫu nhiên một lá. Xác suất Mai rút được phiếu ghi số 5 là bao nhiêu?',o:['{1/10}','{1/5}','{5/10}','1'],a:0,h:'Có 10 biến cố đồng khả năng nên mỗi biến cố có xác suất {1/10}.'},{t:'mc',q:'Một tổ có 5 bạn nam và 5 bạn nữ. Gọi ngẫu nhiên một bạn lên bảng. Xác suất gọi được bạn nam là bao nhiêu?',o:['{1/2}','{1/5}','1','0'],a:0,h:'Hai biến cố “gọi được bạn nam” và “gọi được bạn nữ” đồng khả năng nên mỗi biến cố có xác suất {1/2}.'}]}},
{h:'Luyện tập – Vận dụng',s:'Vận dụng: quay tấm bìa có 6 hình quạt',B:{n:'Một tấm bìa hình tròn chia làm 6 phần bằng nhau, ghi các số 1; 2; 3; 4; 5; 6. Nam quay tấm bìa và mũi tên dừng ở một hình quạt.',a:[{t:'mc',q:'Xác suất mũi tên dừng ở hình quạt ghi số bé hơn 7 là bao nhiêu?',o:['1','0','{1/6}','{1/2}'],a:0,h:'Số nào trên tấm bìa cũng bé hơn 7 nên đây là biến cố chắc chắn, xác suất bằng 1.'},{t:'mc',q:'Xác suất mũi tên dừng ở hình quạt ghi số 2 là bao nhiêu?',o:['{1/6}','{1/2}','1','0'],a:0,h:'Có 6 hình quạt bằng nhau nên 6 biến cố đồng khả năng, mỗi biến cố có xác suất {1/6}.'},{t:'mc',q:'Nam nhận 100 điểm nếu mũi tên dừng ở số 1 hoặc số 2. Xác suất Nam nhận 100 điểm là bao nhiêu?',o:['{1/3}','{1/6}','{1/2}','1'],a:0,h:'Có 2 hình quạt thuận lợi trong tổng số 6 hình quạt: {2/6} = {1/3}.'}]}}]);

Object.assign(LA,{ags:[{v:ladder(),q:'Cái thang dựa vào bức tường. Thang, tường và mặt đất tạo thành một tam giác vuông. Cạnh nào dài nhất?',o:['Cái thang','Bức tường'],a:0,h:'Trong tam giác vuông, cạnh đối diện với góc vuông là cạnh dài nhất. Đó là cái thang.'}],
