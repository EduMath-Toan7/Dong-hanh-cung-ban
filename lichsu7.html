<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Chúng mình cùng học Lịch sử 7</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b45309"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ea;--cd:#fff;--tx:#2b2118;--mu:#6b5b4b;--pr:#b45309;--pr2:#7c2d12;--ok:#15803d;--okb:#dcfce7;--wb:#fff4dc;--bd:#e7dcc6;--sh:0 8px 24px rgba(124,45,18,.12);--c:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#17130f;--cd:#241d16;--tx:#f6efe4;--mu:#c3b6a3;--pr:#f59e0b;--pr2:#fbbf24;--ok:#5fd18d;--okb:#1c3a2a;--wb:#3a2c17;--bd:#4a3d2d;--sh:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.6 'Be Vietnam Pro','Segoe UI',system-ui,Roboto,Arial,sans-serif;background-image:radial-gradient(var(--bd) 1px,transparent 1.5px);background-size:26px 26px}
body.big{font-size:25px}
#app{max-width:860px;margin:0 auto;padding:12px 14px 70px}
h1{font-size:1.4em;line-height:1.25;margin:.2em 0}h2{font-size:1.05em;margin:1.3em 0 .4em;color:var(--pr2)}h3{margin:.2em 0}
@media(prefers-color-scheme:dark){h2{color:var(--pr)}}
button,.btn{font:inherit;color:inherit;cursor:pointer;border:3px solid var(--bd);background:var(--cd);border-radius:16px;padding:10px 14px;min-height:54px;max-width:100%;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,box-shadow .15s}
button:focus-visible,.btn:focus-visible,a:focus-visible{outline:4px solid var(--pr);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}button:active{transform:translateY(2px)}
@media(prefers-reduced-motion:no-preference){button:not(:disabled):hover,.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,.1)}}
.sm{min-height:46px;padding:4px 12px;font-size:.78em;border-radius:14px}
.on{background:var(--pr)!important;color:#fff!important;border-color:var(--pr)!important}
.pri{background:linear-gradient(135deg,var(--c,#b45309),color-mix(in srgb,var(--c,#b45309) 70%,#000));color:#fff;border-color:transparent;font-weight:700;min-height:60px;padding:12px 22px;border-radius:18px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:2px 0 10px}.top .sp{flex:1}
.hero{position:relative;overflow:hidden;display:flex;gap:16px;align-items:center;color:#fff;border-radius:28px;padding:18px 20px;margin:8px 0 12px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 8px 0 rgba(0,0,0,.14),var(--sh)}
.hero:before{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.14)}
.hero .hi{flex:none;width:74px;height:74px;border-radius:22px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:2.4rem;position:relative}
.hero div{position:relative;min-width:0}.hero small{display:block;font-size:.66em;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.92}.hero h1{color:#fff;margin:.1em 0}.hero p{margin:.2em 0 0;font-size:.85em;opacity:.95}
.card,.box{background:var(--cd);border:2px solid var(--bd);border-radius:22px;padding:14px 16px;margin:12px 0;box-shadow:0 4px 0 rgba(0,0,0,.05)}
.box{border-top:8px solid var(--c)}
.memo{background:var(--wb);border:3px dashed #f0b429;border-radius:18px;padding:12px 14px;margin:12px 0}
.msg{min-height:3em;border-radius:14px;padding:10px 12px;margin:10px 0;background:var(--wb)}.msg.g{background:var(--okb);border:2px solid var(--ok)}
.hint{background:var(--wb);border-radius:12px;padding:8px 12px;margin:8px 0}
.say{min-height:44px;min-width:44px;padding:2px 10px;border-radius:999px;font-size:.85em;flex:none;background:var(--wb)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:10px 0}
.tile{flex-direction:column;align-items:flex-start;text-align:left;min-height:110px;padding:14px;border:0;color:#fff;border-radius:24px;background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));box-shadow:0 6px 0 rgba(0,0,0,.2)}
.tile .ti{font-size:2rem;line-height:1}.tile b{font-size:1em}.tile small{opacity:.92;font-size:.72em;line-height:1.3}
.les{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:9px 0;border-left:12px solid var(--c);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.07);justify-content:flex-start}
.les .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;flex:none;background:color-mix(in srgb,var(--c) 16%,var(--cd))}
.les .tx{display:block;min-width:0;flex:1}.les b{display:block;line-height:1.3}.les small{display:block;color:var(--mu);font-size:.72em}.les .st{margin-left:auto;white-space:nowrap;font-weight:700;text-align:right;font-size:.85em}
.stars{font-style:normal;color:#f59e0b;display:block;letter-spacing:1px}
.off{display:flex;gap:10px;align-items:center;opacity:.7;padding:8px 12px;margin:6px 0;border:2px dashed var(--bd);border-radius:16px;color:var(--mu);font-size:.85em}
.chap{display:flex;align-items:center;gap:10px;margin:22px 0 4px;padding:8px 14px;border-radius:16px;background:color-mix(in srgb,var(--c) 14%,var(--cd));border:2px solid color-mix(in srgb,var(--c) 40%,var(--bd));font-weight:800;color:var(--tx)}
.chap span{font-size:1.4em}
.pb{height:16px;border-radius:99px;background:var(--bd);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,#16a34a,#84cc16);border-radius:99px}
.dots{display:flex;gap:6px;margin:6px 0 2px}.dots i{width:14px;height:14px;border-radius:50%;background:var(--bd)}.dots i.d{background:var(--ok)}.dots i.c{background:var(--c)}
/* bìa */
.cover{background:var(--cd);border:3px solid var(--bd);border-radius:30px;overflow:hidden;box-shadow:var(--sh);margin:8px 0}
.cover svg{display:block;width:100%;height:auto}
.cover .ttl{text-align:center;padding:14px 16px 20px}.cover .eb{font-size:.62em;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--pr)}
.cover h1{font-size:2em;margin:.1em 0;color:var(--pr2)}@media(prefers-color-scheme:dark){.cover h1{color:var(--pr2)}}
.cover h1 em{font-style:normal;color:var(--pr)}.cover .sub{font-size:.82em;color:var(--mu)}
.pick{font-weight:800;text-align:center;font-size:1.15em;margin:20px 0 6px}.pick:after{content:"▼";display:block;color:#f59e0b;font-size:.7em}
.lvs{display:grid;gap:18px;margin:10px 0}@media(min-width:760px){.lvs{grid-template-columns:1fr 1fr}}
.lv{display:block;width:100%;text-align:left;padding:0;border:6px solid var(--lc);border-radius:28px;overflow:hidden;background:var(--cd);box-shadow:0 8px 0 rgba(0,0,0,.12)}
.lv .lh{display:block;background:var(--lc);color:#fff;padding:10px 16px;font-weight:800}.lv .lh small{display:block;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
.lv .lb{display:block;padding:12px 16px 16px;font-size:.88em;color:var(--tx)}.lv .ch{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.lv .ch i{font-style:normal;font-size:.8em;border:2px solid var(--lc);border-radius:999px;padding:1px 10px;font-weight:700}
.lv .go{display:flex;justify-content:center;background:var(--lc);color:#fff;border-radius:999px;padding:8px;font-weight:800;font-size:1.05em}
/* đọc ý chính */
.kc{display:flex;gap:12px;align-items:flex-start;background:var(--cd);border:2px solid var(--bd);border-left:10px solid var(--c);border-radius:20px;padding:12px 14px;margin:10px 0}
.kc .e{font-size:2rem;line-height:1.1;flex:none}.kc p{margin:0;flex:1}
.goal{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--c) 12%,var(--cd));border:2px solid color-mix(in srgb,var(--c) 40%,var(--bd));border-radius:18px;padding:10px 14px;margin:10px 0}.goal p{margin:0;flex:1}
details{background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:8px 14px;margin:10px 0}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
/* mức 2 */
.big2{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:var(--cd);border:4px solid var(--c);border-radius:28px;padding:20px 16px;margin:14px 0;box-shadow:0 6px 0 rgba(0,0,0,.08)}
.big2 .e{font-size:4.2rem;line-height:1}.big2 p{margin:0;font-size:1.25em;font-weight:700}
/* dòng thời gian */
.tm{position:relative;margin:14px 0 6px;padding-left:4px}.tm:before{content:"";position:absolute;left:46px;top:6px;bottom:6px;width:5px;border-radius:5px;background:linear-gradient(var(--c),color-mix(in srgb,var(--c) 30%,var(--bd)))}
.ev{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:6px 0;min-height:0;box-shadow:none!important;transform:none!important}
.ev .y{flex:none;width:92px;text-align:center;position:relative;z-index:1;background:var(--c);color:#fff;border-radius:14px;padding:4px 2px;font-weight:800;font-size:.85em;margin-top:4px;box-shadow:0 0 0 5px var(--bg)}
.ev .b{flex:1;min-width:0;background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:10px 12px}.ev .b b{display:block;line-height:1.35}.ev .d{display:none;margin-top:6px;color:var(--mu);font-size:.9em}
.ev[aria-expanded=true] .d{display:block}.ev[aria-expanded=true] .b{border-color:var(--c)}
.ev .ar{float:right;color:var(--c);font-weight:800}
/* nhân vật */
.pcs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:12px 0}
.pc{display:block;width:100%;text-align:left;padding:0;border-radius:22px;border:3px solid color-mix(in srgb,var(--c) 45%,var(--bd));overflow:hidden;background:var(--cd);min-height:0}
.pc .ph{display:flex;gap:12px;align-items:center;padding:12px 14px}.pc .pi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb,var(--c) 18%,var(--cd));flex:none}
.pc b{display:block;line-height:1.25}.pc small{display:block;color:var(--mu);font-size:.72em}
.pc .pd{display:none;padding:0 14px 14px;font-size:.92em}.pc[aria-expanded=true] .pd{display:block}.pc[aria-expanded=true]{border-color:var(--c)}
.pc .pd div{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
/* câu hỏi */
.q{font-size:1.12em;font-weight:700;margin:8px 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:12px 0}.opts button{font-weight:700;min-height:66px;font-size:1.02em;line-height:1.3}
.opts button:nth-child(3n+1){background:color-mix(in srgb,#2563eb 9%,var(--cd))}.opts button:nth-child(3n+2){background:color-mix(in srgb,#f59e0b 12%,var(--cd))}.opts button:nth-child(3n){background:color-mix(in srgb,#16a34a 10%,var(--cd))}
.yes{background:var(--okb)!important;border-color:var(--ok)!important;opacity:1!important}.no{opacity:.4;text-decoration:line-through}.sel{border-color:var(--c)!important;border-width:5px}
.pulse{border-color:var(--ok)!important;border-width:6px}@media(prefers-reduced-motion:no-preference){.pulse{animation:pl 1s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.04)}}}
.slots{display:grid;gap:8px;margin:10px 0}.slot{display:flex;gap:10px;align-items:center;min-height:56px;border:3px dashed var(--bd);border-radius:14px;padding:6px 12px;background:var(--cd)}.slot em{font-style:normal;flex:none;width:34px;height:34px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:800;font-size:.8em}
.slot.f{border-style:solid;border-color:var(--ok);background:var(--okb)}.slot.f em{background:var(--ok);color:#fff}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}.bank button{font-weight:600;font-size:.95em}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.mt div{display:grid;gap:10px;align-content:start}.mt button{font-size:.92em;line-height:1.3}
@media(max-width:480px){.mt{gap:6px}.mt button{font-size:.85em;padding:8px 6px}}
.res{text-align:center}.res .big{font-size:3.6rem;line-height:1.1}.res .sc{font-size:1.6em;font-weight:800;color:var(--c)}
.rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.cf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.cf i{position:absolute;top:-14px;width:10px;height:16px;border-radius:3px;animation:fall 1.6s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
/* toàn cảnh */
.era{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 12px;scroll-snap-type:x proximity;margin:6px 0}
.era button{flex:none;scroll-snap-align:start;flex-direction:column;align-items:flex-start;text-align:left;min-height:0;padding:8px 12px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,var(--cd));border-radius:16px}
.era b{font-size:.85em;line-height:1.25;max-width:170px}.era small{font-size:.7em;color:var(--mu)}
.cent{position:sticky;top:0;z-index:2;margin:18px 0 6px;background:var(--pr);color:#fff;border-radius:14px;padding:4px 14px;font-weight:800;font-size:.95em}
.trow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;min-height:0;margin:6px 0;border-left:10px solid var(--c);border-radius:16px;padding:8px 12px}
.trow .yr{flex:none;width:58px;font-weight:800;color:var(--c)}.trow span{flex:1;line-height:1.35}.trow small{display:block;color:var(--mu);font-size:.72em}
.tb{width:100%;border-collapse:collapse;font-size:.85em}.tb th,.tb td{border:2px solid var(--bd);padding:6px 8px;text-align:left}.tb th{background:var(--wb)}
.nr{display:flex;gap:8px;margin:10px 0}.nr input{font:inherit;flex:1;min-width:0;padding:10px;border:3px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx)}
.foot{text-align:center;color:var(--mu);font-size:.72em;margin:26px 0 0}

/* ===== Tiêu đề kiểu trang Toán: khối màu bo tròn, vòng tròn mờ, chữ mờ trang trí ===== */
.cv:before,.cv:after,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);pointer-events:none}
.cv:after,.hero:after{width:110px;height:110px;right:70px;bottom:-60px}
/* thanh trên: nút tròn, bóng nhẹ như trang Toán */
.top button,.top .btn{border:0;border-radius:999px;background:var(--cd);box-shadow:0 3px 10px #1d24331a;font-weight:600}
.top .on{box-shadow:0 3px 10px #b4530955}
/* tiêu đề từng bài và trang chủ môn: cùng kiểu */
.hero{border-radius:30px;box-shadow:0 16px 36px color-mix(in srgb,var(--c) 38%,transparent)}
.hero small{display:inline-block;background:rgba(255,255,255,.22);border-radius:999px;padding:2px 12px;letter-spacing:0;text-transform:none;font-weight:700;opacity:1;margin-bottom:4px}
/* hai thẻ chọn mức: giống thẻ bài của trang Toán */
.lv{border:0;border-radius:26px;box-shadow:0 5px 18px #1d243318;position:relative;transition:transform .18s,box-shadow .18s}
.lv:before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:7px;border-radius:0 7px 7px 0;background:var(--lc)}
.lv:hover{transform:translateY(-3px);box-shadow:0 12px 28px #1d24332b}
.lv .lh{background:none;color:var(--tx);padding:18px 18px 0 24px;font-size:1.1em}
.lv .lh small{display:inline-block;background:var(--lc);color:#fff;border-radius:999px;padding:1px 12px;font-size:.62em;letter-spacing:0;text-transform:none;opacity:1;margin-bottom:6px}
.lv .lb{padding:8px 18px 18px 24px}
.lv .ch i{border-width:1px;background:color-mix(in srgb,var(--lc) 10%,var(--cd))}
.lv .go{box-shadow:0 4px 12px color-mix(in srgb,var(--lc) 40%,transparent)}


/* ===== Trang đầu: kiểu giấy như trang Toán, đổi sang tông cam đỏ của Lịch sử ===== */
body.paper{background:#fbf6ea;background-image:radial-gradient(#e6d9bb 1px,transparent 1.5px);background-size:22px 22px;color:#2b2622}
.p1 .ppt{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.p1 .gap{flex:1 1 auto}
.p1 .ppt .btn,.p1 .ppt button{min-height:42px;min-width:42px;padding:2px 14px;border-radius:999px;font-size:.78em;background:#fffaf0!important;color:#3b2f2a!important;border:1.5px solid #3b2f2a!important;box-shadow:none;white-space:nowrap;flex:0 0 auto;width:auto}
.p1 .ppt .on{background:#3b2f2a!important;color:#fde68a!important}
.p1 .tf{position:relative;margin:16px 2px 8px;padding:12px 12px 10px;border:5px solid transparent;border-radius:32px;background:linear-gradient(#fffdf6,#fffdf6) padding-box,linear-gradient(135deg,#f59e0b 0%,#ea580c 52%,#be123c 100%) border-box;box-shadow:0 12px 28px rgba(190,18,60,.2)}
.p1 .tf:before{content:"";position:absolute;inset:6px;border:2px dashed rgba(59,47,42,.32);border-radius:24px;pointer-events:none}
.p1 .swash{display:block;width:min(100%,520px);margin:2px auto 0;height:auto}
.p1 .tw{position:relative;padding:0 clamp(26px,9vw,56px);margin-bottom:2px}
.p1 .tn{display:flex;flex-direction:column;align-items:center;margin:4px 0 2px;text-align:center;font-weight:800;letter-spacing:-.01em;color:#2b2622;line-height:1}
.p1 .l1{font-size:clamp(20px,5.2vw,34px);line-height:1.12}
.p1 .l2{font-size:clamp(44px,13vw,76px);line-height:1;white-space:nowrap}
.p1 .bf{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(80,50,10,.25))}
.p1 .bf.tl{width:56px;left:2px;top:-4px;transform:rotate(-20deg)}
.p1 .bf.tr{width:62px;right:2px;top:10px;transform:rotate(16deg)}
@media(prefers-reduced-motion:no-preference){.p1 .bf.tl{animation:flt 5s ease-in-out infinite}.p1 .bf.tr{animation:flt 6s ease-in-out infinite reverse}@keyframes flt{50%{translate:0 -6px}}}
.p1 .subl{text-align:center;font-size:.82em;font-style:italic;color:#6b4a2b;margin:4px 0 0}
.p1 .pjn{display:flex;align-items:center;gap:12px;max-width:600px;margin:6px auto 2px}
.p1 .pjn i{flex:1;height:1px;background:#3b2f2a;opacity:.4}
.p1 .pjn span{font-size:.6em;letter-spacing:.14em;text-transform:uppercase;text-align:center;line-height:1.75;color:#6b4a2b;font-weight:600}
.p1 .pk2{font-weight:800;font-size:clamp(20px,5.4vw,30px);line-height:1.35;text-align:center;margin:20px 0 6px;color:#2b2622}
.p1 .pk2:after{content:"▼";display:block;color:#f59e0b;font-size:.7em;line-height:1;margin-top:6px}
.p1 .lvs{display:grid;gap:26px;margin:10px 0 6px}
@media(min-width:760px){.p1 .lvs{grid-template-columns:1fr 1fr}}
.p1 .lvc{display:block;text-align:left;border:6px solid var(--lc);border-radius:32px;background:var(--lbg);overflow:hidden;color:#1f2937;box-shadow:0 10px 0 var(--lsh),0 20px 34px rgba(0,0,0,.14);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.p1 .lvc:hover,.p1 .lvc:focus-visible{outline:6px solid #f59e0b;outline-offset:4px}
@media(prefers-reduced-motion:no-preference){.p1 .lvc:hover{transform:translateY(-6px)}}
.p1 .lvc:active{transform:translateY(3px)}
.p1 .lp{display:block;line-height:0;border-bottom:6px solid var(--lc)}
.p1 .lp svg{display:block;width:100%;height:auto}
.p1 .lb2{display:block;padding:16px 18px 20px}
.p1 .lvc small{display:inline-block;background:var(--lc);color:#fff;font-size:.95em;font-weight:800;letter-spacing:.1em;padding:5px 18px;border-radius:999px;margin-bottom:10px}
.p1 .lt4{display:block;font-weight:800;font-size:1.5em;line-height:1.25;color:var(--lsh);margin:0 0 8px}

<script>

const rom=n=>{const m=[[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';m.forEach(([v,r])=>{while(n>=v){s+=r;n-=v}});return s};

/* ================= Giọng đọc Tiếng Việt (chạy trên mọi máy) =================
   1) Dùng giọng vi-VN có sẵn trong máy (ưu tiên giọng tự nhiên/online).
   2) Máy không có giọng Tiếng Việt: đọc qua mạng (cần internet), không bao giờ đọc bằng giọng nước khác.
   3) Hiện dòng báo nhỏ ở cuối màn hình khi đang đọc qua mạng hoặc khi không đọc được. */
const SS=window.speechSynthesis;let VOICE=null,GID=0,AU=null,NOTE=null;
const isVi=v=>/^vi([-_]|$)/i.test(v.lang)||/vietnam|ti[eế]ng vi[eệ]t|hoaimy|namminh/i.test(v.name);
const scV=v=>(/natural|online/i.test(v.name)?4:0)+(/google/i.test(v.name)?3:0)+(/microsoft/i.test(v.name)?2:0);
function pickV(){if(!SS)return;try{VOICE=SS.getVoices().filter(isVi).sort((a,b)=>scV(b)-scV(a))[0]||null}catch(e){}}
if(SS){pickV();SS.onvoiceschanged=pickV;let n=0;const t=setInterval(()=>{if(VOICE||++n>10)clearInterval(t);else pickV()},500)}
{const m=document.createElement('meta');m.name='referrer';m.content='no-referrer';document.head.appendChild(m)}
function note(msg,warn){if(!NOTE){NOTE=document.createElement('div');NOTE.setAttribute('role','status');NOTE.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:70;padding:8px 12px;border-radius:14px;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none';document.body.appendChild(NOTE)}
 if(!msg){NOTE.style.display='none';return}NOTE.textContent=msg;NOTE.style.background=warn?'#fee2e2':'#fff4dc';NOTE.style.color=warn?'#991b1b':'#7c2d12';NOTE.style.display='block';clearTimeout(NOTE._t);NOTE._t=setTimeout(()=>{NOTE.style.display='none'},warn?9000:5000)}
const clean=t=>String(t).replace(/<[^>]+>/g,' ').replace(/\p{Extended_Pictographic}|[️‍✓⬅➡▶]/gu,' ').replace(/[–—]/g,', ').replace(/\bTK\b/g,'thế kỉ').replace(/(kỉ|TK)\s+([IVX]{1,6})\b/g,(m,a,r)=>{const v={I:1,V:5,X:10};let n=0;for(let i=0;i<r.length;i++){const c=v[r[i]],d=v[r[i+1]]||0;n+=c<d?-c:c}return a+' '+n}).replace(/(\d),(\d)/g,'$1 phẩy $2').replace(/\s+/g,' ').trim();
const chunks=t=>{const o=[];(t.match(/[^.!?;:]+[.!?;:]*/g)||[t]).forEach(p=>{p=p.trim();while(p.length>170){let i=p.lastIndexOf(' ',170);if(i<50)i=170;o.push(p.slice(0,i));p=p.slice(i).trim()}if(/[\p{L}\d]/u.test(p))o.push(p)});return o};
function stopS(){GID++;try{if(AU){AU.pause();AU=null}}catch(e){}try{SS&&SS.cancel()}catch(e){}}
function netSpeak(t){stopS();const id=GID,q=chunks(clean(t));let fail=0;
 note('Máy chưa có giọng Tiếng Việt nên đang đọc qua mạng (cần internet).');
 (function nx(i){if(id!==GID||i>=q.length)return;const a=AU=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q='+encodeURIComponent(q[i]));a.playbackRate=.9;a.onended=()=>nx(i+1);
  a.onerror=()=>{if(id===GID&&!fail++)note('Không đọc được qua mạng. Em kiểm tra internet, hoặc cài giọng Tiếng Việt cho máy (Cài đặt › Ngôn ngữ › Tiếng Việt › Giọng nói).',1)};
  const p=a.play();if(p&&p.catch)p.catch(()=>{if(id===GID&&!fail++)note('Trình duyệt chưa cho phát tiếng. Em bấm nút 🔊 một lần nữa nhé.',1)})})(0)}
function speak(t){if(!t)return;t=clean(t);if(!t)return;
 if(!SS)return netSpeak(t);if(!VOICE)pickV();
 let n=0;try{n=SS.getVoices().length}catch(e){}
 if(!VOICE&&n)return netSpeak(t);              /* có giọng nhưng không có Tiếng Việt: đọc qua mạng, không đọc sai tiếng */
 stopS();const id=GID;
 setTimeout(()=>{if(id!==GID)return;try{chunks(t).forEach(s=>{const u=new SpeechSynthesisUtterance(s);
  if(VOICE){u.voice=VOICE;u.lang=/^vi/i.test(VOICE.lang)?VOICE.lang.replace('_','-'):'vi-VN'}else u.lang='vi-VN';
  u.rate=.88;SS.speak(u)})}catch(e){netSpeak(t)}},80)}
const sp=b=>speak(b.dataset.t);
const sayB=t=>`<button class="say" data-t="${esc(t)}" onclick="sp(this)" aria-label="Nghe đọc">🔊</button>`;

 const t=p.best!=null?`Lần tốt nhất: ${Math.round(p.best*100)}%`:'Không có gợi ý';
 let h=bar('home()')+hero(id,L2?'Em làm từng bước nhỏ nhé':null)+`<div class="goal"><span>🎯</span><p><b>Em sẽ học được:</b> ${esc(l.goal)}</p>${sayB('Em sẽ học được: '+l.goal)}</div><h2>Các bước học</h2>`;
 if(L2)h+=stp(1,'👀','Xem và nghe','3 ý rất ngắn, có giọng đọc',`view2('${id}')`,p.s.v)+stp(2,'🤝','Cùng làm','Câu hỏi hai lựa chọn, có gợi ý',`startQ('${id}','ez')`,p.s.c);
 else h+=stp(1,'📖','Ý chính','Đọc ngắn, có mẹo nhớ',`key('${id}')`,p.s.k)+stp(2,'🕰️','Dòng thời gian','Các sự kiện theo năm',`tline('${id}')`,p.s.t)+stp(3,'🧑‍🤝‍🧑','Nhân vật','Thẻ nhân vật, bấm để lật',`people('${id}')`,p.s.p)+stp(4,'🎲','Luyện tập','Có gợi ý, làm lại thoải mái',`startQ('${id}','pr')`,p.s.pr)+stp(5,'📝','Tự kiểm tra',t,`startQ('${id}','ts')`,p.s.ts);
 mount(h)}

 let h=bar(`lesson('${id}')`)+hero(id,'1. Ý chính')+`<div class="rowb"><button class="sm" data-t="${esc(l.key.map(k=>k.t).join(' '))}" onclick="sp(this)">🔊 Nghe cả phần</button></div>`;
 l.key.forEach(k=>{h+=`<div class="kc" style="--c:${l.col}"><span class="e">${k.e}</span><p>${esc(k.t)}</p>${sayB(k.t)}</div>`});
 h+=`<details style="--c:${l.col}"><summary>📚 Đọc thêm (không bắt buộc)</summary>${l.more.map(m=>`<p>${esc(m)} ${sayB(m)}</p>`).join('')}</details><div class="memo"><b>💡 Mẹo nhớ</b><div style="display:flex;gap:8px;align-items:center;justify-content:space-between"><span>${esc(l.tip)}</span>${sayB(l.tip)}</div></div>
 <div class="rowb"><button class="pri" style="--c:${l.col}" onclick="mark('${id}','k');tline('${id}')">Xong. Sang dòng thời gian ➜</button></div>`;
 mount(h)}

function tline(id){
 const l=LS[id];
 let h=bar(`lesson('${id}')`)+hero(id,'2. Dòng thời gian')+`<div class="memo" style="font-size:.85em">Bấm vào từng sự kiện để xem chi tiết. Năm nhỏ hơn thì xảy ra sớm hơn.</div><div class="tm" style="--c:${l.col}">`;
 l.tl.forEach((e,i)=>{h+=`<button class="ev" aria-expanded="false" onclick="evt(this)"><span class="y">${e.s}</span><span class="b"><b>${esc(e.t)}<span class="ar">▾</span></b><span class="d" data-t="${esc('Năm '+e.s+'. '+e.t+'. '+e.d)}">${esc(e.d)}</span></span></button>`});
 h+=`</div><div class="rowb"><button class="pri" style="--c:${l.col}" onclick="mark('${id}','t');people('${id}')">Xong. Sang nhân vật ➜</button></div>`;
 mount(h)}
function evt(b){const o=b.getAttribute('aria-expanded')=='true';b.setAttribute('aria-expanded',!o);b.querySelector('.ar').textContent=o?'▾':'▴';if(!o&&ST.say)speak(b.querySelector('.d').dataset.t)}

const pcards=(list,col)=>`<div class="pcs" style="--c:${col}">${list.map(x=>`<button class="pc" aria-expanded="false" onclick="pc(this)"><span class="ph"><span class="pi">${x.ic}</span><span><b>${esc(x.n)}</b><small>${esc(x.r)}</small></span></span><span class="pd" data-t="${esc(x.n+'. '+x.r+'. '+x.d)}">${esc(x.d)}</span></button>`).join('')}</div>`;
function pc(b){const o=b.getAttribute('aria-expanded')=='true';b.setAttribute('aria-expanded',!o);if(!o&&ST.say)speak(b.querySelector('.pd').dataset.t)}
function people(id){
 const l=LS[id];
 mount(bar(`lesson('${id}')`)+hero(id,'3. Nhân vật')+`<div class="memo" style="font-size:.85em">Bấm vào thẻ để xem nhân vật đã làm gì.</div>`+pcards(l.ppl,l.col)+`<div class="rowb"><button class="pri" style="--c:${l.col}" onclick="mark('${id}','p');startQ('${id}','pr')">Xong. Sang luyện tập ➜</button></div>`)}

/* ================= Toàn cảnh: dòng thời gian lớn, nhân vật ================= */
function tlAll(){
 const ev=[];ORDER.forEach(id=>LS[id].tl.forEach(e=>ev.push({...e,id,col:LS[id].col})));ev.sort((a,b)=>a.y-b.y);
 let h=bar('home()')+`<div class="hero" style="--c:#b45309"><span class="hi">🕰️</span><div><small>Toàn cảnh</small><h1>Dòng thời gian lớn</h1><p>Các sự kiện trong 18 bài, từ thế kỉ IV đến thế kỉ XVIII, của thế giới và Việt Nam, xếp theo năm. Bấm vào một sự kiện để mở bài học.</p></div></div>
 <h2>Các thời kì (kéo sang ngang)</h2><div class="era">`;
 ORDER.slice().sort((a,b)=>LS[a].tl[0].y-LS[b].tl[0].y).forEach(id=>{const l=LS[id];h+=`<button style="--c:${l.col}" onclick="lesson('${id}')"><b>${l.ic} ${SHORT[id]}</b><small>Bài ${l.bai} · ${l.per}</small></button>`});
 h+=`</div>`;let last=0;
 ev.forEach(e=>{const c=Math.ceil(e.y/100);if(c!=last){last=c;h+=`<div class="cent">Thế kỉ ${rom(c)}</div>`}
  h+=`<button class="trow" style="--c:${e.col}" onclick="lesson('${e.id}')"><b class="yr">${e.s}</b><span>${esc(e.t)}<small>${LS[e.id].ic} Bài ${LS[e.id].bai}. ${esc(SHORT[e.id])}</small></span></button>`});
 mount(h)}
function pplAll(){
 let h=bar('home()')+`<div class="hero" style="--c:#7c3aed"><span class="hi">🧑‍🤝‍🧑</span><div><small>Toàn cảnh</small><h1>Nhân vật lịch sử</h1><p>Bấm vào thẻ để xem nhân vật đã làm gì.</p></div></div>`;
 ORDER.forEach(id=>{const l=LS[id];h+=`<div class="chap" style="--c:${l.col}"><span>${l.ic}</span>${l.t}</div>`+pcards(l.ppl,l.col)});
 mount(h)}

/* ================= Câu hỏi ================= */
let g=null;
function prepQ(x){x=JSON.parse(JSON.stringify(x));x.w=0;x.done=0;x.hi=0;x.msg='';x.cls='';x.h=x.h||[];
 if(x.t=='mc'){x.opts=shuf(x.o.map((t,i)=>({t,ok:i==x.a})));x.bad=[]}
 if(x.t=='tf'){x.bad=[]}
 if(x.t=='sort'){x.order=x.items.map((_,i)=>i).sort((a,b)=>x.items[a].y-x.items[b].y);x.pos=[];x.bank=shuf(x.items.map((_,i)=>i))}
 if(x.t=='match'){x.L=x.p.map((_,i)=>i);x.Rr=shuf(x.p.map((_,i)=>i));x.mdone=[];x.sel=null}
 return x}
function startQ(id,mode){
 let qs;
 if(mode=='ez'){qs=LS[id].easy.qs.map(q=>prepQ({t:'mc',q:q.q,o:q.o,a:q.a,h:q.h||['Nghe lại phần “Xem và nghe”: '+LS[id].easy.facts.map(f=>f.t).join(' ')]}))}
 else if(mode=='rv'){let pool=ORDER.filter(i=>Object.keys(P(i).s).length);if(pool.length<2)pool=ORDER.slice();let all=[];pool.forEach(i=>LS[i].qs.forEach(q=>all.push(Object.assign({},q,{from:i}))));qs=shuf(all).slice(0,8).map(prepQ)}
 else{qs=shuf(LS[id].qs).map(prepQ);if(mode=='ts')qs=qs.slice(0,5)}
 g={id,mode,qs,k:0,ok:0,back:mode=='rv'?'home()':`lesson('${id}')`,col:id?LS[id].col:'#15803d'};qView(false)}
const ansText=x=>x.t=='mc'?x.opts.find(o=>o.ok).t:x.t=='tf'?(x.a?'Đúng':'Sai'):x.t=='sort'?x.order.map((i,k)=>(k+1)+'. '+x.items[i].t).join('; '):x.p.map(p=>p[0]+' – '+p[1]).join('; ');
const spoken=x=>x.q+(x.t=='mc'?' Các lựa chọn là: '+x.opts.map(o=>o.t).join('. '):x.t=='tf'?' Đúng hay sai?':'');
function qView(keep){
 const x=g.qs[g.k],n=g.qs.length,ts=g.mode=='ts',ez=g.mode=='ez';
 let dots='';for(let i=0;i<n;i++)dots+=`<i class="${i<g.k?'d':i==g.k?'c':''}"></i>`;
 let b='';
 if(x.t=='mc')b=`<div class="opts">${x.opts.map((o,i)=>`<button class="${x.bad.includes(i)?'no ':''}${x.done&&o.ok?'yes ':''}${!x.done&&x.w>=2&&!ts&&o.ok?'pulse':''}" ${x.done||x.bad.includes(i)?'disabled':''} onclick="pk(${i})">${esc(o.t)}</button>`).join('')}</div>`;
 else if(x.t=='tf')b=`<div class="opts">${[true,false].map(v=>`<button class="${x.bad.includes(v)?'no ':''}${x.done&&x.a===v?'yes ':''}${!x.done&&x.w>=2&&!ts&&x.a===v?'pulse':''}" ${x.done||x.bad.includes(v)?'disabled':''} onclick="pt(${v})">${v?'✔ Đúng':'✖ Sai'}</button>`).join('')}</div>`;
 else if(x.t=='sort')b=`<div class="memo" style="font-size:.85em">Bấm các sự kiện theo thứ tự từ <b>sớm nhất</b> đến <b>muộn nhất</b>.</div><div class="slots">${x.order.map((_,k)=>`<span class="slot ${x.pos[k]!=null?'f':''}"><em>${k+1}</em>${x.pos[k]!=null?esc(x.items[x.pos[k]].t):''}</span>`).join('')}</div><div class="bank">${x.bank.filter(i=>!x.pos.includes(i)).map(i=>`<button onclick="so(${i})">${esc(x.items[i].t)}</button>`).join('')}</div>`;
 else b=`<div class="memo" style="font-size:.85em">Bấm một ô ở bên trái, rồi bấm ô ở bên phải hợp với nó.</div><div class="mt"><div>${x.L.map(i=>`<button class="${x.mdone.includes(i)?'yes ':''}${x.sel===i?'sel':''}" ${x.mdone.includes(i)?'disabled':''} onclick="ml(${i})">${esc(x.p[i][0])}</button>`).join('')}</div><div>${x.Rr.map(i=>`<button class="${x.mdone.includes(i)?'yes':''}" ${x.mdone.includes(i)?'disabled':''} onclick="mr(${i})">${esc(x.p[i][1])}</button>`).join('')}</div></div>`;
 const hn=x.h.slice(0,x.hi).map(t=>`<div class="hint">💡 ${esc(t)}</div>`).join('');
 const hb=(!ts&&!x.done&&x.hi<x.h.length)?`<button class="sm" onclick="hint()">💡 Gợi ý</button>`:'';
 const nb=x.done?`<div class="rowb"><button class="pri" style="--c:${g.col}" onclick="nx()">${g.k<n-1?'Tiếp theo ➜':'Xem kết quả ➜'}</button></div>`:'';
 const tt={pr:'🎲 Luyện tập',ts:'📝 Tự kiểm tra',ez:'🤝 Cùng làm',rv:'🎲 Ôn tập tổng hợp'}[g.mode];
 mount(bar(g.back,hb)+`<h1>${tt}</h1><div class="dots" aria-label="Câu ${g.k+1}/${n}">${dots}</div><div class="box" style="--c:${g.col}"><div class="q"><span>${esc(x.q)}</span>${sayB(spoken(x))}</div>${b}<div>${hn}</div><div id="fb" class="msg ${x.cls}" aria-live="polite">${x.msg}</div>${nb}</div>`,keep);
 if(!x.sp){x.sp=1;if(ST.say)speak(spoken(x))}}
const hint=()=>{const x=g.qs[g.k];if(x.hi<x.h.length){x.hi++;qView(true)}};
function good(){const x=g.qs[g.k];if(x.done)return;x.done=1;if(!x.w)g.ok++;
 const st=R(['🌟','🎈','🏅','🦉','🍀']);
 x.msg=g.mode=='ez'?`<div class="res"><div class="big">${st}</div>Giỏi quá! Em làm đúng rồi.</div>`:R(['Giỏi quá! Em làm đúng rồi.','Chính xác! Tuyệt vời.','Đúng rồi! Em nhớ bài rất tốt.']);
 x.cls='g';if(g.mode!='ts')confetti();qView(true);if(ST.say&&g.mode!='ts')speak(clean(x.msg))}
function bad(extra){const x=g.qs[g.k];if(x.done)return;x.w++;
 if(g.mode=='ts'){x.done=1;x.msg='Đã ghi nhận. Đáp án đúng là: '+esc(ansText(x));x.cls=''}
 else{x.msg=(g.mode=='ez'?'Chưa đúng cũng không sao. Em thử lại nhé.':'Chưa đúng. Em xem gợi ý rồi thử lại nhé.')+(extra?' '+extra:'');x.cls='';if(x.w>=2&&(x.t=='mc'||x.t=='tf'))x.msg+=' Đáp án đúng đang nhấp nháy.'}
 qView(true);if(ST.say)speak(clean(x.msg))}
function pk(i){const x=g.qs[g.k];if(x.done)return;if(x.opts[i].ok)good();else{if(g.mode!='ts')x.bad.push(i);bad()}}
function pt(v){const x=g.qs[g.k];if(x.done)return;if(x.a===v)good();else{if(g.mode!='ts')x.bad.push(v);bad()}}
function so(i){const x=g.qs[g.k];if(x.done)return;if(i==x.order[x.pos.length]){x.pos.push(i);if(x.pos.length==x.order.length)good();else{x.msg='Đúng rồi! Tiếp tục nhé.';x.cls='g';qView(true)}}else{const nxt=x.items[x.order[x.pos.length]].t;bad(x.w>=2&&g.mode!='ts'?'Gợi ý: sự kiện kế tiếp là “'+nxt+'”.':'')}}
function ml(i){const x=g.qs[g.k];if(x.done)return;x.sel=i;x.msg='';x.cls='';qView(true)}
function mr(i){const x=g.qs[g.k];if(x.done)return;if(x.sel==null){x.msg='Em bấm một ô ở bên trái trước nhé.';x.cls='';return qView(true)}
 if(x.sel==i){x.mdone.push(i);x.sel=null;if(x.mdone.length==x.p.length)good();else{x.msg='Đúng rồi! Nối tiếp nhé.';x.cls='g';qView(true)}}
 else{const s=x.sel;x.sel=null;bad(x.w>=2&&g.mode!='ts'?'Gợi ý: “'+x.p[s][0]+'” hợp với “'+x.p[s][1]+'”.':'')}}
function nx(){g.k++;if(g.k<g.qs.length)qView(false);else fin()}
function fin(){
 const n=g.qs.length,k=g.ok,id=g.id,m=g.mode,r=k/n;let h='';
 if(m=='ts'){const p=P(id);p.best=Math.max(p.best||0,r);p.s.ts=1;p.n=(p.n||0)+1;save();
  const s=r>=.8?3:r>=.6?2:1;h=`<div class="res"><div class="big">${r>=.8?'🏆':r>=.6?'👍':'💪'}</div><div class="sc">${k}/${n} câu đúng ngay lần đầu</div><div class="stars" style="font-size:2rem">${'★'.repeat(s)}${'☆'.repeat(3-s)}</div><p>${r>=.8?'Em làm rất tốt!':r>=.6?'Em làm khá tốt!':'Em cần luyện thêm một chút. Em cố lên nhé!'}</p></div>`;if(r>=.6)confetti()}
 else if(m=='ez'){mark(id,'c');h=`<div class="res"><div class="big">${R(['🌟','🎈','🏅','🦉'])}</div><div class="sc">Em đã hoàn thành bài học!</div><p>Em được tặng một sticker. Giỏi quá!</p></div>`;confetti()}
 else{if(m=='pr')mark(id,'pr');h=`<div class="res"><div class="big">${r>=.8?'🌟':'👏'}</div><div class="sc">${k}/${n} câu đúng ngay lần đầu</div><p>${r>=.8?'Em làm rất tốt!':'Em đã cố gắng rất nhiều. Làm lại để nhớ lâu hơn nhé.'}</p></div>`;if(r>=.6)confetti()}
 const next=m=='rv'?'':m=='pr'?`<button class="pri" style="--c:${g.col}" onclick="startQ('${id}','ts')">📝 Sang tự kiểm tra</button>`:'';
 mount(bar(g.back)+`<h1>Kết quả</h1><div class="box" style="--c:${g.col}">${h}<div class="rowb">${next}<button onclick="startQ(${id?`'${id}'`:'null'},'${m}')">🔁 Làm lại</button><button onclick="${g.back}">⬅ Về bài học</button><button onclick="home()">🏠 Trang chủ</button></div></div>`);
 if(ST.say&&m!='ts')speak(clean(h))}

/* ================= Tiến bộ và báo cáo ================= */
function reportText(){
 const rows=ORDER.map(id=>{const p=P(id),d=done(id),n=stepsOf().length;if(!d)return null;return '- '+nm(id)+': đã làm '+d+'/'+n+' bước'+(!LV2()&&p.best!=null?', kiểm tra tốt nhất '+Math.round(p.best*100)+'%':'')}).filter(Boolean);
 return 'BÁO CÁO HỌC LỊCH SỬ 7 (Kết nối tri thức)\nHọc sinh: '+(ST.name||'(chưa ghi tên)')+'\nCách học: '+(LV2()?'Mức 2 – mục tiêu riêng (không chấm điểm)':'Mức 1 – chương trình giảm nhẹ')+'\nNgày: '+new Date().toLocaleDateString('vi-VN')+'\n\n'+(rows.length?rows.join('\n'):'Em chưa học bài nào.')+'\n\nTổng: '+ORDER.filter(lessonDone).length+'/'+ORDER.length+' bài đã hoàn thành.'}
function prog(){
 let h=bar('home()')+`<div class="hero" style="--c:#2563eb"><span class="hi">📊</span><div><small>Tiến bộ</small><h1>Em đã làm được gì?</h1><p>Dữ liệu chỉ lưu trên máy này.</p></div></div>
 <div class="card"><table class="tb"><tr><th>Bài</th><th>Bước</th>${LV2()?'':'<th>Kiểm tra</th>'}</tr>${ORDER.map(id=>{const p=P(id);return `<tr><td>${LS[id].ic} Bài ${LS[id].bai}. ${esc(SHORT[id])}</td><td>${done(id)}/${stepsOf().length}</td>${LV2()?'':`<td>${p.best!=null?Math.round(p.best*100)+'%':'–'}</td>`}</tr>`}).join('')}</table></div>
 <div class="card"><b>📤 Gửi báo cáo cho thầy cô</b><div class="nr"><input id="nm" maxlength="30" autocomplete="off" placeholder="Tên của em" value="${esc(ST.name||'')}" aria-label="Tên của em"></div><textarea id="rt" readonly style="width:100%;min-height:170px;font:inherit;font-size:.8em;padding:10px;border:3px solid var(--bd);border-radius:14px;background:var(--cd);color:var(--tx)"></textarea>
 <div class="rowb"><button id="rcp">📋 Sao chép</button><button id="rsh">📲 Chia sẻ</button></div><div id="rm" class="msg" style="min-height:0"></div></div>
 <div class="rowb"><button onclick="resetAll()">🗑️ Xóa tiến độ trên máy này</button></div>`;
 mount(h);
 const n=document.getElementById('nm'),t=document.getElementById('rt'),m=s=>document.getElementById('rm').textContent=s;
 const up=()=>{ST.name=n.value.trim();save();t.value=reportText()};n.oninput=up;up();
 document.getElementById('rcp').onclick=()=>{try{navigator.clipboard.writeText(t.value).then(()=>m('✅ Đã sao chép. Em dán vào tin nhắn gửi thầy cô nhé.'),()=>{t.select();m('Em bấm giữ và chọn Sao chép nhé.')})}catch(e){t.select();m('Em bấm giữ và chọn Sao chép nhé.')}};
 document.getElementById('rsh').onclick=()=>{if(navigator.share)navigator.share({title:'Báo cáo học Lịch sử 7',text:t.value}).catch(()=>{});else m('Máy này chưa hỗ trợ chia sẻ. Em dùng nút Sao chép nhé.')}}
function resetAll(){if(confirm('Xóa toàn bộ tiến độ học Lịch sử trên máy này?')){ST.p={};save();prog()}}

(ST.lv?home:start)();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
